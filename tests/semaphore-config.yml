---
# ─────────────────────────────────────────────────────────────────────────────
# THE SEMAPHORE CONTRACT: PINS, EXPOSURE, IDENTITY, SECRETS, AUTHORITY.
#
#   ansible-playbook tests/semaphore-config.yml
#
# Controller-only: reads files, connects to nothing, installs nothing.
# ─────────────────────────────────────────────────────────────────────────────
- name: The Semaphore configuration contract
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../roles/semaphore/defaults/main.yml

  vars:
    config_tpl: "{{ lookup('file', '../roles/semaphore/templates/config.json.j2') }}"
    # The same template with its Jinja comment blocks removed, so a scan
    # looking for forbidden values cannot match the prose that explains why
    # they are forbidden.
    # ⚠️ \\{ and \\}, not \{ and \} — a double-quoted YAML scalar processes
    # backslash escapes before Jinja ever sees the string, and \{ is not one
    # of them ("found unknown escape character").
    config_code: "{{ lookup('file', '../roles/semaphore/templates/config.json.j2') | regex_replace('(?s)\\{#.*?#\\}', '') }}"
    plist_tpl: "{{ lookup('file', '../roles/semaphore/templates/launchd.plist.j2') }}"
    # Same treatment for the plist: strip XML and Jinja comments, because its
    # header explains exactly which secrets must never appear in it, and a
    # naive scan matches that explanation.
    plist_code: "{{ lookup('file', '../roles/semaphore/templates/launchd.plist.j2') | regex_replace('(?s)<!--.*?-->', '') | regex_replace('(?s)\\{#.*?#\\}', '') }}"
    defaults_raw: "{{ lookup('file', '../roles/semaphore/defaults/main.yml') }}"
    helper: "{{ lookup('file', '../roles/semaphore/templates/semaphore-bootstrap-admin.sh.j2') }}"
    # Comment-stripped, so the header explaining what must NOT appear
    # cannot trip a scan looking for exactly those things.
    helper_code: "{{ lookup('file', '../roles/semaphore/templates/semaphore-bootstrap-admin.sh.j2') | regex_replace('(?m)^\\s*#.*$', '') }}"

  tasks:
    # ── THE RELEASE IS PINNED, NOT FLOATING ────────────────────────────────
    - name: The version is an exact release, never a moving target
      ansible.builtin.assert:
        that:
          - semaphore_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - semaphore_version == '2.19.12'
          - semaphore_edition == 'community'
          - not (semaphore_release_base is search('latest'))
          - not (semaphore_release_base is search('docker\.io|hub\.docker'))
        fail_msg: >-
          semaphore_version must be an exact semantic version and the source
          must be the official GitHub release. `latest`, a prerelease, a
          Docker Hub image or a Homebrew formula would mean the controller
          could change underneath the repository.
        success_msg: >-
          Pinned to {{ semaphore_version }} ({{ semaphore_edition }}) from
          the official GitHub release.

    - name: Every artifact carries a full SHA-256
      # ⚠️ 64 HEX CHARACTERS, CHECKED. A truncated or placeholder digest
      # would make get_url's verification silently weaker rather than
      # failing loudly.
      ansible.builtin.assert:
        that:
          - (semaphore_checksums | length) >= 2
          - (semaphore_checksums.values() | select('match', '^[0-9a-f]{64}$') | list | length)
            == (semaphore_checksums | length)
          - (semaphore_artifacts.keys() | sort) == (semaphore_checksums.keys() | sort)
        fail_msg: >-
          Every pinned platform needs a full 64-character SHA-256 and a
          matching artifact entry. Have artifacts for
          {{ semaphore_artifacts.keys() | list | join(', ') }} and checksums
          for {{ semaphore_checksums.keys() | list | join(', ') }}.
        success_msg: >-
          {{ semaphore_checksums | length }} platforms pinned, each with a
          full SHA-256.

    - name: The artifacts are the community build of the pinned version
      ansible.builtin.assert:
        that:
          - (semaphore_artifacts.values() | select('search', 'community') | list | length)
            == (semaphore_artifacts | length)
          - (semaphore_artifacts.values() | select('search', semaphore_version) | list | length)
            == (semaphore_artifacts | length)
        fail_msg: >-
          Each artifact filename must name the community edition and the
          pinned version. The standard build reports a different version
          string and bundles licensed features this installation cannot use.
        success_msg: "All artifacts are community builds of the pinned version."

    # ── EXPOSURE ───────────────────────────────────────────────────────────
    - name: The listener is loopback only
      # ⚠️ THE ENTIRE EXPOSURE MODEL FOR THIS MILESTONE. Semaphore has no TLS
      # here, no reverse proxy and nothing in front of its login. A LAN
      # listener publishes a console that can run playbooks against every
      # host in the inventory.
      ansible.builtin.assert:
        that:
          - semaphore_interface == '127.0.0.1'
          - (semaphore_port | int) == 3000
          # ⚠️ The patterns deliberately stop before the colon. Written in
          # full they contain ": ", and an unquoted conditional item holding
          # ": " is parsed by YAML as a MAPPING — the defect that killed a
          # CoreDNS deployment on its last task, and which this very suite
          # hit on its first run.
          - config_code is search('\{\{ semaphore_interface \}\}')
          - config_code is search('\{\{ semaphore_port \}\}')
          # ⚠️ SCANNED WITHOUT ITS COMMENTS, because the first version
          # failed on its own documentation: the template's Jinja comment
          # explains that nothing binds 0.0.0.0, and the check matched that
          # sentence. Fifth time a text search in this repository has
          # matched prose instead of code.
          - not (config_code is search('0\.0\.0\.0'))
        fail_msg: >-
          The listener must be 127.0.0.1:3000 and the template must take
          both from variables. Binding 0.0.0.0 exposes the operator console
          to the LAN, which needs the separate TLS and semaphore.dc1.lan
          decision first.
        success_msg: "Listener pinned to 127.0.0.1:3000, from variables."

    # ── IDENTITY ───────────────────────────────────────────────────────────
    - name: The service runs as its own account, not root and not the operator
      ansible.builtin.assert:
        that:
          - semaphore_user not in ['root', 'dc1-arm-1', 'admin']
          - semaphore_group not in ['wheel', 'admin', 'staff']
          - semaphore_user is match('^_')
          - plist_code is search('<key>UserName</key>')
          - plist_code is search('\{\{ semaphore_user \}\}')
          - not (plist_code is search('<string>root</string>'))
        fail_msg: >-
          Semaphore must run as a dedicated, underscore-prefixed service
          account — never root, never the human controller account. It
          executes playbooks; its identity is the blast radius of every job
          it runs.
        success_msg: "Runs as {{ semaphore_user }}:{{ semaphore_group }}."

    - name: PRODUCTION ALWAYS MANAGES THE DEDICATED ACCOUNT
      # ⚠️ THE ESCAPE HATCH MUST STAY AN ESCAPE HATCH. The disposable macOS
      # harness sets semaphore_manage_account=false so it creates no real
      # account on a workstation. If that ever became the default, the
      # controller would quietly run Semaphore as whoever applied the
      # playbook — most likely the operator, with their SSH keys — and no
      # other check would notice.
      ansible.builtin.assert:
        that:
          - semaphore_manage_account | bool
        fail_msg: >-
          semaphore_manage_account must default to true. Running as an
          existing account is a disposable-test override, not a deployment
          mode; as a default it would hand every Semaphore job the
          privileges of whoever ran the playbook.
        success_msg: "Production manages the dedicated service account."

    # ── SECRETS ────────────────────────────────────────────────────────────
    - name: No secret has a usable default
      # ⚠️ EVERY ONE RESOLVES TO EMPTY WITHOUT THE VAULT, and empty is
      # treated as absent by preflight-secrets.yml. A default that happened
      # to be a working value would mean an installation whose encryption
      # key is in Git.
      ansible.builtin.assert:
        that:
          - (semaphore_cookie_hash | default('') | length) == 0
          - (semaphore_cookie_encryption | default('') | length) == 0
          - (semaphore_access_key_encryption | default('') | length) == 0
          - (semaphore_admin_password | default('') | length) == 0
        fail_msg: >-
          A secret resolved to a non-empty value with no vault loaded, which
          means defaults/main.yml contains usable key material. It must only
          reference vault variables.
        success_msg: "All four secrets are empty without the vault."

    - name: The defaults reference vault variables and contain no key material
      ansible.builtin.assert:
        that:
          - defaults_raw is search('vault_semaphore_cookie_hash')
          - defaults_raw is search('vault_semaphore_cookie_encryption')
          - defaults_raw is search('vault_semaphore_access_key_encryption')
          - defaults_raw is search('vault_semaphore_admin_password')
          # Nothing that looks like a 32-byte base64 key, outside comments.
          - (defaults_code | regex_findall('[A-Za-z0-9+/]{43}=') | length) == 0
        fail_msg: >-
          defaults/main.yml must reference the four vault variables and must
          contain nothing resembling base64 key material.
        success_msg: "Defaults reference the vault and carry no key material."
      vars:
        defaults_code: >-
          {{ defaults_raw | regex_replace('(?m)^\s*#.*$', '') }}

    - name: The administrator password floor is real
      ansible.builtin.assert:
        that:
          - (semaphore_admin_password_min_length | int) >= 16
          - semaphore_admin_login not in ['admin', 'root']
        fail_msg: >-
          The administrator password floor must be at least 16 characters,
          and the login must not be a default name. This account can run
          playbooks against every host in the inventory.
        success_msg: >-
          Administrator "{{ semaphore_admin_login }}", minimum password
          length {{ semaphore_admin_password_min_length }}.

    - name: The launchd job carries no secret
      # ⚠️ THE PLIST IS WORLD-READABLE BY DESIGN — launchd reads it as root
      # before any user context exists. A secret in EnvironmentVariables
      # would be readable by every local account.
      ansible.builtin.assert:
        that:
          # ⚠️ THE COMMENT-STRIPPED VIEW. The plist header explains exactly
          # which secrets must never appear in it, so scanning the raw file
          # matches that explanation and fails on correct code.
          - not (plist_code is search('cookie_hash'))
          - not (plist_code is search('cookie_encryption'))
          - not (plist_code is search('access_key_encryption'))
          - not (plist_code is search('semaphore_admin_password'))
          - plist_code is search('\{\{ semaphore_config_path \}\}')
        fail_msg: >-
          The launchd plist must name the config path, never a secret. It is
          world-readable; anything in it is public to local accounts.
        success_msg: "The plist references the config path and holds no secret."

    # ── THE FIRST-ADMINISTRATOR BOOTSTRAP CONTRACT ─────────────────────────
    #
    # ⚠️ THE ROLE MUST NOT BE ABLE TO CREATE A USER AT ALL. v2.19.12's
    # `users add` takes the password as a command-line flag, where any local
    # account can read it from `ps`; no_log hides it from Ansible's log and
    # from nothing else. The capability was removed rather than defaulted
    # off, because a flag that exists can be switched on.
    - name: THE ROLE NEVER CREATES A USER, AND NEVER HANDLES A PASSWORD ARGUMENT
      ansible.builtin.assert:
        that:
          - not (role_code is search('users\s+add'))
          - not (role_code is search('--password'))
          - not (role_code is search('semaphore_admin_bootstrap_enabled'))
          # The role installs the helper; it must never execute it.
          - not (role_code is search('command.*semaphore-bootstrap-admin'))
        fail_msg: >-
          A role task references `users add`, `--password`, the removed
          bootstrap flag, or executes the interactive helper. The role
          cannot create an administrator: the only supported mechanism puts
          the password in argv, and the safe one is interactive.
        success_msg: >-
          The role creates no user, handles no password argument and never
          runs the helper.
      vars:
        # ⚠️ COMMENT-STRIPPED. admin.yml's header explains at length why
        # `users add --password` was rejected, so scanning the raw text
        # matches that explanation and fails on correct code. This is the
        # sixth time a text search in this repository has matched prose
        # rather than the thing it forbids.
        role_code: >-
          {{ (lookup('file', '../roles/semaphore/tasks/admin.yml')
              ~ lookup('file', '../roles/semaphore/tasks/main.yml')
              ~ lookup('file', '../roles/semaphore/tasks/database.yml'))
             | regex_replace('(?m)^\s*#.*$', '') }}

    - name: THE HELPER TAKES ITS PASSWORD ONLY FROM AN INTERACTIVE TERMINAL
      ansible.builtin.assert:
        that:
          # Typed, with echo off.
          - helper is search('read -rs PW')
          - helper is search('read -rs PW2')
          # Never an argument, never an environment variable.
          - not (helper_code is search('PW="\$1"'))
          - not (helper_code is search('PW="\$\{SEMAPHORE'))
          - not (helper_code is search('\$\{SEMAPHORE_ADMIN_PASSWORD'))
          # An interactive terminal is required, so it cannot be scripted.
          - helper is search('\[ -t 0 \] && \[ -t 1 \]')
          - helper is search('no interactive terminal')
        fail_msg: >-
          The bootstrap helper must read the password with `read -rs` from a
          real terminal, and must accept it from no other source — not an
          argument, not an environment variable, not a file.
        success_msg: "The helper accepts a password only from an interactive terminal."

    - name: THE HELPER REFUSES EVERY UNSAFE PRECONDITION
      ansible.builtin.assert:
        that:
          # An existing user: this bootstraps the FIRST administrator only.
          - helper is search('SELECT count\(\*\) FROM user')
          - helper is search('already has \$USERS user')
          # ⚠️ THE CONDITION THAT MAKES THE KEY SWAP SAFE. Every Key Store
          # secret is encrypted with access_key_encryption; replacing the
          # key after one exists makes it permanently unreadable.
          - helper is search('SELECT count\(\*\) FROM access_key')
          - helper is search('permanently undecryptable')
          # A running service would race the database and hold the config.
          - helper is search('the Semaphore service is')
          # Once only.
          - helper is search('bootstrap already completed')
          # The temporary config goes, on success AND on failure — setup
          # writes it 0644, with its throwaway key material in it.
          - helper is search('trap cleanup EXIT INT TERM')
          - helper is search('removed the temporary setup configuration')
        fail_msg: >-
          The bootstrap helper must refuse when a user exists, when any Key
          Store credential exists, when the service is running, or when it
          has already run — and must remove its temporary configuration on
          both success and failure.
        success_msg: "The helper refuses every unsafe precondition."
      vars: {}

    # ── FILESYSTEM ─────────────────────────────────────────────────────────
    - name: Durable state lives outside homes and outside /tmp
      ansible.builtin.assert:
        that:
          - not (semaphore_state_dir is search('^/Users/'))
          - not (semaphore_conf_dir is search('^/Users/'))
          - not (semaphore_log_dir is search('^/Users/'))
          - not (semaphore_tmp_path is search('^/tmp'))
          - semaphore_db_path is search('^' ~ semaphore_state_dir)
          - semaphore_versioned_dir is search(semaphore_version)
        fail_msg: >-
          Semaphore state must not sit in a user home or in /tmp, which
          macOS prunes, and the binary directory must be versioned so an
          upgrade is a new directory and a moved link.
        success_msg: "Paths are durable, versioned and outside user homes."

    # ── GIT REMAINS THE AUTHORITY ──────────────────────────────────────────
    - name: Semaphore consumes Git; it does not replace it
      # ⚠️ THE AUTHORITY MODEL, WRITTEN DOWN. Semaphore is an operator UI and
      # a job runner. The inventory and the playbooks it runs come from this
      # repository on a reviewed branch; a host list edited in its database
      # would be a second source of truth that drifts silently.
      ansible.builtin.assert:
        that:
          - semaphore_repo_url is search('github\.com/meetyaks/home-datacenter-starter')
          - semaphore_repo_branch == 'main'
          - semaphore_project_name | length > 0
        fail_msg: >-
          The Semaphore project must point at this repository's main branch.
          Infrastructure changes are reviewed Git changes; the UI runs what
          Git says, it does not hold its own copy.
        success_msg: >-
          Project "{{ semaphore_project_name }}" tracks
          {{ semaphore_repo_url }} on {{ semaphore_repo_branch }}.

    - name: Done
      ansible.builtin.debug:
        msg: >-
          Semaphore {{ semaphore_version }} ({{ semaphore_edition }}) pinned
          by checksum, loopback-only on {{ semaphore_interface }}:{{ semaphore_port }},
          running as {{ semaphore_user }}, no secret with a usable default,
          and Git remains the source of truth.
