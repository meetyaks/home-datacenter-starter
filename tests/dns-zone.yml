        success_msg: "The router's required settings are documented."
      vars:
        doc: "{{ lookup('file', '../docs/dc1-lan-dns.md') }}"

    - name: Done
      ansible.builtin.debug:
        msg: >-
          dc1.lan serves three records from two nodes that render an identical
