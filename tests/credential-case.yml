---
# One deploy-key case for tests/credential-contract.yml. Puts a key fixture
# into a specific wrong state and runs the ROLE'S OWN credential preflight
# against it.
#
# ⚠️ IT RUNS roles/keel_reconcile/tasks/credentials.yml. Nothing here
# re-implements a single assertion — a harness carrying its own copy of the
# contract would pass against a contract the role does not have.

- name: "{{ case.name }} — clear the previous fixture"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ fixture_dir }}/deploy-key"
    - "{{ fixture_dir }}/known_hosts"

- name: "{{ case.name }} — write the deploy key"
  ansible.builtin.copy:
    # ⚠️ NOT KEY MATERIAL, AND NOT EVEN FAKE KEY MATERIAL. The preflight
    # checks existence, mode and ownership; it never reads the contents. A
    # file saying so is clearer than a plausible-looking PEM that a future
    # reader has to decide about.
    content: "not a key — a fixture for the preflight's mode and owner checks\n"
    dest: "{{ fixture_dir }}/deploy-key"
    mode: "{{ case.mode | default('0400') }}"
  when: case.state == 'present'

- name: "{{ case.name }} — pin host keys, unless the case is about not pinning them"
  ansible.builtin.copy:
    content: "github.com ssh-ed25519 AAAAfixture\n"
    dest: "{{ fixture_dir }}/known_hosts"
    mode: "0444"
  when: (case.known_hosts | default('present')) == 'present'

- name: "{{ case.name }} — run the role's own credential preflight"
  block:
    - name: "{{ case.name }} — include credentials.yml"
      ansible.builtin.include_tasks: ../roles/keel_reconcile/tasks/credentials.yml
      vars:
        keel_reconcile_deploy_key: "{{ fixture_dir }}/deploy-key"
        keel_reconcile_known_hosts: "{{ fixture_dir }}/known_hosts"
        keel_reconcile_channel_repo: "{{ case.repo | default('git@github.com:meetyaks/keel.git') }}"
        keel_reconcile_channel_branch: release/dev
        # ⚠️ A USER THAT CANNOT OWN THE FIXTURE, for the ownership case. The
        # fixture is written by whoever runs this suite, so naming a
        # different account is what makes the mis-ownership real without
        # needing root to chown anything.
        keel_reconcile_controller_user: "{{ case.owner | default(lookup('env', 'USER')) }}"
        keel_reconcile_ssh_command: >-
          ssh -i {{ fixture_dir }}/deploy-key
          -o IdentitiesOnly=yes
          -o IdentityAgent=none
          -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile={{ fixture_dir }}/known_hosts

    - name: "{{ case.name }} — it was accepted"
      ansible.builtin.set_fact:
        cred_result: accepted
        cred_error: ""

  rescue:
    - name: "{{ case.name }} — it was refused"
      # A looped task's own `msg` is "One or more items failed"; the reasons
      # are in `.results`, and the reason is the whole point of checking.
      ansible.builtin.set_fact:
        cred_result: refused
        cred_error: >-
          {{ (ansible_failed_result.msg | default('')) ~ ' | ' ~
             (ansible_failed_result.results | default([])
              | selectattr('failed', 'defined') | selectattr('failed')
              | map(attribute='msg') | join(' | ')) }}

- name: "{{ case.name }} — it was refused, as it must be"
  ansible.builtin.assert:
    that:
      - cred_result == 'refused'
    fail_msg: >-
      {{ case.name }}: the credential preflight ACCEPTED this. A deploy key
      in that state either cannot be read by the scheduler, or can be read by
      somebody else — and finding out at 3am, unattended, is the outcome this
      preflight exists to prevent.
    success_msg: "{{ case.name }} → refused"

- name: "{{ case.name }} — and refused for its own reason"
  # ⚠️ A REFUSAL FOR THE WRONG REASON IS NOT A PASS. Every fixture here is
  # wrong in exactly one way; if the message does not name that way, the
  # preflight rejected it by accident and the intended check is untested.
  ansible.builtin.assert:
    that:
      - cred_error is search(case.because)
    fail_msg: >-
      {{ case.name }}: refused, but for the wrong reason. Expected a message
      matching /{{ case.because }}/ and got: {{ cred_error }}
    success_msg: "{{ case.name }} → refused because {{ case.because }}"
