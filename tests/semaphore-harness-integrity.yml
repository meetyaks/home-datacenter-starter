---
# ─────────────────────────────────────────────────────────────────────────────
# THE SEMAPHORE HARNESSES MUST STAY HARNESSES.
#
#   ansible-playbook tests/semaphore-harness-integrity.yml
#
# ⚠️ A BROKEN HARNESS PASSES. The macOS harness runs a real launchd daemon on
# the management node beside the LAN's live resolver. Its safety rests on
# properties that are invisible once written and that running it would never
# reveal as missing: a unique label, a confined prefix, teardown that always
# runs and can re-authenticate, and assertions that can tell a restarted
# daemon from a stale one.
#
# Every lesson encoded here was paid for during the CoreDNS rollout.
#
# Controller-only: reads files, runs nothing.
# ─────────────────────────────────────────────────────────────────────────────
- name: The Semaphore end-to-end harnesses
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    macos: "{{ lookup('file', '../tests/run-semaphore-launchd.sh') }}"
    linux: "{{ lookup('file', '../tests/run-semaphore-linux.sh') }}"
    backup: "{{ lookup('file', '../roles/semaphore/templates/semaphore-backup.sh.j2') }}"

  tasks:
    - name: The disposable launchd label is unique and never the production one
      # ⚠️ THE PRODUCTION LABEL IS org.dc1.semaphore. A harness using it would
      # bootout the real controller UI and then remove its prefix.
      ansible.builtin.assert:
        that:
          - macos is search('LABEL="org\.dc1\.semaphoredisposable\$\{STAMP\}"')
          - not (macos is search('LABEL="org\.dc1\.semaphore"'))
          - macos is search('STAMP=\$\$-\$\(date')
        fail_msg: >-
          tests/run-semaphore-launchd.sh must build a per-run unique label
          and must never use the production label org.dc1.semaphore.
        success_msg: "The disposable label is unique and distinct from production."

    - name: Teardown is trapped on success, failure AND interrupt
      ansible.builtin.assert:
        that:
          - macos is search('trap teardown EXIT INT TERM')
          - linux is search('trap cleanup EXIT INT TERM')
        fail_msg: >-
          Both harnesses must trap teardown on EXIT, INT and TERM. Without
          it an interrupted run leaves a launchd daemon loaded, a prefix on
          disk, or the handler flush removed from the role.
        success_msg: "Teardown is trapped on success, failure and interrupt."

    - name: Teardown re-authenticates rather than failing silently
      # ⚠️ Teardown removes a root-owned daemon and prefix. With bare
      # `sudo -n`, every removal fails silently once the grace period lapses
      # — leaving a live disposable daemon while printing a clean teardown.
      ansible.builtin.assert:
        that:
          - macos is search('tsudo\(\)')
          - macos is search('tsudo launchctl bootout')
          - macos is search('tsudo rm -rf "\$ROOT"')
          - macos is search('TEARDOWN DID NOT COMPLETE')
        fail_msg: >-
          macOS teardown must re-authenticate if the sudo timestamp expired,
          and must print exact scoped recovery commands if it could not
          finish.
        success_msg: "Teardown re-authenticates and states how to finish if it cannot."

    - name: Teardown identifies its processes by prefix, not by a stale PID
      # ⚠️ "no longer ours" USED TO MEAN TWO THINGS, AND ONE LEAKED A DAEMON.
      # Between a `kill -0` and a `ps` the process can exit, so a process
      # that WAS ours reads as somebody else's and is deliberately spared.
      ansible.builtin.assert:
        that:
          - macos is search('for _p in \$\(pgrep -f "\$ROOT/sbin/semaphore"')
          - macos is search('/\*/semaphore-disposable\.\*\)')
          - macos is search('REFUSING to remove unexpected path')
        fail_msg: >-
          Teardown must find its processes by this run's prefix rather than
          a PID captured earlier, and must refuse any path that is not its
          own mktemp prefix.
        success_msg: "Teardown identifies by prefix and refuses foreign paths."

    - name: The live baseline must be non-empty before anything disposable starts
      # ⚠️ THE VACUOUS-PROOF TRAP. Every non-interference check is an
      # equality test; an empty baseline makes "" = "" hold afterwards and
      # the harness reports passes having measured nothing.
      ansible.builtin.assert:
        that:
          - macos is search('the live baseline is non-empty')
          - macos is search('REFUSING TO RUN')
          - macos is search('LIVE_PID_BEFORE')
        fail_msg: >-
          The macOS harness must refuse to run when any part of the live
          baseline is empty.
        success_msg: "An empty live baseline refuses the run."

    - name: A run that cannot reach launchd is a failure, not a pass
      ansible.builtin.assert:
        that:
          - macos is search('sudo was granted, so the launchd path can be exercised')
          - not (macos is search('skip "sudo was not granted'))
        fail_msg: >-
          Denied sudo must fail the run, not skip it. The launchd path is
          the half of this role no other test can reach.
        success_msg: "Denied sudo fails the run rather than reporting a pass."

    - name: Both harnesses prove the PID changed after a config change
      ansible.builtin.assert:
        that:
          - macos is search('the daemon was RESTARTED before verification')
          - linux is search('the service RESTARTED before verification')
        fail_msg: >-
          Both harnesses must assert the PID CHANGED after a configuration
          change. Without it they cannot distinguish a restarted daemon from
          the stale one the flush exists to prevent.
        success_msg: "Both harnesses require a PID change after reconfiguration."

    - name: Both harnesses require a genuine no-op on an unchanged rerun
      ansible.builtin.assert:
        that:
          - macos is search('third run reported changed=0')
          - linux is search('third run reported changed=0')
          - macos is search('no restart on the no-op run')
          - linux is search('no restart on the no-op run')
        fail_msg: >-
          Both harnesses must assert changed=0 AND no restart on an
          unchanged rerun.
        success_msg: "Both harnesses require changed=0 and no restart on rerun."

    - name: Neither RED mutation leaves an orphaned task behind
      # Removing only the `meta:` line leaves a `- name:` with no module;
      # Ansible dies parsing and the RED checks pass trivially.
      ansible.builtin.assert:
        that:
          - macos is search('no orphaned task left behind')
          - linux is search('no orphaned task left behind')
          - not (macos is search('print unless /ansible\\.builtin\\.meta'))
          - not (linux is search('print unless /ansible\\.builtin\\.meta'))
        fail_msg: >-
          Both RED mutations must remove the whole flush task and refuse to
          continue if the task name survived without its module.
        success_msg: "Neither RED mutation can leave an orphaned task behind."

    - name: The Linux harness starts from a host with nothing of ours on it
      ansible.builtin.assert:
        that:
          - linux is search('no semaphore binary in the image')
          - linux is search('no _semaphore account')
          - linux is search('never on a command line')
        fail_msg: >-
          The Linux harness must assert the image ships no semaphore binary
          and no service account before the role runs, and must deliver its
          throwaway secrets through a file rather than a command line.
        success_msg: "The Linux harness proves it starts from a clean host."

    - name: The backup uses a WAL-safe mechanism, never a live file copy
      # ⚠️ SQLITE RUNS IN WAL MODE — verified against the real binary, which
      # leaves -wal and -shm sidecars. Copying the main file alone yields a
      # backup silently missing recent writes.
      ansible.builtin.assert:
        that:
          - backup is search('VACUUM INTO')
          - backup is search('integrity_check')
          - not (backup_code is search('^cp '))
        fail_msg: >-
          The backup must use SQLite's VACUUM INTO and verify the result,
          never copy a live WAL database with cp.
        success_msg: "Backup uses VACUUM INTO and checks its own integrity."
      vars:
        backup_code: >-
          {{ backup | regex_replace('(?m)^\s*#.*$', '') }}

    # ── THE macOS ACCOUNT LIFECYCLE ────────────────────────────────────────
    - name: THE ACCOUNT GATE USES A DISPOSABLE IDENTITY, NEVER PRODUCTION'S
      # ⚠️ THE WORST OUTCOME OF THIS TEST IS AN ORPHANED ACCOUNT, and the
      # second worst is touching `_semaphore`. The name is generated per
      # run, validated against an exact pattern, and production's name is
      # refused explicitly in both creation and deletion.
      ansible.builtin.assert:
        that:
          - macos is search('TEST_USER="_semt\$\(openssl rand -hex 4\)"')
          # Quoted: an unquoted item containing ": " parses as a mapping.
          - "macos is search('refusing: generated the PRODUCTION name')"
          - "macos is search('REFUSING: that is the PRODUCTION account')"
          - macos is search('_semaphore remains absent')
        fail_msg: >-
          The account gate must generate a per-run `_semt<hex>` identity and
          refuse production's name both when creating and when deleting. An
          orphaned account, or any change to _semaphore, is the worst
          residue this test can leave.
        success_msg: "The disposable identity is generated, validated and never _semaphore."

    - name: THE DISPOSABLE PREFIX IS REACHABLE BY THE SERVICE ACCOUNT
      # ⚠️ THE CONTROLLER GATE FOUND THIS. `mktemp -d -t` puts the prefix
      # under $TMPDIR, which on macOS is drwx------ and owned by the
      # operator. The disposable service account cannot traverse it, so the
      # role installed the binary and then died running it:
      #
      #   Permission denied: .../semaphore-disposable.XXXXXX/sbin/semaphore
      #
      # No mode on the prefix helps — the PARENT denies access. The Linux
      # container never exposed it because its paths are world-traversable,
      # which is the same Linux/macOS asymmetry that produced the ss/lsof
      # and getent defects earlier in this PR.
      ansible.builtin.assert:
        that:
          - macos is search('mktemp -d /private/tmp/semaphore-disposable\.XXXXXX')
          - macos is search('chmod 0711 "\$ROOT"')
          - not (macos is search('mktemp -d -t semaphore-disposable'))
        fail_msg: >-
          The disposable prefix must be created under /private/tmp and made
          traversable (0711). $TMPDIR is per-user and drwx------ on macOS,
          so a service account cannot execute anything beneath it.
        success_msg: "The disposable prefix is reachable by the service account."

    - name: THE ACCOUNT IS MEASURED FROM DIRECTORY SERVICES, NOT INFERRED
      # Greping a task name or a comment would prove the role *says* it
      # creates a hidden non-admin account. Only dscl and dsmemberutil prove
      # it did.
      ansible.builtin.assert:
        that:
          - macos is search('dscl \. -read "/Users/\$TEST_USER" UniqueID')
          - macos is search('dscl \. -read "/Groups/\$TEST_GROUP" PrimaryGroupID')
          - macos is search('dsmemberutil checkmembership -U "\$TEST_USER" -G admin')
          - macos is search('dsmemberutil checkmembership -U "\$TEST_USER" -G wheel')
          - macos is search('T_SHELL=\\$\\(dscl')
          - macos is search('\"/Users/\\$TEST_USER\" AuthenticationAuthority')
          # ⚠️ HIDDEN MEANS IsHidden=1 *OR* uid<500. `_www`, a real macOS
          # service account, has no IsHidden key at all and is still hidden;
          # asserting the key alone would reject a correct account.
          - macos is search('IsHidden=\$\{T_HIDDEN:-unset\}')
          - macos is search('UIDS_BEFORE=\\$\\(dscl')
          - macos is search('GIDS_BEFORE=\\$\\(dscl')
        fail_msg: >-
          The account checks must read UniqueID, PrimaryGroupID, UserShell,
          AuthenticationAuthority and admin/wheel membership from Directory
          Services, and must prove the allocated UID and GID were free by
          comparing against sets captured beforehand.
        success_msg: "Account properties are measured from Directory Services."

    - name: ACCOUNT TEARDOWN REMOVES FILES BEFORE THE IDENTITY
      # ⚠️ ORDER IS THE PROPERTY. Deleting the account first leaves files
      # owned by a uid that no longer resolves — orphaned ownership a later
      # account could silently inherit.
      ansible.builtin.assert:
        that:
          - macos is search('FILES FIRST, WHILE THE IDENTITY STILL RESOLVES')
          - (macos.index('tsudo rm -rf "$ROOT"')) < (macos.index('dscl . -delete "/Users/$TEST_USER"'))
          - (macos.index('dscl . -delete "/Users/$TEST_USER"')) < (macos.index('dscl . -delete "/Groups/$TEST_GROUP"'))
          - macos is search('dscacheutil -flushcache')
          - macos is search('id \$TEST_USER no longer resolves')
          - not (macos is search('pkill[^\\n]*semt'))
          - not (macos is search('dscl \. -delete "/Users/_sem\*'))
        fail_msg: >-
          Teardown must remove the disposable files BEFORE the user record,
          then the user, then the group, then flush the cache and prove none
          of them resolves. It must never match an account by prefix or
          pattern.
        success_msg: "Teardown removes files first, then the exact records, and proves it."

    - name: THE GATE RUNS THE ACCOUNT MODE, AND CHECKS FOR STRAY IDENTITIES
      ansible.builtin.assert:
        that:
          - gate is search('run-semaphore-launchd\.sh --with-account')
          - gate is search('no disposable _semt account survives')
          - gate is search('no disposable _semt group survives')
          - gate is search('no _semaphore service account was created')
        fail_msg: >-
          The controller gate must run the harness with --with-account —
          otherwise the one thing the controller run exists to prove is
          skipped — and must check afterwards for stray _semt records.
        success_msg: "The gate exercises the account path and sweeps for strays."
      vars:
        gate: "{{ lookup('file', '../tests/run-dc1-semaphore-gate.sh') }}"

    - name: Done
      ansible.builtin.debug:
        msg: >-
          Both harnesses are disposable, trapped, confined, re-authenticating
          and assert the properties that make them meaningful; the backup is
          WAL-safe.
