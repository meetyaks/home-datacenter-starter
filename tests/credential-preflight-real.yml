---
# ─────────────────────────────────────────────────────────────────────────────
# THE ROLE'S OWN CREDENTIAL PREFLIGHT, AGAINST THE REAL FILES.
#
#   ansible-playbook tests/credential-preflight-real.yml
#
# ⚠️ THE ROLE'S TASKS, NOT A COPY OF THEM. This includes
# roles/keel_reconcile/tasks/credentials.yml with the paths the role actually
# ships — so it checks the deploy key's mode and owner, the host-key pin, and
# agent-free read access to release/dev using the same code the unattended
# run will use. A harness that re-implemented those checks would pass against
# a contract the role does not have.
#
# ⚠️ IT CONTACTS GITHUB AND NOTHING ELSE. No managed host is in play: the
# whole point is to answer "can this controller read the channel" before any
# deployment is attempted. dc1-x86 is never touched.
#
# ⚠️ IT PRINTS NO SECRET. The preflight reports paths, modes and owners; the
# only network call is `git ls-remote`, which returns refs.
#
# Run it on the console, as the account the reconciler will run as.
# ─────────────────────────────────────────────────────────────────────────────
- name: The credential preflight, with the real credentials
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    # ⚠️ READ FROM THE ROLE, NOT RESTATED. Everything below comes from
    # roles/keel_reconcile/defaults/main.yml via include_vars, so if a path
    # changes there this play follows it instead of testing the old one.
    keel_channel_is_remote: true

  tasks:
    - name: Load the role's real defaults
      ansible.builtin.include_vars:
        file: ../roles/keel_reconcile/defaults/main.yml

    - name: Say which credential is about to be tested
      ansible.builtin.debug:
        msg:
          - "deploy key   {{ keel_reconcile_deploy_key }}"
          - "known_hosts  {{ keel_reconcile_known_hosts }}"
          - "repository   {{ keel_reconcile_channel_repo }}"
          - "branch       {{ keel_reconcile_channel_branch }}"
          - "running as   {{ keel_reconcile_controller_user }}"

    # ⚠️ THE AGENT IS REMOVED FROM THE ENVIRONMENT, NOT JUST IGNORED. The role
    # already passes `IdentityAgent=none`, which is the real guarantee — this
    # unsets SSH_AUTH_SOCK as well so that a pass here cannot possibly be a
    # personal key answering. On a console where somebody is logged in, an
    # agent is usually loaded with a key that CAN read the repository, and
    # that is exactly the false pass this whole design exists to prevent.
    - name: Run the role's own credential preflight
      ansible.builtin.include_tasks: ../roles/keel_reconcile/tasks/credentials.yml
      args:
        apply:
          environment:
            SSH_AUTH_SOCK: ""

    - name: Also prove the DEFAULT branch is readable, not only release/dev
      # The reconciler reads two things from this repository: the channel
      # branch, and the release's commit (fetched into the Keel checkout). A
      # key scoped to one branch would pass the check above and fail the
      # deployment, so both are asked for here.
      ansible.builtin.command:
        argv:
          - git
          - ls-remote
          - --exit-code
          - "{{ keel_reconcile_channel_repo }}"
          - HEAD
      environment:
        GIT_SSH_COMMAND: "{{ keel_reconcile_ssh_command }}"
        GIT_TERMINAL_PROMPT: "0"
        GIT_CONFIG_COUNT: "0"
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_SYSTEM: /dev/null
        SSH_AUTH_SOCK: ""
      changed_when: false
      failed_when: false
      register: default_branch

    - name: The deploy key reads the default branch too
      ansible.builtin.assert:
        that:
          - default_branch.rc == 0
        fail_msg: >-
          The deploy key cannot read HEAD in
          {{ keel_reconcile_channel_repo }} (git exited
          {{ default_branch.rc }}: {{ default_branch.stderr | default('') | trim }}).
          It reads the channel branch but not the repository's default branch,
          so the release's own commit could not be fetched.
        success_msg: "The deploy key reads the default branch as well."

    # ── IT MUST NOT BE ABLE TO WRITE ────────────────────────────────────────

    - name: Ask GitHub whether this key may push
      # ⚠️ `git push --dry-run` NEGOTIATES PERMISSION WITHOUT SENDING OBJECTS.
      # A read-only deploy key is refused by the server before any ref is
      # updated. This is the only way to be sure the "Allow write access" box
      # was actually left unchecked — the GitHub UI state is not visible from
      # here, and a key that can write is a key that can replace the release
      # it just verified.
      ansible.builtin.command:
        argv:
          - git
          - push
          - --dry-run
          - "{{ keel_reconcile_channel_repo }}"
          - "HEAD:refs/heads/keel-write-probe-should-be-refused"
      environment:
        GIT_SSH_COMMAND: "{{ keel_reconcile_ssh_command }}"
        GIT_TERMINAL_PROMPT: "0"
        SSH_AUTH_SOCK: ""
      args:
        chdir: ..
      changed_when: false
      failed_when: false
      register: write_probe

    - name: THE DEPLOY KEY IS READ-ONLY
      ansible.builtin.assert:
        that:
          - write_probe.rc != 0
          - (write_probe.stderr | default('')) is search('(?i)read[- ]only|denied|not permitted|unauthorized')
        fail_msg: >-
          The deploy key appears to have WRITE access to
          {{ keel_reconcile_channel_repo }} — `git push --dry-run` was not
          refused (rc {{ write_probe.rc }}).
          Remove the key on GitHub and add it again with "Allow write access"
          UNCHECKED. A site credential that can push can replace the release
          it just verified.
        success_msg: "Write is refused, as it must be — the key is read-only."

    - name: Done
      ansible.builtin.debug:
        msg: >-
          Deploy key verified: correct mode and owner, host keys pinned,
          agent-free read of {{ keel_reconcile_channel_branch }} and HEAD,
          and write refused.
