---
# ─────────────────────────────────────────────────────────────────────────────
# HOW CoreDNS IS UNPACKED, PER PLATFORM.
#
#   ansible-playbook tests/dns-install-platform.yml
#
# ⚠️ WHAT THIS IS GUARDING. The first watched DNS deployment, run from
# dc1-arm-1, stopped on the primary before dc1-x86 was touched:
#
#   TASK [coredns : Unpack it]
#   Failed to find handler for ".../coredns.tgz"
#   Command "/usr/bin/tar" detected as tar type bsd. GNU tar required.
#
# The download had already matched the pinned SHA-256. Nothing was wrong with
# the archive — macOS ships bsdtar as /usr/bin/tar, it extracts this tarball
# perfectly well, and `ansible.builtin.unarchive` simply refuses to use it.
#
# Installing GNU tar was rejected: it would make Homebrew a prerequisite of the
# LAN's primary resolver to work around a module's preference. So the role asks
# the platform and each branch uses the tar that platform has.
#
# ⚠️ IT READS THE TASK FILE AS YAML, NOT AS TEXT, AND THAT IS THE POINT.
# Parsing gives the EXECUTABLE structure — module names, argv, `when`, order —
# and is constitutionally blind to comments. A grep-based version of this suite
# would pass on a file whose comments described the split while the tasks did
# something else, which is the failure mode this repository has hit three times
# (the `no_log` assertion satisfied by a comment; the rendered-file secret scan;
# the BSD-sed check that flagged its own documentation).
#
# Controller-only: parses one file, connects to nothing, installs nothing.
# ─────────────────────────────────────────────────────────────────────────────
- name: The CoreDNS install path, per platform
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    install_file: ../roles/coredns/tasks/install.yml

  tasks:
    - name: Parse the role's install tasks
      ansible.builtin.set_fact:
        tasks_yaml: "{{ lookup('file', install_file) | from_yaml }}"

    - name: Summarise each task structurally
      # One normalised record per task: which module it uses, its first argv
      # element if any, its condition, and its position. Everything below is a
      # question about these records, so no assertion reads raw text.
      ansible.builtin.set_fact:
        summary: >-
          {{ summary | default([]) + [ {
               'idx': i,
               'name': item.name | default(''),
               'module': (item.keys() | select('match', '^ansible\.builtin\.') | list | first) | default('none'),
               'argv0': (item['ansible.builtin.command']['argv'][0]) | default(''),
               'argv': (item['ansible.builtin.command']['argv']) | default([]) | string,
               'when': (item.when | default('')) | string,
               'that': (item['ansible.builtin.assert']['that'] | default('')) | string,
               'checksum': (item['ansible.builtin.get_url']['checksum']) | default(''),
               'copy_owner': (item['ansible.builtin.copy']['owner']) | default(''),
               'copy_mode': (item['ansible.builtin.copy']['mode']) | default(''),
               'notify': (item.notify | default('')) | string,
               'file_state': (item['ansible.builtin.file']['state']) | default(''),
               'file_path': (item['ansible.builtin.file']['path']) | default(''),
               'file_owner': (item['ansible.builtin.file']['owner']) | default(''),
               'file_group': (item['ansible.builtin.file']['group']) | default(''),
               'file_mode': (item['ansible.builtin.file']['mode']) | default(''),
               'become': (item.become | default(false)) | string,
               'loop': (item.loop | default([])) | string
             } ] }}
      loop: "{{ tasks_yaml }}"
      loop_control:
        index_var: i
        label: "{{ item.name | default('(unnamed)') }}"

    - name: Locate the tasks this suite is about
      ansible.builtin.set_fact:
        tar_tasks: "{{ summary | selectattr('argv0', 'equalto', '/usr/bin/tar') | list }}"
        unarchive_tasks: "{{ summary | selectattr('module', 'equalto', 'ansible.builtin.unarchive') | list }}"
        download_tasks: "{{ summary | selectattr('module', 'equalto', 'ansible.builtin.get_url') | list }}"
        copy_tasks: "{{ summary | selectattr('module', 'equalto', 'ansible.builtin.copy') | list }}"
        unpacked_asserts: "{{ summary | selectattr('that', 'search', 'coredns_unpacked') | list }}"
        stat_tasks: "{{ summary | selectattr('module', 'equalto', 'ansible.builtin.stat') | list }}"
        dir_tasks: "{{ summary | selectattr('file_state', 'equalto', 'directory') | list }}"
        version_checks: "{{ summary | selectattr('module', 'equalto', 'ansible.builtin.command')
                            | selectattr('argv0', 'equalto', '') | list }}"

    # ── THE DIRECTORIES THIS ROLE INSTALLS INTO ─────────────────────────────

    - name: THE BINARY DIRECTORY IS CREATED BY THIS ROLE
      # ⚠️ THE SECOND dc1-arm-1 FAILURE, AS A TEST. The corrected Darwin
      # extraction worked — tar succeeded, the binary was there, the isreg
      # assertion passed at 73,452,546 bytes — and the very next task said:
      #
      #   TASK [coredns : Install it]
      #   Destination directory /usr/local/sbin does not exist
      #
      # /usr/local/sbin is simply absent on a stock macOS install. Homebrew
      # creates /usr/local/bin; nothing creates /usr/local/sbin; and `copy`
      # does not create a missing parent. The role owned two directories and
      # assumed the third.
      #
      # ⚠️ IT LOOKS IN `loop` AND IN `path`, BECAUSE A DIRECTORY TASK CAN USE
      # EITHER. The first version only searched `loop`, so a second task
      # creating the directory with a bare `path:` read as "not created at
      # all" — the mutation that splits the directories across two tasks
      # failed this assertion instead of the one-owner assertion below, with a
      # message that was simply untrue. A detector that cannot see a valid
      # form reports the wrong defect.
      ansible.builtin.assert:
        that:
          - (dir_tasks | length) >= 1
          - (dir_tasks | selectattr('loop', 'search', 'coredns_bin_dir') | list
             | union(dir_tasks | selectattr('file_path', 'search', 'coredns_bin_dir') | list)
             | length) >= 1
        fail_msg: >-
          No directory task creates coredns_bin_dir, by loop or by path. A
          clean macOS controller has no /usr/local/sbin, and
          ansible.builtin.copy will not create a missing destination directory
          — the install fails with "Destination directory ... does not exist"
          after the archive has already been verified and unpacked.
        success_msg: "coredns_bin_dir is created by the role."

    - name: ONE TASK OWNS ALL THREE DIRECTORIES
      # ⚠️ ONE OWNER, SO THE MODE AND OWNERSHIP ARE STATED ONCE. A separate
      # task for the binary directory would be a second place to change when
      # the group expression moves, and the two would drift — which is how
      # one of these directories ends up 0755 root:wheel and another 0755
      # root:staff on the same host.
      ansible.builtin.assert:
        that:
          - (dir_tasks | length) == 1
          - dir_tasks[0].loop is search('coredns_conf_dir')
          - dir_tasks[0].loop is search('coredns_log_dir')
          - dir_tasks[0].loop is search('coredns_bin_dir')
        fail_msg: >-
          Expected exactly one directory-creating task covering
          coredns_conf_dir, coredns_log_dir and coredns_bin_dir; found
          {{ dir_tasks | length }} with loop
          "{{ dir_tasks[0].loop | default('(none)') }}".
        success_msg: "One task creates all three directories."

    - name: It creates them root-owned, 0755, with privilege
      ansible.builtin.assert:
        that:
          - dir_tasks[0].file_state == 'directory'
          - dir_tasks[0].file_owner == 'root'
          - dir_tasks[0].file_mode == '0755'
          - dir_tasks[0].become | lower == 'true'
        fail_msg: >-
          The directory task must be state=directory, owner=root, mode=0755
          and become=true. Got state "{{ dir_tasks[0].file_state }}", owner
          "{{ dir_tasks[0].file_owner }}", mode "{{ dir_tasks[0].file_mode }}",
          become "{{ dir_tasks[0].become }}". /usr/local/sbin is on the default
          PATH; a world-writable or non-root-owned directory there is a
          privilege-escalation route, and the binary inside it is run as root.
        success_msg: "Directories: root-owned, 0755, created with become."

    - name: The group is wheel on Darwin and root on Linux
      # ⚠️ THE EXACT EXPRESSION, NOT "CONTAINS wheel". A substring check would
      # pass on `'root' if coredns_is_darwin else 'wheel'` — the branches
      # swapped — which is a real review miss and fails on BOTH nodes: `wheel`
      # is not a Linux group, and `root` is not the conventional owner-group
      # on macOS.
      #
      # ⚠️ PINNED RATHER THAN EVALUATED, DELIBERATELY. The captured value is
      # itself a Jinja expression; feeding it back through a filter makes
      # Ansible template it recursively and the task dies with "Syntax error
      # in template: unexpected 'end of template'" — which is how the first
      # version of this assertion failed. An exact match on the one accepted
      # form says the same thing without the recursion.
      ansible.builtin.assert:
        that:
          - dir_tasks[0].file_group is match("^\{\{ 'wheel' if coredns_is_darwin else 'root' \}\}$")
        fail_msg: >-
          The directory group is "{{ dir_tasks[0].file_group }}". It must be
          exactly "{{ '{{' }} 'wheel' if coredns_is_darwin else 'root' {{ '}}' }}"
          — wheel on Darwin, root on Linux. A hardcoded value is wrong on one
          of the two nodes, and swapped branches are wrong on both.
        success_msg: "Directory group: wheel on Darwin, root on Linux."

    - name: And the binary copy uses that same per-platform group
      # The directory and the file inside it must agree; otherwise the install
      # lands root:wheel inside a root:root directory, or the reverse.
      ansible.builtin.assert:
        that:
          - copy_tasks[0].name is defined
          - (summary | selectattr('module', 'equalto', 'ansible.builtin.copy')
             | map(attribute='idx') | list | length) == 1
        fail_msg: "Expected exactly one copy task installing the binary."
        success_msg: "One copy task installs the binary."

    - name: THE DIRECTORIES EXIST BEFORE ANYTHING READS OR WRITES THEM
      # ⚠️ ORDERING IS THE WHOLE FIX. Creating the directory anywhere later
      # just moves the failure: the installed-version check RUNS
      # {{ coredns_bin_dir }}/coredns, the extraction stages next to it, and
      # the copy writes into it. All three assume it is there.
      #
      # ⚠️ ASSERTED AS "IT IS FIRST", NOT AS A LIST OF PAIRWISE COMPARISONS.
      # The first version compared the directory index against the tar,
      # unarchive, download, version-check and copy indices by subscript — so
      # any mutation that REMOVED one of those tasks made this assertion die
      # on an empty list, and the suite then reported this ordering failure
      # instead of the specific defect. Two extraction mutations in
      # run-dns-mutations.sh failed "for the wrong reason" because of it.
      # Position zero says the same thing and cannot be confused by an absent
      # task elsewhere.
      ansible.builtin.assert:
        that:
          - dir_tasks[0].idx == 0
          - dir_tasks[0].idx < (version_checks | map(attribute='idx') | min)
        fail_msg: >-
          The directory task is at position {{ dir_tasks[0].idx }}; it must be
          first. Everything after it assumes the directories exist — the
          installed-version check RUNS {{ '{{' }} coredns_bin_dir {{ '}}' }}/coredns,
          the download stages beside it, and the copy writes into it.
          Creating it later only moves the failure.
        success_msg: "Directories are created first, before anything uses them."

    - name: The destination is never hardcoded
      # The task must say coredns_bin_dir, not /usr/local/sbin — the Linux
      # node would otherwise inherit a macOS path.
      ansible.builtin.assert:
        that:
          - not (dir_tasks[0].loop is search('/usr/local/sbin'))
          - not (copy_tasks[0].name is search('/usr/local/sbin'))
          - (summary | selectattr('loop', 'search', '/usr/local') | list | length) == 0
        fail_msg: >-
          A literal /usr/local path appears in the install tasks. Paths come
          from coredns_bin_dir, which differs per platform.
        success_msg: "No hardcoded /usr/local path."

    # ── THE DARWIN BRANCH ───────────────────────────────────────────────────

    - name: macOS extracts with the system tar, exactly once
      ansible.builtin.assert:
        that:
          - (tar_tasks | length) == 1
          - tar_tasks[0].module == 'ansible.builtin.command'
        fail_msg: >-
          Expected exactly one task invoking /usr/bin/tar via
          ansible.builtin.command; found {{ tar_tasks | length }}.
          macOS cannot use ansible.builtin.unarchive here — it refuses bsdtar
          with "GNU tar required" — so the Darwin branch must call the system
          tar itself.
        success_msg: "macOS unpacks with /usr/bin/tar, via command."

    - name: It passes argv, so nothing is re-split by a shell
      # ⚠️ NOT A STYLE POINT. The staging path comes from a tempfile and is
      # interpolated in; as shell text, a path containing a space or a quote
      # would be re-split, on the node that serves the whole LAN's DNS.
      ansible.builtin.assert:
        that:
          - tar_tasks[0].argv is search('-xzf')
          - tar_tasks[0].argv is search('-C')
          - tar_tasks[0].argv is search('coredns\.tgz')
          - tar_tasks[0].argv is search('coredns_download_tmp\.path')
        fail_msg: >-
          The macOS extraction must pass an argv list naming the archive and
          the staging directory. Got: {{ tar_tasks[0].argv }}
        success_msg: "Extraction passes argv: -xzf <archive> -C <staging>."

    - name: THE DARWIN BRANCH DOES NOT USE unarchive
      # The whole defect, stated directly: on this platform that module cannot
      # run, so the Darwin path must not reach it by any route.
      ansible.builtin.assert:
        that:
          - tar_tasks[0].module != 'ansible.builtin.unarchive'
          - (unarchive_tasks | selectattr('when', 'search', 'coredns_is_darwin \| bool')
             | rejectattr('when', 'search', 'not') | list | length) == 0
        fail_msg: >-
          An ansible.builtin.unarchive task is reachable on Darwin. That module
          refuses bsdtar with "GNU tar required" and is what broke the first
          watched deployment.
        success_msg: "No unarchive task runs on Darwin."

    - name: And it runs only when something needs installing, on Darwin only
      ansible.builtin.assert:
        that:
          - tar_tasks[0].when is search('coredns_needs_install')
          - tar_tasks[0].when is search('coredns_is_darwin')
          - not (tar_tasks[0].when is search('not \(coredns_is_darwin'))
        fail_msg: >-
          The macOS extraction's condition is "{{ tar_tasks[0].when }}". It must
          require BOTH coredns_needs_install and coredns_is_darwin — a
          converged node must not re-extract, and this branch must not run on
          Linux.
        success_msg: "macOS extraction: needs_install AND is_darwin."

    # ── THE LINUX BRANCH ────────────────────────────────────────────────────

    - name: Linux keeps ansible.builtin.unarchive, exactly once
      ansible.builtin.assert:
        that:
          - (unarchive_tasks | length) == 1
        fail_msg: >-
          Expected exactly one ansible.builtin.unarchive task for the Linux
          branch; found {{ unarchive_tasks | length }}. GNU tar is what that
          module wants and what the Linux host has — this fix does not replace
          it, it stops Darwin reaching it.
        success_msg: "Linux still unpacks with ansible.builtin.unarchive."

    - name: And it runs only when something needs installing, off Darwin
      ansible.builtin.assert:
        that:
          - unarchive_tasks[0].when is search('coredns_needs_install')
          - unarchive_tasks[0].when is search('not \(coredns_is_darwin \| bool\)')
        fail_msg: >-
          The Linux extraction's condition is "{{ unarchive_tasks[0].when }}".
          It must require coredns_needs_install AND explicitly exclude Darwin;
          without the exclusion the macOS run reaches it again and fails with
          "GNU tar required".
        success_msg: "Linux extraction: needs_install AND NOT is_darwin."

    - name: EXACTLY ONE BRANCH CAN RUN ON A GIVEN HOST
      # Neither both nor neither. Both would extract twice; neither would leave
      # the copy to fail on a missing file.
      ansible.builtin.assert:
        that:
          - (tar_tasks | length) + (unarchive_tasks | length) == 2
          - tar_tasks[0].idx != unarchive_tasks[0].idx
        fail_msg: >-
          There must be exactly two extraction tasks — one per platform — and
          they must be distinct.
        success_msg: "Two extraction tasks, one per platform, mutually exclusive."

    # ── ORDER: VERIFY, EXTRACT, CHECK, INSTALL ──────────────────────────────

    - name: The checksum is verified BEFORE either extraction
      # ⚠️ THE SECURITY PROPERTY THE SPLIT MUST NOT DISTURB. Extraction runs
      # the archive's contents through tar as a prelude to installing a binary
      # that will run as root with CAP_NET_BIND_SERVICE. The bytes are vouched
      # for first, or the whole pin is decorative.
      ansible.builtin.assert:
        that:
          - (download_tasks | length) == 1
          - download_tasks[0].checksum is search('sha256:')
          - download_tasks[0].idx < tar_tasks[0].idx
          - download_tasks[0].idx < unarchive_tasks[0].idx
        fail_msg: >-
          The checksummed download must come before both extraction tasks.
          download idx={{ download_tasks[0].idx | default('?') }},
          tar idx={{ tar_tasks[0].idx }},
          unarchive idx={{ unarchive_tasks[0].idx }},
          checksum="{{ download_tasks[0].checksum | default('(none)') }}".
        success_msg: "SHA-256 is verified before anything is unpacked."

    - name: THE EXTRACTED BINARY IS ASSERTED BEFORE IT IS INSTALLED
      # ⚠️ ORDERING IS THE WHOLE VALUE. After the copy, a missing file is
      # "Source .../coredns not found" — the symptom, not the cause. Before it,
      # the failure names the platform and the archive, which is what somebody
      # standing in front of a down resolver needs.
      ansible.builtin.assert:
        that:
          - (unpacked_asserts | length) >= 1
          - (stat_tasks | length) >= 1
          - (copy_tasks | length) == 1
          - unpacked_asserts[0].idx < copy_tasks[0].idx
          - stat_tasks[0].idx < unpacked_asserts[0].idx
          - unpacked_asserts[0].idx > tar_tasks[0].idx
          - unpacked_asserts[0].idx > unarchive_tasks[0].idx
        fail_msg: >-
          The extracted-binary assertion must sit after BOTH extraction
          branches and before the copy. stat
          idx={{ stat_tasks[0].idx | default('?') }}, assert
          idx={{ unpacked_asserts[0].idx | default('?') }}, copy
          idx={{ copy_tasks[0].idx | default('?') }}.
        success_msg: "stat → assert → copy, in that order."

    - name: The assertion requires a REGULAR FILE, not merely a path
      # A directory named `coredns` would satisfy existence and then fail the
      # copy for a third, even less obvious reason.
      ansible.builtin.assert:
        that:
          - unpacked_asserts[0].that is search('exists')
          - unpacked_asserts[0].that is search('isreg')
        fail_msg: >-
          The extracted-binary assertion checks
          "{{ unpacked_asserts[0].that }}". It must require both `exists` and
          `isreg`.
        success_msg: "The assertion requires a regular file."

    # ── WHAT THE FIX MUST NOT HAVE WEAKENED ────────────────────────────────

    - name: The install still copies as root, 0755, and notifies a restart
      ansible.builtin.assert:
        that:
          - copy_tasks[0].copy_owner == 'root'
          - copy_tasks[0].copy_mode == '0755'
          - copy_tasks[0].notify is search('Restart CoreDNS')
          - copy_tasks[0].when is search('coredns_needs_install')
        fail_msg: >-
          The install task must still copy as root with mode 0755, notify
          "Restart CoreDNS", and run only when needed. Got owner
          "{{ copy_tasks[0].copy_owner }}", mode "{{ copy_tasks[0].copy_mode }}",
          notify "{{ copy_tasks[0].notify }}", when "{{ copy_tasks[0].when }}".
        success_msg: "Install unchanged: root, 0755, notifies a restart."

    - name: The installed binary's version is still checked afterwards
      ansible.builtin.assert:
        that:
          - (summary | selectattr('that', 'search', "'CoreDNS-' ~ coredns_version")
             | list | length) >= 1
          - (summary | selectattr('that', 'search', "'CoreDNS-' ~ coredns_version")
             | map(attribute='idx') | first) > copy_tasks[0].idx
        fail_msg: >-
          The post-install version check must still exist and must run after
          the copy — a verified tarball unpacked to the wrong place would
          otherwise leave an older binary in service.
        success_msg: "The installed binary is still verified after copying."

    - name: Nothing in the install path uses a shell
      # ⚠️ NO shell/raw ANYWHERE HERE. The fix introduces a command task with
      # an interpolated path; the temptation on the next change is to reach for
      # `shell` because it is shorter.
      ansible.builtin.assert:
        that:
          - (summary | selectattr('module', 'equalto', 'ansible.builtin.shell') | list | length) == 0
          - (summary | selectattr('module', 'equalto', 'ansible.builtin.raw') | list | length) == 0
        fail_msg: >-
          A shell or raw task appears in the install path:
          {{ summary | selectattr('module', 'match', 'ansible\.builtin\.(shell|raw)')
             | map(attribute='name') | join(', ') }}.
          Paths here come from a tempfile; use command with argv.
        success_msg: "No shell in the install path."

    - name: Done
      ansible.builtin.debug:
        msg: >-
          macOS extracts with /usr/bin/tar via argv and never reaches
          unarchive; Linux keeps unarchive; both are gated on
          coredns_needs_install; the checksum precedes both; and the extracted
          binary is asserted before it is installed as root.
