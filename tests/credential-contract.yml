---
# ─────────────────────────────────────────────────────────────────────────────
# THE TWO CREDENTIALS THIS SITE NEEDS, AND HOW THEY ARE HANDLED.
#
#   ansible-playbook tests/credential-contract.yml
#
# ⚠️ NEITHER CREDENTIAL EXISTS YET, AND THAT IS WHY THIS SUITE IS SHAPED THIS
# WAY. There is no deploy key and no registry token, so nothing here can
# prove that authentication WORKS — only that the code is honest about
# needing it, refuses without it, and cannot leak it. Those are the
# properties that must be right BEFORE a real credential is created, because
# afterwards a mistake is a disclosed secret rather than a failing test.
#
# Two halves:
#
#   · the DEPLOY KEY (git, controller side) — exercised. The preflight runs
#     against real fixtures on disk: absent, too permissive, wrongly owned.
#   · the REGISTRY TOKEN (docker, host side) — structural. `docker login`
#     cannot be run here without a daemon, a host and a real token, so what
#     is checked is the code: stdin not argv, `no_log` present, logout in an
#     `always` block, ghcr.io and not a default.
#
# A structural check is a weaker claim and is labelled as one. It is the
# right instrument for "somebody added a second way to do it", which is this
# code's actual failure mode.
#
# Controller-only: reads files, runs `git ls-remote` against nothing real.
# ─────────────────────────────────────────────────────────────────────────────
- name: The credential contract
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    fixture_dir: /tmp/keel-credential-contract
    registry_tasks: ../roles/keel/tasks/registry.yml
    logout_tasks: ../roles/keel/tasks/registry-logout.yml
    bundle_tasks: ../roles/keel/tasks/release-bundle.yml
    credentials_tasks: ../roles/keel_reconcile/tasks/credentials.yml
    reconcile_tasks: ../roles/keel_reconcile/tasks/main.yml

  tasks:
    - name: Load the reconcile role's real defaults
      # ⚠️ THE ROLE'S OWN, NOT A COPY. A suite carrying its own idea of the
      # SSH command would pass while the role used a different one.
      ansible.builtin.include_vars:
        file: ../roles/keel_reconcile/defaults/main.yml

    # ═══ THE DEPLOY KEY ═══════════════════════════════════════════════════

    - name: A place to put key fixtures
      ansible.builtin.file:
        path: "{{ fixture_dir }}"
        state: directory
        mode: "0700"

    - name: THE SHIPPED CHANNEL REMOTE IS SSH, NOT HTTPS
      # ⚠️ THE WHOLE CONTRACT RESTS ON THIS ONE VALUE. Over HTTPS, git
      # resolves a private repository through the credential helper — the
      # operator's keychain and personal token. It works when a person runs
      # the playbook and fails when the scheduler does, as a different
      # account, unattended. The SSH form is what makes the dedicated key the
      # only way in.
      ansible.builtin.assert:
        that:
          - keel_reconcile_channel_repo is match('^git@github\.com:')
        fail_msg: >-
          keel_reconcile_channel_repo is
          "{{ keel_reconcile_channel_repo }}". It must be the SSH form, so
          the controller authenticates with its dedicated deploy key rather
          than with whatever credential helper the account happens to have.
        success_msg: "Channel remote: {{ keel_reconcile_channel_repo }}."

    - name: ONE KEY SERVES BOTH READS, BECAUSE IT IS ONE REPOSITORY
      # release/dev and the release's source commit are both in
      # meetyaks/keel, so a single repository-scoped read-only deploy key
      # covers the channel clone and the source fetch. If these two ever
      # named different repositories, one key would not be enough and the
      # design would need saying again — so the suite checks they do not.
      ansible.builtin.assert:
        that:
          - (reconcile_text is search('keel_reconcile_channel_repo'))
          - (reconcile_text is search('GIT_SSH_COMMAND'))
        fail_msg: >-
          The source fetch no longer uses the channel's repository and SSH
          command, so the single deploy key no longer covers both reads.
        success_msg: "One repository, one key, both reads."
      vars:
        reconcile_text: "{{ lookup('file', reconcile_tasks) | regex_replace('(?m)^\\s*#.*$', '') }}"

    - name: The SSH command pins the key, the host keys and batch mode
      ansible.builtin.assert:
        that:
          - keel_reconcile_ssh_command is search('-i\s+' ~ (keel_reconcile_deploy_key | regex_escape))
          - keel_reconcile_ssh_command is search('IdentitiesOnly=yes')
          - keel_reconcile_ssh_command is search('BatchMode=yes')
          - keel_reconcile_ssh_command is search('StrictHostKeyChecking=yes')
          - keel_reconcile_ssh_command is search('UserKnownHostsFile=')
        fail_msg: >-
          keel_reconcile_ssh_command does not pin an explicit key, identities,
          batch mode, strict host-key checking and a known_hosts file:
          "{{ keel_reconcile_ssh_command }}".
        success_msg: "SSH is pinned to one key and one set of host keys."

    - name: IdentityAgent IS DISABLED, SO A RUNNING ssh-agent CANNOT HELP
      # ⚠️ THE FALSE-PASS THIS REMOVES. On a developer's Mac an ssh-agent is
      # usually loaded with a personal key that CAN read meetyaks/keel.
      # Without `IdentityAgent=none`, the preflight would authenticate with
      # that key, report success, and prove nothing about the service
      # account — the exact "an interactive developer credential is not valid
      # proof for an unattended controller" problem, reproduced inside the
      # check meant to catch it.
      ansible.builtin.assert:
        that:
          - keel_reconcile_ssh_command is search('IdentityAgent=none')
        fail_msg: >-
          keel_reconcile_ssh_command does not set IdentityAgent=none, so a
          personal key in a running ssh-agent could satisfy the credential
          check. The result would be a green preflight on a developer's
          machine and an unattended failure on the console.
        success_msg: "No ssh-agent fallback: the deploy key, or nothing."

    - name: HOST-KEY CHECKING CANNOT BE DISABLED FROM INVENTORY
      # The composed command is a string an operator can override. The role
      # re-checks it at runtime (tasks/credentials.yml); this is the
      # shipped-default half of the same guarantee.
      ansible.builtin.assert:
        that:
          - not (keel_reconcile_ssh_command is search('StrictHostKeyChecking\s*=\s*(no|accept-new)'))
          - credentials_text is search('StrictHostKeyChecking=yes')
          - credentials_text is search('accept-new')
        fail_msg: >-
          Either the shipped SSH command weakens host-key checking, or
          tasks/credentials.yml no longer refuses an override that does. An
          unattended controller that accepts an unknown host key accepts a
          release document from whatever answered.
        success_msg: "Strict host-key checking, and the role re-checks it."
      vars:
        credentials_text: "{{ lookup('file', credentials_tasks) | regex_replace('(?m)^\\s*#.*$', '') }}"

    - name: The channel clone never accepts an unknown host key
      ansible.builtin.assert:
        that:
          - reconcile_text is search('accept_hostkey:\s*false')
          - not (reconcile_text is search('accept_hostkey:\s*(true|yes)'))
        fail_msg: >-
          roles/keel_reconcile sets accept_hostkey on the git clone, or no
          longer disables it. That option is StrictHostKeyChecking=no wearing
          a friendlier name: it writes whatever answered into known_hosts and
          carries on.
        success_msg: "The clone pins host keys rather than learning them."
      vars:
        reconcile_text: "{{ lookup('file', reconcile_tasks) | regex_replace('(?m)^\\s*#.*$', '') }}"

    - name: An interactive credential is never a fallback
      # ⚠️ ALL FOUR, BECAUSE THEY FAIL DIFFERENTLY. GIT_TERMINAL_PROMPT stops
      # git asking for a username on a tty; the GIT_CONFIG_* trio neutralises
      # a credential helper configured globally. Any one of them missing
      # leaves a path by which the operator's identity answers the question.
      ansible.builtin.assert:
        that:
          - credentials_text is search('GIT_TERMINAL_PROMPT')
          - credentials_text is search('GIT_CONFIG_GLOBAL')
          - credentials_text is search('GIT_CONFIG_SYSTEM')
          - credentials_text is search('GIT_CONFIG_COUNT')
        fail_msg: >-
          tasks/credentials.yml does not exclude the operator's own git
          credentials, so the readability check could pass through a personal
          credential helper and prove nothing about the scheduler.
        success_msg: "The operator's credentials are excluded from the check."
      vars:
        credentials_text: "{{ lookup('file', credentials_tasks) | regex_replace('(?m)^\\s*#.*$', '') }}"

    # ── THE PREFLIGHT, EXERCISED AGAINST REAL FILES ───────────────────────
    #
    # ⚠️ RUN, NOT GREPPED. Each case writes a key fixture in a specific wrong
    # state and runs the ROLE'S OWN tasks against it. The assertions restate
    # nothing.

    - name: Run every deploy-key case
      ansible.builtin.include_tasks: credential-case.yml
      loop:
        - name: an absent deploy key is refused
          state: absent
          because: No deploy key at

        - name: A WORLD-READABLE DEPLOY KEY IS REFUSED
          # 0644 is what `cp` out of a backup leaves behind. ssh refuses it
          # too, but at the point of use, with a message that reads like a
          # local permissions problem rather than a credential installed
          # wrongly.
          state: present
          mode: "0644"
          because: must be 0400

        - name: a group-readable deploy key is refused
          state: present
          mode: "0440"
          because: must be 0400

        - name: a key owned by somebody else is refused
          state: present
          mode: "0400"
          owner: nobody
          because: must own its own credential

        - name: missing pinned host keys are refused
          state: present
          mode: "0400"
          known_hosts: absent
          because: No pinned host keys

        - name: an HTTPS remote to a private repository is refused
          state: present
          mode: "0400"
          repo: https://github.com/meetyaks/keel
          because: reach over HTTPS
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Tidy the fixtures away
      ansible.builtin.file:
        path: "{{ fixture_dir }}"
        state: absent

    # ═══ THE REGISTRY TOKEN ═══════════════════════════════════════════════
    #
    # Structural, and deliberately so — see the header. No daemon, no host,
    # no token.

    - name: Read the registry tasks, WITH THEIR COMMENTARY REMOVED
      # ⚠️ CODE, NOT PROSE, AND THIS SUITE LEARNED IT THE EXPENSIVE WAY. The
      # first version scanned the raw file for `no_log: true`. Deleting the
      # real `no_log` from the login task left the suite GREEN, because a
      # comment three tasks later says "the login itself is `no_log: true`".
      # A structural check that a comment can satisfy is not a check — it is
      # a check on the documentation.
      #
      # So every assertion below reads the file with `#` lines stripped. The
      # credential-value scan further down deliberately does NOT strip them:
      # a token pasted into a comment is still a token.
      ansible.builtin.set_fact:
        registry_text: "{{ lookup('file', registry_tasks) | regex_replace('(?m)^\\s*#.*$', '') }}"
        logout_text: "{{ lookup('file', logout_tasks) | regex_replace('(?m)^\\s*#.*$', '') }}"
        bundle_text: "{{ lookup('file', bundle_tasks) | regex_replace('(?m)^\\s*#.*$', '') }}"

    - name: BOTH HALVES OF THE CREDENTIAL ARE REQUIRED BEFORE ANY MUTATION
      # ⚠️ `| trim | length > 0`, NOT `is defined`. A vault key present with
      # an empty value is the ordinary mistake, and `docker login` with an
      # empty password fails with an authentication error that sends the
      # reader looking for a wrong token rather than a missing one.
      ansible.builtin.assert:
        that:
          - registry_text is search('keel_vault_registry_username is defined')
          - registry_text is search('keel_vault_registry_token is defined')
          - registry_text is search('keel_vault_registry_username \| trim\) \| length > 0')
          - registry_text is search('keel_vault_registry_token \| trim\) \| length > 0')
        fail_msg: >-
          roles/keel/tasks/registry.yml does not require both a registry
          username and a non-empty token before it does anything. A missing
          credential must be refused while the running stack is still up.
        success_msg: "Both halves required, and emptiness counts as missing."

    - name: THE TOKEN GOES OVER STDIN, NEVER IN AN ARGUMENT
      # ⚠️ `--password <token>` PUTS THE SECRET IN THE PROCESS TABLE, where
      # any user on the host can read it for as long as the command runs,
      # and in the shell history of anyone who reproduces the step.
      ansible.builtin.assert:
        that:
          - registry_text is search('--password-stdin')
          - registry_text is search('stdin:\s*"\{\{ keel_vault_registry_token')
          - not (registry_text is search('--password\b(?!-stdin)'))
          - not (registry_text is search('-p\s+"?\{\{ keel_vault_registry_token'))
        fail_msg: >-
          The registry token is passed as a command-line argument rather than
          over stdin. It would be visible in the process table on the host.
        success_msg: "The token is fed over stdin."

    - name: EVERY TASK THAT TOUCHES THE TOKEN IS no_log
      # ⚠️ NOT TIDINESS. Without `no_log`, a failed task prints its own
      # arguments — and `-vvv` prints them on success too. The login task is
      # the one that holds the secret; the config read is the one that could
      # echo a stored copy of it back.
      ansible.builtin.assert:
        that:
          - registry_text is search('(?s)stdin:.*?no_log:\s*true')
          - logout_text is search('(?s)\.docker/config\.json.*?no_log:\s*true')
        fail_msg: >-
          A task handling the registry credential is missing `no_log: true`.
          Ansible prints a failed task's arguments, and -vvv prints them on
          success.
        success_msg: "Every secret-handling task is no_log."

    - name: LOGIN TARGETS ghcr.io, AND NOT WHATEVER A MANIFEST ASKED FOR
      # ⚠️ `docker login` WITH NO REGISTRY AUTHENTICATES TO DOCKER HUB. That
      # is the accident: a manifest naming an unqualified repository would
      # send a GHCR token to a different company. The registry is derived
      # from the release and then checked against the expected one.
      ansible.builtin.assert:
        that:
          - registry_text is search('keel_release_registry')
          - bundle_text is search('keel_release_expected_registry')
          - bundle_text is search('keel_release_registries \| length == 1')
        fail_msg: >-
          The login target is not derived from the release and checked
          against keel_release_expected_registry. `docker login` with no
          registry argument authenticates to Docker Hub.
        success_msg: "One registry, derived from the release and then checked."

    - name: ONLY THE ACCEPTED MANIFEST'S DIGESTS ARE PULLED
      ansible.builtin.assert:
        that:
          # ⚠️ QUOTED. An unquoted item containing ": " is read by YAML as a
          # MAPPING, and Ansible rejects it with "Conditional expressions
          # must be strings" — or, as here, the parser refuses the file
          # outright.
          - "bundle_text is search('docker\\n\\s+- pull\\n\\s+- \"\\{\\{ item.repository \\}\\}@\\{\\{ item.digest \\}\\}\"')"
          - "bundle_text is search('loop: \"\\{\\{ keel_release.images \\}\\}\"')"
        fail_msg: >-
          The pull is not a digest reference taken from keel_release.images.
          A tag is a mutable pointer: the image that runs would not have to
          be the image that was gated.
        success_msg: "Pulls `repository@digest`, from the accepted manifest only."

    - name: AND A DIGEST THAT DID NOT RESOLVE BLOCKS THE DEPLOYMENT
      # `docker pull` exiting 0 is not the same statement as "the daemon now
      # holds this digest".
      ansible.builtin.assert:
        that:
          - bundle_text is search('docker\n\s+- image\n\s+- inspect')
          - bundle_text is search('item.item.digest in item.stdout')
        fail_msg: >-
          Nothing confirms that the images the host now holds carry the
          digests the release named.
        success_msg: "Pulled digests are verified against the manifest."

    - name: LOGOUT RUNS WHETHER THE DEPLOYMENT SUCCEEDED OR FAILED
      # ⚠️ `always:`, NOT A TRAILING TASK. `docker login` writes a base64 of
      # "username:token" into ~/.docker/config.json on the host — not
      # encrypted, just encoded. A logout that only ran on success would
      # leave it there in exactly the case where somebody is about to go
      # poking around: a failed deployment.
      ansible.builtin.assert:
        that:
          # ⚠️ BOTH FLAGS. `(?s)` makes `.` cross newlines; `^` and `$` stay
          # string-anchors without `(?m)`, so `(?s)` alone never matches an
          # indented `always:` line — and the assertion fails on correct
          # code, which is the worst kind of wrong.
          - bundle_text is search('(?ms)^\s*always:\s*$.*registry-logout\.yml')
          - logout_text is search('docker, logout')
        fail_msg: >-
          registry-logout.yml is not in an `always:` block, so a failed
          deployment would leave the registry credential on the host.
        success_msg: "The credential is given back on every path."

    - name: And logout is confirmed rather than assumed
      ansible.builtin.assert:
        that:
          - logout_text is search('config\.json')
          - logout_text is search('keel_release_registry not in')
        fail_msg: >-
          Nothing checks that the credential actually left the host.
          `docker logout` reports success when it removed nothing.
        success_msg: "The host is asked what it still holds."

    # ── NOTHING SECRET REACHES THE RECORDS ────────────────────────────────

    - name: NO CREDENTIAL ENTERS current.json, THE ATTEMPTS OR THE EVIDENCE
      # ⚠️ THOSE THREE FILES LIVE ON THE HOST AND ARE MEANT TO BE READ MONTHS
      # LATER. They record what was deployed and under what assurance —
      # which is a reason to be careful about what else goes into them. A
      # token in an evidence bundle is a token in whatever an operator
      # attaches to a ticket.
      ansible.builtin.assert:
        that:
          - not (item is search('keel_vault_registry_token'))
          - not (item is search('keel_vault_registry_username'))
          - not (item is search('keel_reconcile_deploy_key'))
        fail_msg: >-
          A credential variable appears in the files that write current.json,
          the attempt records or the failure evidence. Those are kept on the
          host and attached to tickets.
        success_msg: "No credential reaches the records."
      loop:
        - "{{ lookup('file', reconcile_tasks) }}"
        - "{{ lookup('file', '../roles/keel_reconcile/tasks/evidence.yml') }}"
      loop_control:
        label: "{{ ['main.yml', 'evidence.yml'][ansible_loop.index0] }}"
        extended: true

    - name: NO CREDENTIAL VALUE IS COMMITTED ANYWHERE
      # The vault example is names-only by design; this is the check that
      # keeps it that way, and catches a value pasted into any role file.
      ansible.builtin.find:
        paths:
          - ../roles
          - ../inventory
          - ../bin
          - ../playbooks
        patterns: "*"
        recurse: true
      register: all_tracked

    - name: Every candidate file is free of credential-shaped values
      ansible.builtin.assert:
        that:
          - not (lookup('file', item) is search('gh[pousr]_[A-Za-z0-9]{16,}'))
          - not (lookup('file', item) is search('github_pat_[A-Za-z0-9_]{20,}'))
          - not (lookup('file', item) is search('BEGIN OPENSSH PRIVATE KEY'))
        fail_msg: >-
          {{ item }} contains something shaped like a real credential. Values
          belong in the vault, which is not committed; this repository holds
          names and paths only.
        success_msg: "{{ item | basename }}: no credential value."
      loop: "{{ all_tracked.files | map(attribute='path') | select('search', '\\.(yml|yaml|cfg|sh|example)$') | list }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Done
      ansible.builtin.debug:
        msg: >-
          deploy key: exercised against absent/permissive/mis-owned/unpinned
          fixtures. registry token: stdin, no_log, ghcr.io only, digests
          only, logout always. Neither credential exists yet — nothing here
          proves authentication works.
