---
# ─────────────────────────────────────────────────────────────────────────────
# REGRESSION TEST — roles/keel/tasks/verify-secret-files.yml
#
#   tests/run-secret-verification.sh        ← runs BOTH modes; use this
#
# It must be invoked twice, once with --check and once without, and the runner
# script does exactly that. The reason is worth stating, because it is the same
# distinction the bug turned on:
#
#   `ansible_check_mode` is TRUE only when the PLAY was started with `--check`.
#   A task- or block-level `check_mode: true` makes that task behave as a dry run
#   but does NOT flip the fact. So a test that set `check_mode: true` on a block
#   would exercise a different code path from the one `--check` actually takes,
#   pass, and prove nothing about the defect.
#
# Runs against localhost with fixtures in a temporary directory. No SSH, no
# vault, no secrets, no Docker; touches nothing outside its own tempdir.
#
# It exercises THE ROLE'S OWN TASK FILE, not a copy. A test that re-implemented
# the assertions would have passed while the role crashed — which is how the
# defect it covers reached a host in the first place.
#
# THE FOUR CASES
#
#   --check   absent file          → no crash, verification explicitly deferred
#             existing 0644 file   → FAILS (a live exposure, whatever the mode)
#   normal    absent file          → FAILS (the stack would boot uncredentialed)
#             correct 0600 file    → SUCCEEDS (the control: without it, a verifier
#                                    that failed on everything would look correct)
# ─────────────────────────────────────────────────────────────────────────────

- name: Regression — secret file verification
  hosts: localhost
  gather_facts: true
  connection: local
  become: false

  vars:
    keel_owner: "{{ lookup('env', 'USER') }}"
    keel_group: "{{ lookup('env', 'USER') }}"
    keel_fixture_root: /tmp/keel-secret-verification

  tasks:
    # `check_mode: false` throughout the fixture setup: these must exist on disk
    # in BOTH invocations, or the --check run would have nothing to inspect and
    # case 2 would silently pass by examining an absent file.
    - name: Create an isolated fixture directory
      ansible.builtin.file:
        path: "{{ keel_fixture_root }}"
        state: directory
        mode: "0700"
      check_mode: false

    - name: Fixture — a correctly locked-down secret
      ansible.builtin.copy:
        content: "fixture, not a credential\n"
        dest: "{{ keel_fixture_root }}/good.pem"
        mode: "0600"
      check_mode: false

    - name: Fixture — an existing secret with unsafe permissions
      ansible.builtin.copy:
        content: "fixture, not a credential\n"
        dest: "{{ keel_fixture_root }}/unsafe.pem"
        mode: "0644"
      check_mode: false

    - name: Fixture — make sure the absent path really is absent
      ansible.builtin.file:
        path: "{{ keel_fixture_root }}/absent.pem"
        state: absent
      check_mode: false

    - name: Announce which half is running
      ansible.builtin.debug:
        msg: >-
          {{ 'CHECK MODE run — cases 1 and 2' if ansible_check_mode
             else 'NORMAL mode run — cases 3 and 4' }}

    # ══ CHECK MODE ═════════════════════════════════════════════════════════
    - name: Case 1 — check mode over an absent file must not crash
      when: ansible_check_mode
      block:
        - name: Verify an absent path
          ansible.builtin.include_tasks: ../roles/keel/tasks/verify-secret-files.yml
          vars:
            keel_verify_paths: ["{{ keel_fixture_root }}/absent.pem"]

        - name: Case 1 passed
          ansible.builtin.debug:
            msg: PASS 1 — check mode over an absent file completed without crashing.
      rescue:
        - name: Case 1 FAILED
          ansible.builtin.fail:
            msg: >-
              REGRESSION 1: check mode over an absent secret file failed. On a
              clean host every secret is absent in check mode, so this makes
              --check unusable — the defect this test exists to catch.

    - name: Case 2 — check mode must still refuse an existing unsafe file
      when: ansible_check_mode
      block:
        - name: Verify an existing 0644 file
          ansible.builtin.include_tasks: ../roles/keel/tasks/verify-secret-files.yml
          vars:
            keel_verify_paths: ["{{ keel_fixture_root }}/unsafe.pem"]

        - name: Case 2 FAILED
          ansible.builtin.fail:
            msg: >-
              REGRESSION 2: check mode ACCEPTED an existing 0644 secret file. An
              existing credential readable by other accounts is a real exposure
              and must fail in every mode.
      rescue:
        - name: Case 2 passed
          ansible.builtin.debug:
            msg: PASS 2 — check mode refused an existing 0644 file, as it must.

    # ══ NORMAL MODE ════════════════════════════════════════════════════════
    - name: Case 3 — normal mode must refuse an absent file
      when: not ansible_check_mode
      block:
        - name: Verify an absent path
          ansible.builtin.include_tasks: ../roles/keel/tasks/verify-secret-files.yml
          vars:
            keel_verify_paths: ["{{ keel_fixture_root }}/absent.pem"]

        - name: Case 3 FAILED
          ansible.builtin.fail:
            msg: >-
              REGRESSION 3: normal mode ACCEPTED an absent secret file. The
              check-mode relaxation has leaked into real runs, and the stack
              would start on a missing credential.
      rescue:
        - name: Case 3 passed
          ansible.builtin.debug:
            msg: PASS 3 — normal mode refused an absent file, as it must.

    - name: Case 4 — normal mode must accept a correct 0600 owner-owned file
      when: not ansible_check_mode
      block:
        - name: Verify the good fixture
          ansible.builtin.include_tasks: ../roles/keel/tasks/verify-secret-files.yml
          vars:
            keel_verify_paths: ["{{ keel_fixture_root }}/good.pem"]

        - name: Case 4 passed
          ansible.builtin.debug:
            msg: PASS 4 — normal mode accepted a correct 0600 file.
      rescue:
        - name: Case 4 FAILED
          ansible.builtin.fail:
            msg: >-
              REGRESSION 4: a correct 0600 file owned by {{ keel_owner }} was
              REJECTED. Without this control a verifier that failed on
              everything would pass cases 2 and 3 and look correct.

    - name: Remove the fixture directory
      ansible.builtin.file:
        path: "{{ keel_fixture_root }}"
        state: absent
      check_mode: false
      when: not ansible_check_mode
