---
# ─────────────────────────────────────────────────────────────────────────────
# REGRESSION TEST — roles/keel/tasks/verify-secret-files.yml
#
#   tests/run-secret-verification.sh        ← runs BOTH modes; use this
#
# It must be invoked twice, once with --check and once without, and the runner
# script does exactly that. The reason is worth stating, because it is the same
# distinction the bug turned on:
#
#   `ansible_check_mode` is TRUE only when the PLAY was started with `--check`.
#   A task- or block-level `check_mode: true` makes that task behave as a dry run
#   but does NOT flip the fact. So a test that set `check_mode: true` on a block
#   would exercise a different code path from the one `--check` actually takes,
#   pass, and prove nothing about the defect.
#
# Runs against localhost with fixtures in a temporary directory. No SSH, no
# vault, no secrets, no Docker; touches nothing outside its own tempdir.
#
# It exercises THE ROLE'S OWN TASK FILE, not a copy. A test that re-implemented
# the assertions would have passed while the role crashed — which is how the
# defect it covers reached a host in the first place.
#
# THE SIX CASES
#
#   --check   absent file          → no crash, verification explicitly deferred
#             existing 0644 file   → FAILS (a live exposure, whatever the mode)
#   normal    absent file          → FAILS (the stack would boot uncredentialed)
#             correct 0600 file    → SUCCEEDS (the control: without it, a verifier
#                                    that failed on everything would look correct)
#
# Cases 5 and 6 cover the TWO-POLICY SPLIT, added after the gateway crash-looped
# on PEMs it could not read:
#
#   normal    0440 file, PEM policy       → SUCCEEDS (what uid 10001 needs)
#             0440 file, env-file policy  → FAILS    (so the two policies are
#                                           genuinely distinct, and case 5 is
#                                           not just a verifier that accepts
#                                           anything)
# ─────────────────────────────────────────────────────────────────────────────

- name: Regression — secret file verification
  hosts: localhost
  gather_facts: true
  connection: local
  become: false

  vars:
    keel_owner: "{{ lookup('env', 'USER') }}"
    # The invoking user's PRIMARY GROUP, read from the system rather than
    # assumed to equal the username. It does on many Linux distributions and
    # does not on macOS (`staff`), and the verifier now asserts group ownership
    # — so guessing here made the control case fail against a correct file.
    keel_group: "{{ lookup('pipe', 'id -gn') }}"
    keel_fixture_root: /tmp/keel-secret-verification

    # The verifier's expectation is now a PARAMETER rather than a hard-coded
    # 0600 root:root, because the role has two different secret policies: the
    # environment file is root-only, the JWT PEMs are group-readable by the
    # container's runtime GID. These play-level values are the "env file"
    # policy, which cases 1-4 exercise; case 5 overrides them to exercise the
    # PEM policy, and case 6 proves the two are not interchangeable.
    #
    # Fixtures are owned by the invoking user, not root — this suite runs
    # unprivileged on a control node and creates nothing outside /tmp.
    keel_verify_mode: "0600"
    keel_verify_owner: "{{ lookup('env', 'USER') }}"
    keel_verify_group: "{{ lookup('pipe', 'id -gn') }}"
    keel_verify_label: fixture

  tasks:
    # ⚠️ HOW A NEGATIVE CASE REPORTS FAILURE. Not with a `fail` inside the
    # `block` — the rescue catches that too, prints "PASS", and the case becomes
    # incapable of failing. Cases 2, 3, 6 and 7 were written that way and were
    # silently inert. A case that WRONGLY PASSES now records itself with
    # `set_fact` (which does not raise, so the rescue is not entered) and one
    # assertion at the end fails on a non-empty list.
    #
    # The POSITIVE cases (1, 4, 5) are unaffected: there the rescue means the
    # verifier wrongly REFUSED, so `fail` belongs in the rescue and works.
    - name: Start with no recorded leaks
      ansible.builtin.set_fact:
        verify_leaks: []

    # `check_mode: false` throughout the fixture setup: these must exist on disk
    # in BOTH invocations, or the --check run would have nothing to inspect and
    # case 2 would silently pass by examining an absent file.
    - name: Create an isolated fixture directory
      ansible.builtin.file:
        path: "{{ keel_fixture_root }}"
        state: directory
        mode: "0700"
      check_mode: false

    - name: Fixture — a correctly locked-down secret
      ansible.builtin.copy:
        content: "fixture, not a credential\n"
        dest: "{{ keel_fixture_root }}/good.pem"
        mode: "0600"
      check_mode: false

    - name: Fixture — an existing secret with unsafe permissions
      ansible.builtin.copy:
        content: "fixture, not a credential\n"
        dest: "{{ keel_fixture_root }}/unsafe.pem"
        mode: "0644"
      check_mode: false

    - name: Fixture — make sure the absent path really is absent
      ansible.builtin.file:
        path: "{{ keel_fixture_root }}/absent.pem"
        state: absent
      check_mode: false

    - name: Announce which half is running
      ansible.builtin.debug:
        msg: >-
          {{ 'CHECK MODE run — cases 1 and 2' if ansible_check_mode
             else 'NORMAL mode run — cases 3 and 4' }}

    # ══ CHECK MODE ═════════════════════════════════════════════════════════
    - name: Case 1 — check mode over an absent file must not crash
      when: ansible_check_mode
      block:
        - name: Verify an absent path
          ansible.builtin.include_tasks: ../roles/keel/tasks/verify-secret-files.yml
          vars:
            keel_verify_paths: ["{{ keel_fixture_root }}/absent.pem"]

        - name: Case 1 passed
          ansible.builtin.debug:
            msg: PASS 1 — check mode over an absent file completed without crashing.
      rescue:
        - name: Case 1 FAILED
          ansible.builtin.fail:
            msg: >-
              REGRESSION 1: check mode over an absent secret file failed. On a
              clean host every secret is absent in check mode, so this makes
              --check unusable — the defect this test exists to catch.

    - name: Case 2 — check mode must still refuse an existing unsafe file
      when: ansible_check_mode
      block:
        - name: Verify an existing 0644 file
          ansible.builtin.include_tasks: ../roles/keel/tasks/verify-secret-files.yml
          vars:
            keel_verify_paths: ["{{ keel_fixture_root }}/unsafe.pem"]

        - name: Record the leak
          ansible.builtin.set_fact:
            verify_leaks: "{{ verify_leaks + ['2: check mode ACCEPTED an existing 0644 secret file — an existing credential readable by other accounts is a real exposure and must fail in every mode'] }}"
      rescue:
        - name: Case 2 passed
          ansible.builtin.debug:
            msg: PASS 2 — check mode refused an existing 0644 file, as it must.

    # ══ NORMAL MODE ════════════════════════════════════════════════════════
    - name: Case 3 — normal mode must refuse an absent file
      when: not ansible_check_mode
      block:
        - name: Verify an absent path
          ansible.builtin.include_tasks: ../roles/keel/tasks/verify-secret-files.yml
          vars:
            keel_verify_paths: ["{{ keel_fixture_root }}/absent.pem"]

        - name: Record the leak
          ansible.builtin.set_fact:
            verify_leaks: "{{ verify_leaks + ['3: normal mode ACCEPTED an absent secret file — the check-mode relaxation has leaked into real runs, and the stack would start on a missing credential'] }}"
      rescue:
        - name: Case 3 passed
          ansible.builtin.debug:
            msg: PASS 3 — normal mode refused an absent file, as it must.

    - name: Case 4 — normal mode must accept a correct 0600 owner-owned file
      when: not ansible_check_mode
      block:
        - name: Verify the good fixture
          ansible.builtin.include_tasks: ../roles/keel/tasks/verify-secret-files.yml
          vars:
            keel_verify_paths: ["{{ keel_fixture_root }}/good.pem"]

        - name: Case 4 passed
          ansible.builtin.debug:
            msg: PASS 4 — normal mode accepted a correct 0600 file.
      rescue:
        - name: Case 4 FAILED
          ansible.builtin.fail:
            msg: >-
              REGRESSION 4: a correct 0600 file owned by {{ keel_owner }} was
              REJECTED. Without this control a verifier that failed on
              everything would pass cases 2 and 3 and look correct.

    # ══ THE TWO-POLICY SPLIT ═══════════════════════════════════════════════
    #
    # These are the cases that would have caught the gateway crash loop. The
    # verifier used to hard-code 0600 root:root for every path, so it AGREED
    # with provisioning that made the JWT PEMs unreadable to the container.
    # Now the expectation is supplied per call, and these two prove that the
    # two policies are genuinely distinct rather than one renamed twice.

    - name: Case 5 — the PEM policy must accept a 0440 group-readable file
      when: not ansible_check_mode
      block:
        - name: Fixture — a PEM readable by its group, as the container needs
          ansible.builtin.copy:
            content: "fixture, not a credential\n"
            dest: "{{ keel_fixture_root }}/grouped.pem"
            mode: "0440"
          check_mode: false

        - name: Verify it under the PEM policy
          ansible.builtin.include_tasks: ../roles/keel/tasks/verify-secret-files.yml
          vars:
            keel_verify_paths: ["{{ keel_fixture_root }}/grouped.pem"]
            keel_verify_mode: "0440"
            keel_verify_owner: "{{ lookup('env', 'USER') }}"
            keel_verify_group: "{{ lookup('pipe', 'id -gn') }}"
            keel_verify_label: JWT PEM policy

        - name: Case 5 passed
          ansible.builtin.debug:
            msg: >-
              PASS 5 — a 0440 group-readable PEM is accepted under the PEM
              policy. This is what the gateway's uid 10001 actually needs.
      rescue:
        - name: Case 5 FAILED
          ansible.builtin.fail:
            msg: >-
              REGRESSION 5: a 0440 file was REJECTED under the PEM policy. The
              verifier has gone back to insisting on 0600 for everything, which
              is the state that let 0600 root:root PEMs reach the host and
              crash-loop the gateway on "Permission denied".

    - name: Case 6 — the two policies must not be interchangeable
      when: not ansible_check_mode
      block:
        - name: Verify the 0440 PEM under the ENV FILE policy (must fail)
          ansible.builtin.include_tasks: ../roles/keel/tasks/verify-secret-files.yml
          vars:
            keel_verify_paths: ["{{ keel_fixture_root }}/grouped.pem"]
            keel_verify_mode: "0600"
            keel_verify_owner: "{{ lookup('env', 'USER') }}"
            keel_verify_group: "{{ lookup('pipe', 'id -gn') }}"
            keel_verify_label: environment-file policy applied to a PEM

        - name: Record the leak
          ansible.builtin.set_fact:
            verify_leaks: "{{ verify_leaks + ['6: a 0440 file PASSED the 0600 environment-file policy — the expectation is not actually being enforced, so neither policy means anything and case 5 proves nothing'] }}"
      rescue:
        - name: Case 6 passed
          ansible.builtin.debug:
            msg: >-
              PASS 6 — the env-file policy rejects a 0440 file, so the two
              policies are genuinely distinct and each is enforced.

    - name: Case 7 — the world-readable floor must not be defeatable by a parameter
      when: not ansible_check_mode
      block:
        - name: Verify the 0644 fixture while ASKING for 0644
          # The danger of making the expectation a parameter: someone "fixes" a
          # failing check by widening the expected mode until it passes. Here the
          # exact-mode assertion is satisfied — 0644 is genuinely what was asked
          # for — so only the separate `other` floor can still reject it. If that
          # floor were missing or also parameterised, this would pass.
          ansible.builtin.include_tasks: ../roles/keel/tasks/verify-secret-files.yml
          vars:
            keel_verify_paths: ["{{ keel_fixture_root }}/unsafe.pem"]
            keel_verify_mode: "0644"
            keel_verify_owner: "{{ lookup('env', 'USER') }}"
            keel_verify_group: "{{ lookup('pipe', 'id -gn') }}"
            keel_verify_label: deliberately over-wide expectation

        - name: Record the leak
          ansible.builtin.set_fact:
            verify_leaks: "{{ verify_leaks + ['7: a world-readable secret PASSED because the expected mode was widened to match it — the absolute floor is gone, so the mode parameter can be used to approve any exposure'] }}"
      rescue:
        - name: Case 7 passed
          ansible.builtin.debug:
            msg: >-
              PASS 7 — a world-readable secret is refused even when the expected
              mode explicitly permits it. The floor is independent of the
              parameter.

    - name: No unsafe or absent secret may have been accepted
      # The single place a negative case can fail this play. Runs in BOTH modes:
      # case 2 is a check-mode case, cases 3, 6 and 7 are normal-mode ones, and
      # an empty list in either mode simply means none of that mode's negatives
      # leaked.
      ansible.builtin.assert:
        that:
          - (verify_leaks | default([])) | length == 0
        fail_msg: >-
          REGRESSION: {{ (verify_leaks | default([])) | length }} case(s) that
          must be REFUSED were ACCEPTED — {{ (verify_leaks | default([])) | join(' || ') }}
        success_msg: Every case that had to be refused was refused.
        quiet: true

    - name: Remove the fixture directory
      ansible.builtin.file:
        path: "{{ keel_fixture_root }}"
        state: absent
      check_mode: false
      when: not ansible_check_mode
