---
# ─────────────────────────────────────────────────────────────────────────────
# Keel lab deployment.
#
#   check    ansible-playbook playbooks/keel.yml --check --diff --ask-vault-pass --ask-become-pass
#   deploy   ansible-playbook playbooks/keel.yml --ask-vault-pass --ask-become-pass
#   backup   ansible-playbook playbooks/keel.yml --tags backup --ask-vault-pass --ask-become-pass
#   restore  ansible-playbook playbooks/keel.yml --tags restore --ask-vault-pass --ask-become-pass -e keel_restore_archive=…
#   rollback ansible-playbook playbooks/keel.yml --tags rollback --ask-vault-pass --ask-become-pass
#
# The vault file is loaded AUTOMATICALLY from inventory/group_vars/linux_servers/
# because dc1-x86 is in that group — `--ask-vault-pass` supplies the passphrase
# and nothing names the file. There is deliberately no `vars_files`: a path there
# would be absolute or user-specific, and would work on exactly one machine.
#
# ⚠️ BACKUP, RESTORE AND ROLLBACK ARE `never`-TAGGED. Each one stops the stack or
# replaces live data, so none may run as a side effect of an ordinary deploy —
# they execute only when named explicitly on the command line.
# ─────────────────────────────────────────────────────────────────────────────

- name: Deploy Keel to the lab host
  hosts: linux_servers
  become: true
  gather_facts: true

  vars:
    # ═══ WHY THIS IS AT PLAY SCOPE AND NOT ON THE TASKS ═══════════════════════
    #
    # Ansible needs a temporary directory BEFORE it executes a task — the module
    # is staged there. Anything set in a task's own `vars:` is resolved too late
    # to influence that, which is why a task-level `ansible_user` override looked
    # correct and changed nothing:
    #
    #     fatal: [dc1-x86 -> localhost]: UNREACHABLE
    #     Attempted controller temp directory: /Users/labadmin/.ansible/tmp
    #
    # The default `~/.ansible/tmp` is expanded against the connection user, and
    # for a delegated task that user was still the REMOTE one. An absolute path
    # is never expanded, so naming one removes the question entirely.
    #
    # ⚠️ IT MUST BE VALID ON BOTH ENDS, and /tmp is the only thing that is:
    #   · the controller, under whatever Mac account is running ansible-playbook
    #   · dc1-x86, under labadmin, and under root after become
    # No account name and no /Users path appears, so this works for any operator
    # on any control node.
    ansible_remote_tmp: /tmp/ansible-keel

  tasks:
    - name: Deploy
      ansible.builtin.include_role:
        name: keel
      tags: [deploy]

    - name: Back up persistent state
      ansible.builtin.include_role:
        name: keel
        tasks_from: backup
      tags: [backup, never]

    - name: Restore persistent state
      ansible.builtin.include_role:
        name: keel
        tasks_from: restore
      tags: [restore, never]

    - name: Roll back to the previous images
      ansible.builtin.include_role:
        name: keel
        tasks_from: rollback
      tags: [rollback, never]
