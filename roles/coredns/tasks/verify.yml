---
# ⚠️ ASK THE RUNNING RESOLVER, NOT THE FILES ON DISK.
#
# Everything above proves the configuration was WRITTEN. None of it proves the
# daemon parsed it, bound its port, or serves the zone — and a Corefile that
# parses but serves nothing looks identical from the filesystem. So the last
# word belongs to a real query, through the real port, from this node.
#
# This is the same rule the Keel role follows after a deploy: a success
# message is not evidence.

# ⚠️ THE BIND WAIT CARRIES ITS OWN DIAGNOSIS, BECAUSE WITHOUT IT THIS TASK
# REPORTS THE WRONG PORT. The first Linux deployment failed here with
#
#   Timeout when waiting for 10.0.0.3:53
#
# while the actual cause, visible only in the service's own log, was
#
#   listen tcp 127.0.0.1:8080: bind: address already in use
#
# CoreDNS had died binding its HEALTH endpoint and never reached :53 — so the
# message named a port that was never the problem, and the service had
# crash-looped 173 times by the time anyone looked. Three round trips of
# diagnosis for something the daemon had been saying all along.
#
# The rescue costs nothing when the wait succeeds and turns a mystery into a
# one-step answer when it does not
# (enforced: tests/dns-task-shape.yml "the bind wait surfaces the service log
# when it fails").
- name: Give the daemon a moment to bind
  block:
    - name: Wait for the resolver to listen on port 53
      ansible.builtin.wait_for:
        host: "{{ coredns_bind_addresses | reject('match', '127\\.') | first | default('127.0.0.1') }}"
        port: 53
        timeout: 30

  rescue:
    - name: Ask the service why it is not listening
      # ⚠️ `failed_when: false` — this runs in a rescue and must not replace
      # the real failure with one of its own. The same reasoning as
      # roles/keel_reconcile's evidence collector, which once did exactly
      # that.
      ansible.builtin.command:
        argv: "{{ ['journalctl', '-u', coredns_service_name, '--no-pager', '-n', '25']
                  if not coredns_is_darwin
                  else ['tail', '-n', '25', coredns_log_dir ~ '/coredns.err'] }}"
      register: coredns_why
      changed_when: false
      failed_when: false

    - name: Report what it said, then fail
      ansible.builtin.fail:
        msg: >-
          CoreDNS is not listening on port 53 after 30s. The daemon's own log
          says why — read THIS, not the port number above, because a failure
          to bind ANY configured address (including the health endpoint on
          {{ coredns_health_address }} or readiness on
          {{ coredns_ready_address }}) kills the process before :53 is ever
          reached:
          ----- {{ 'journalctl -u ' ~ coredns_service_name if not coredns_is_darwin else coredns_log_dir ~ '/coredns.err' }} -----
          {{ (coredns_why.stdout | default('(no output)', true)) }}
          {{ (coredns_why.stderr | default('', true)) }}
          -----
          If it says "address already in use", something else on this host
          holds that address. Find it with
          {{ 'ss -lntup' if not coredns_is_darwin else 'lsof -nP -iTCP -sTCP:LISTEN' }}
          and change the colliding value in roles/coredns/defaults/main.yml —
          do not stop the other service to make room for this one.

- name: Readiness, as the resolver reports it
  ansible.builtin.uri:
    url: "http://{{ coredns_ready_address }}/ready"
    status_code: [200]
  register: coredns_ready_check
  retries: 6
  delay: 5
  until: coredns_ready_check is succeeded

- name: Health, as the resolver reports it
  ansible.builtin.uri:
    url: "http://{{ coredns_health_address }}/health"
    status_code: [200]

- name: Resolve every record this zone is supposed to serve
  # UDP, against this node's own LAN address — the path a client uses.
  ansible.builtin.command:
    cmd: >-
      dig +short +time=3 +tries=1
      @{{ coredns_bind_addresses | reject('match', '127\\.') | first }}
      {{ item.name }}.{{ coredns_zone }} A
  register: coredns_resolved
  changed_when: false
  loop: "{{ coredns_zone_records }}"
  loop_control:
    label: "{{ item.name }}.{{ coredns_zone }}"

- name: Each one must return exactly its own address
  ansible.builtin.assert:
    that:
      - (item.stdout_lines | select('match', '^\d') | list) == [item.item.ip]
    fail_msg: >-
      {{ item.item.name }}.{{ coredns_zone }} resolved to
      "{{ item.stdout_lines | join(', ') | default('nothing') }}" but the zone
      says {{ item.item.ip }}.
    success_msg: "{{ item.item.name }}.{{ coredns_zone }} → {{ item.item.ip }}"
  loop: "{{ coredns_resolved.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: The reserved production name must not resolve here
  # ⚠️ AN AUTHORITATIVE NXDOMAIN, NOT A FORWARDED LOOKUP. If this came back
  # with an answer, either somebody added the reserved name or the zone is not
  # authoritative and the query escaped to a public resolver — and the second
  # is worse, because it means internal names are leaving the LAN.
  ansible.builtin.command:
    cmd: >-
      dig +time=3 +tries=1
      @{{ coredns_bind_addresses | reject('match', '127\\.') | first }}
      keel.{{ coredns_zone }} A
  register: coredns_reserved
  changed_when: false

- name: Confirm it is refused by this zone's own authority
  # ⚠️ BOTH ITEMS ARE QUOTED, AND THE FIRST ONE HAS TO BE. It reads
  # `search('status: NXDOMAIN')` — and `status: ` is a colon followed by a
  # space, so an UNQUOTED list item is parsed by YAML as a MAPPING, not a
  # string:
  #
  #   {"coredns_reserved.stdout is search('status": "NXDOMAIN')"}
  #
  # Ansible then refuses the task outright with "Conditional expressions must
  # be strings." That is exactly how the third watched deployment stopped, on
  # the very last task of the primary, after CoreDNS had been installed and
  # every record had already resolved correctly.
  #
  # ⚠️ AND NEITHER ITEM USES A BACKSLASH ESCAPE, WHICH IS THE SECOND HALF OF
  # THE SAME LESSON. The `aa` check was written `search("flags:[^;]*\baa\b")`
  # and failed on the host while the IDENTICAL expression returned True from
  # a `debug` task against the same captured output. Proven on dc1-arm-1,
  # four variants in one play:
  #
  #   that:  search("...\baa\b")    → FAIL
  #   debug: search("...\baa\b")    → True
  #   that:  search("...\\baa\\b")  → pass
  #   that:  search("... aa[ ;]")   → pass
  #
  # Ansible's CONDITIONAL evaluation applies Python string-literal escape
  # processing; ordinary templating does not. So `\b` becomes a backspace
  # (0x08) only inside `that:`, and the word-boundary anchors silently match
  # nothing. The neighbouring `\d`, `\S` and `\.` survive untouched precisely
  # because Python leaves UNRECOGNISED escapes alone — which is why those
  # assertions always worked and this one never could.
  #
  # Doubling the backslash also works, but it depends on counting how many
  # layers consume one. This matches the literal text instead: dig prints
  # `;; flags: qr aa rd;`, so ` aa` followed by a space or the terminating
  # semicolon is exact, and there is nothing left to escape
  # (enforced: tests/dns-task-shape.yml "no conditional depends on a
  # backslash escape").
  ansible.builtin.assert:
    that:
      - 'coredns_reserved.stdout is search("status: NXDOMAIN")'
      - 'coredns_reserved.stdout is search("flags:[^;]* aa[ ;]")'
    fail_msg: >-
      keel.{{ coredns_zone }} did not come back as an AUTHORITATIVE NXDOMAIN.
      Either the reserved production name has been added to the zone, or this
      server is not authoritative for {{ coredns_zone }} and the query was
      forwarded — which would mean internal names are leaving the LAN.
      ⚠️ BOTH LINES ARE SHOWN BECAUSE THE ASSERTION IS ABOUT BOTH. An earlier
      version printed only the status line while failing on the flags check,
      which sent three rounds of diagnosis after the wrong thing.
      Status: {{ coredns_reserved.stdout_lines | select('search', 'status:') | join(' ') | default('(no status line)', true) }}
      Flags: {{ coredns_reserved.stdout_lines | select('search', '^;; flags:') | join(' ') | default('(no flags line)', true) }}
    success_msg: "keel.{{ coredns_zone }} → authoritative NXDOMAIN, as reserved."
