---
# ─────────────────────────────────────────────────────────────────────────────
# REMOVAL — the way back out, and the thing that makes registration reversible.
#
#   read -rs CI_RUNNER_REMOVAL_TOKEN && export CI_RUNNER_REMOVAL_TOKEN   # or omit: prompt
#   ansible-playbook playbooks/ci-runner.yml --tags unregister --ask-become-pass
#   unset CI_RUNNER_REMOVAL_TOKEN
#
# Same discipline as registration (tasks/register.yml): never a process
# argument anywhere, no_log, nothing written down.
# The VM survives, provisioned and idle, so re-registering is one command and
# not a rebuild.
# ─────────────────────────────────────────────────────────────────────────────

- name: Obtain the removal token without exposing it
  ansible.builtin.include_tasks: token-input.yml
  vars:
    ci_token_kind: removal
    ci_token_env: CI_RUNNER_REMOVAL_TOKEN
    ci_token_legacy: ci_runner_removal_token

- name: A staging directory for the removal script
  ansible.builtin.file:
    path: "{{ ci_stage_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Stage the removal script on the host
  ansible.builtin.template:
    src: guest-unregister.sh.j2
    dest: "{{ ci_stage_dir }}/unregister.sh"
    mode: "0700"
    validate: /bin/bash -n %s

- name: Push the removal script into the guest
  ansible.builtin.command:
    argv:
      - lxc
      - file
      - push
      - "{{ ci_stage_dir }}/unregister.sh"
      - "{{ ci_vm_name }}/root/unregister.sh"
      - --mode=0700
      - --uid=0
      - --gid=0
  changed_when: true

- name: Remove the runner, then clean up whatever happened
  block:
    - name: Remove the runner
      ansible.builtin.command:
        argv: [lxc, exec, "{{ ci_vm_name }}", "-T", "--", /root/unregister.sh]
        # THE ONLY PLACE THE TOKEN IS SENT. `-T` disables pty allocation,
        # which is what makes `lxc exec` pipe this straight through to the
        # script's stdin (never its argv).
        stdin: "{{ ci_runner_token_input }}"
        stdin_add_newline: true
      vars:
        # Stream the module (and so this stdin value) to the host over the SSH
        # session instead of writing it to a temp file there first.
        ansible_pipelining: true
      register: ci_unregister
      # ⚠️ NOT NEGOTIABLE. Without this the token appears in -v output, in any
      # callback plugin and in AWX/Ansible logs. The result is unwrapped below,
      # which is safe because the script prints no token and the runner masks
      # the one it was given.
      no_log: true
      # Evaluated below, after the cleanup, so a failure cannot skip it.
      failed_when: false
      changed_when: "'CHANGED:' in ci_unregister.stdout"
  always:
    - name: Forget the token for the rest of the play
      ansible.builtin.set_fact:
        ci_runner_token_input: ""
      no_log: true

    - name: Remove the staged removal script
      ansible.builtin.file:
        path: "{{ ci_stage_dir }}/unregister.sh"
        state: absent

    - name: Remove it from the guest too
      # It contains no secret, but a script whose whole purpose is to consume
      # a token has no reason to stay on disk in the CI VM — least of all
      # after a failed attempt.
      ansible.builtin.command:
        argv: [lxc, exec, "{{ ci_vm_name }}", "-T", "--", rm, -f, /root/unregister.sh]
      changed_when: false

- name: What removal reported
  ansible.builtin.debug:
    msg: "{{ (ci_unregister.stdout_lines | default([])) + (ci_unregister.stderr_lines | default([])) }}"

- name: The removal must have succeeded
  ansible.builtin.assert:
    that:
      - ci_unregister.rc | default(1) == 0
    fail_msg: >-
      Removal failed (exit {{ ci_unregister.rc | default('?') }}); the output is
      above. The token was sent once and may now be spent: generate a new one
      before retrying.
    quiet: true

- name: Confirm no runner service remains
  ansible.builtin.command:
    argv: [lxc, exec, "{{ ci_vm_name }}", "-T", "--", /bin/sh, -c,
           "systemctl list-units --type=service --all --no-legend 'actions.runner.*' | wc -l"]
  register: ci_svc_left
  changed_when: false
  check_mode: false

- name: The runner service must be gone
  ansible.builtin.assert:
    that:
      - (ci_svc_left.stdout | trim | int) == 0
    fail_msg: >-
      A runner service unit is still present in {{ ci_vm_name }}.
      Inspect with: lxc exec {{ ci_vm_name }} -- systemctl list-units 'actions.runner.*'
    quiet: true
