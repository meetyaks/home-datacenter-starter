---
# ─────────────────────────────────────────────────────────────────────────────
# Everything that must be true BEFORE anything is created. Each check exists
# because its absence produces a confusing failure later rather than here.
# ─────────────────────────────────────────────────────────────────────────────

- name: Confirm the target is x86-64
  ansible.builtin.assert:
    that:
      - ansible_architecture == 'x86_64'
    fail_msg: >-
      {{ ci_vm_name }} must be x86-64: the runner tarball, the Actions runner itself and
      the linux/amd64 images the integration lane builds are all architecture
      specific. Got {{ ansible_architecture }}.
    quiet: true

- name: Confirm hardware virtualisation is available
  # An LXD VM needs KVM. Without it LXD silently falls back to nothing usable,
  # and a CONTAINER would share the host kernel — which is exactly the boundary
  # this role exists to create.
  ansible.builtin.stat:
    path: /dev/kvm
  register: ci_kvm

- name: /dev/kvm must exist
  ansible.builtin.assert:
    that:
      - ci_kvm.stat.exists | default(false)
    fail_msg: >-
      /dev/kvm is absent, so LXD cannot start a virtual machine. A container
      would share the host kernel and could not be called isolated from
      production — this role refuses to degrade to one silently.
    quiet: true

- name: Read the LXD version
  ansible.builtin.command:
    argv: [lxd, version]
  register: ci_lxd_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: LXD must be installed
  ansible.builtin.assert:
    that:
      - ci_lxd_version.rc == 0
    fail_msg: >-
      `lxd` is not available on {{ inventory_hostname }}. Install it before
      running this role; provisioning a hypervisor is a host-lifecycle decision
      and not something a CI role should take on its own.
    quiet: true

- name: Find out what already uses LXD on this host
  # ⚠️ THIS ROLE INITIALISES LXD, which is only defensible because nothing else
  # owns it. Inspection found no pools, no managed networks and no instances. If
  # that has changed, another owner exists and initialising would be taking over
  # somebody else's hypervisor.
  #
  #
  # ⚠️ JSON, NOT CSV. The CSV form once reported this role's own VM as a
  # stranger: its addresses column is quoted and multi-line once an instance
  # has an IP, and the continuation line matched no name. JSON has no such
  # shape, and it carries each instance's config — which is where a sibling
  # runner VM's ownership marker lives (see ci_lxd_owner_key).
  ansible.builtin.command:
    argv: [lxc, list, --format, json]
  register: ci_lxd_instances
  changed_when: false
  failed_when: false
  check_mode: false

- name: Parse what LXD holds
  ansible.builtin.set_fact:
    ci_lxd_instances_json: "{{ ci_lxd_instances.stdout | default('[]', true) }}"

- name: No instance may exist that this role did not create
  # Siblings — other runner VMs this role built on the same host — are not
  # strangers: see ci_lxd_sibling_instances and ci_lxd_owner_key.
  ansible.builtin.assert:
    that:
      - (ci_lxd_foreign_instances | length) == 0
    fail_msg: >-
      LXD on {{ inventory_hostname }} already holds instances this role does not
      own: {{ ci_lxd_foreign_instances }}.
      Someone else is using this hypervisor. Stop and establish ownership rather
      than reconfiguring it underneath them.
    quiet: true

# ── Capacity, from the live host (opt-in: ci_capacity_check) ──────────────
- name: Account for every other instance's limits
  ansible.builtin.assert:
    that:
      - (ci_capacity_instances | selectattr('memory_mib', 'lt', 0) | list | length) == 0
      - (ci_capacity_instances | selectattr('cpu', 'lt', 0) | list | length) == 0
      - (ci_vm_memory_mib | int) > 0
    fail_msg: >-
      Cannot account for host capacity: every other instance needs a numeric
      limits.cpu and a limits.memory in MiB/GiB, and so does this one. Found:
      {{ ci_capacity_instances }}; this instance: {{ ci_vm_memory }}.
    quiet: true
  when: ci_capacity_check | bool

- name: This instance must fit beside production and the other instances
  vars:
    ci_cap_other_mem: "{{ ci_capacity_instances | map(attribute='memory_mib') | sum }}"
    ci_cap_other_cpu: "{{ ci_capacity_instances | map(attribute='cpu') | sum }}"
  ansible.builtin.assert:
    that:
      - (ansible_memtotal_mb | int) - (ci_cap_other_mem | int) - (ci_vm_memory_mib | int) >= (ci_capacity_reserve_memory_mib | int)
      - (ansible_processor_vcpus | int) - (ci_cap_other_cpu | int) - (ci_vm_cpu | int) >= (ci_capacity_reserve_cpu | int)
    fail_msg: >-
      {{ ci_vm_name }} ({{ ci_vm_cpu }} vCPU, {{ ci_vm_memory_mib }} MiB) does not
      fit on {{ inventory_hostname }}: {{ ansible_memtotal_mb }} MiB and
      {{ ansible_processor_vcpus }} vCPU total, {{ ci_cap_other_mem }} MiB and
      {{ ci_cap_other_cpu }} vCPU already committed to other instances, and
      {{ ci_capacity_reserve_memory_mib }} MiB / {{ ci_capacity_reserve_cpu }} vCPU
      must stay for the host and production. Reduce this instance or free capacity.
    success_msg: >-
      Capacity: {{ ansible_memtotal_mb }} MiB / {{ ansible_processor_vcpus }} vCPU
      total; others {{ ci_cap_other_mem }} MiB / {{ ci_cap_other_cpu }} vCPU;
      this {{ ci_vm_memory_mib }} MiB / {{ ci_vm_cpu }} vCPU; reserve kept.
    quiet: true
  when: ci_capacity_check | bool

- name: Confirm the volume group has room for the CI volume
  ansible.builtin.command:
    argv: [vgs, --noheadings, --nosuffix, --units, g, -o, vg_free, "{{ ci_vg_name }}"]
  register: ci_vg_free
  changed_when: false
  failed_when: false
  check_mode: false

# ⚠️ AND WHETHER THE VOLUME IS ALREADY ALLOCATED, WHICH THIS USED TO IGNORE.
# The first provisioning run took its 180 GiB. The second refused to start,
# because the free space the assertion demands had become the volume the role
# itself created — leaving `ubuntu-vg has 74.68 GiB free, which is less than the
# 180g this role wants`. A role that can only be run once is not a role, it is a
# script; and this fired on the re-run that was recovering an interrupted
# deployment, which is exactly when a preflight must not be the obstacle.
- name: Observe whether the CI volume is already allocated
  ansible.builtin.stat:
    path: "/dev/{{ ci_vg_name }}/{{ ci_lv_name }}"
  register: ci_lv_already
  check_mode: false

- name: The volume group must have room, with a reserve left over
  # Checked BEFORE `lvcreate` so "not enough space" arrives as a sentence rather
  # than as a half-made volume. The reserve is the point: a production host with
  # a full VG cannot grow /srv/data or take a snapshot.
  ansible.builtin.assert:
    that:
      - (ci_vg_free.stdout | default('0') | trim | float) >= (ci_lv_size | regex_replace('[gG]$', '') | float) + (ci_vg_reserve_g | float)
    fail_msg: >-
      {{ ci_vg_name }} has {{ ci_vg_free.stdout | default('?') | trim }} GiB free,
      which is less than the {{ ci_lv_size }} this role wants plus the
      {{ ci_vg_reserve_g }} GiB that must stay free. Reduce ci_lv_size
      rather than consuming the last extents of a production volume group.
    success_msg: >-
      {{ ci_vg_name }} has {{ ci_vg_free.stdout | default('?') | trim }} GiB free;
      taking {{ ci_lv_size }} leaves a reserve.
    quiet: true
  when:
    - ci_vg_free.rc == 0
    - not ci_lv_already.stat.exists

- name: The CI volume is already allocated
  ansible.builtin.debug:
    msg: >-
      /dev/{{ ci_vg_name }}/{{ ci_lv_name }} already exists, so no new extents
      are needed; {{ ci_vg_name }} has
      {{ ci_vg_free.stdout | default('?') | trim }} GiB free beyond it.
  when: ci_lv_already.stat.exists

- name: Report the plan
  ansible.builtin.debug:
    msg: >-
      {{ ci_vm_name }}: {{ ci_vm_cpu }} vCPU, {{ ci_vm_memory }},
      {{ ci_vm_root_size }} root on a dedicated {{ ci_lv_size }} volume;
      labels [{{ ci_runner_labels }}]; scoped to {{ ci_runner_scope_url }}.
