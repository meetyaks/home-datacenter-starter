---
- name: Reload the CI egress policy
  # The applier, not a bare `nft -f`: the policy is nftables AND the DOCKER-USER
  # accept that lets anything nftables permitted actually leave. Reloading only
  # the first half produces a host that looks correctly configured and a CI VM
  # with no internet.
  #
  # The nft file deletes its own table before redefining it, so this is atomic
  # and idempotent — see the create-then-delete idiom at the top of the template.
  ansible.builtin.command:
    argv: [/usr/local/sbin/ci-egress-apply]
  changed_when: true

- name: Reload systemd for the egress unit
  ansible.builtin.systemd_service:
    daemon_reload: true
