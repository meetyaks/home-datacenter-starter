---
# ─────────────────────────────────────────────────────────────────────────────
# Keel lab deployment — defaults.
#
# ⚠️ NO SECRET VALUE APPEARS IN THIS FILE OR ANYWHERE ELSE IN THIS REPOSITORY.
# Every credential is read from `keel_vault_*` variables that live only in
# inventory/group_vars/linux_servers/vault.yml, which .gitignore excludes. The role
# asserts each one is defined before it writes anything, so a missing secret
# stops the run instead of rendering an empty password into a live stack.
# ─────────────────────────────────────────────────────────────────────────────

# ── WHICH COMMIT IS BEING DEPLOYED ──────────────────────────────────────────
#
# The full 40-character SHA, never a branch and never a tag. It is the only
# version identity this deployment has: the image tag, the build directory and
# the manifest all derive from it, and the role refuses to build if the archive
# it received does not carry this exact value.
keel_commit: 2e84470d208bdcf213baba850659e5d5ded006ab

# Derived. `sha-2e84470d` — short enough to read, long enough to be unambiguous.
keel_commit_short: "{{ keel_commit[:8] }}"
keel_image_tag: "sha-{{ keel_commit_short }}"
keel_gateway_image: "keel-gateway:{{ keel_image_tag }}"
keel_web_image: "keel-web:{{ keel_image_tag }}"

# ── WHERE THE SOURCE COMES FROM ─────────────────────────────────────────────
#
# A git checkout on the CONTROL node. The role runs `git archive` on that exact
# SHA, so what reaches the host is the commit's tree and nothing else: no .git,
# no node_modules, no working-tree edits, no build output, no secrets.
#
# `lookup()` ALWAYS evaluates on the controller, so this is the controller's own
# HOME regardless of who the remote user is. No hostname and no /Users path is
# written down anywhere: this works for any operator on any control node.
keel_source_repo: "{{ lookup('env', 'HOME') }}/Projects/keel"

# ── THE CONTROLLER'S OWN CONTEXT ────────────────────────────────────────────
#
# ⚠️ THE TEMP-DIRECTORY FIX IS NOT HERE. It is `ansible_remote_tmp` at PLAY scope
# in playbooks/keel.yml, because Ansible needs a staging directory before it runs
# a task and anything set per task is resolved too late to matter. A previous
# version of this file offered `keel_controller_user` as an `ansible_user`
# override for exactly that purpose; it was ineffective and has been removed from
# the tasks. It survives below only for MESSAGES and for the archive filename,
# where it is read long after any connection has been made.
#
# `keel_controller_python` is genuine and still applied per delegated task: it
# keeps the controller from inheriting an interpreter path resolved for the
# remote host.
#
# Nothing here names a host, an account or a /Users path; both are read from the
# running process.
keel_controller_user: "{{ lookup('env', 'USER') }}"
keel_controller_python: "{{ ansible_playbook_python }}"

# The staging archive, on the CONTROLLER. `/tmp` rather than a home directory so
# no account name is assumed; the controller user is in the filename so two
# operators deploying the same commit from the same machine cannot collide.
keel_controller_tmp_archive: "/tmp/keel-{{ keel_commit_short }}-{{ keel_controller_user }}.tar.gz"

# ── FILESYSTEM ──────────────────────────────────────────────────────────────
#
# Build inputs and runtime state are separated on purpose: deleting a build
# directory must never be able to reach data.
keel_root: /srv/data/services/keel
keel_build_root: "{{ keel_root }}/builds"
keel_build_dir: "{{ keel_build_root }}/{{ keel_commit_short }}"
keel_data_root: "{{ keel_root }}/data"
keel_secrets_dir: "{{ keel_root }}/secrets"
keel_env_dir: "{{ keel_root }}/env"
keel_env_file: "{{ keel_env_dir }}/keel.env"
keel_compose_file: "{{ keel_root }}/compose.lab.yml"

keel_owner: root
keel_group: root

# ── WHAT THE COMMIT MUST CONTAIN ────────────────────────────────────────────
#
# Checked against the commit's own git TREE during preflight, so `--check` can
# prove the named commit is deployable before a real run spends a build finding
# out. Trees count as objects, which is how the two directories are checked
# without enumerating them.
#
# `packs/` and `profiles/` are here because the gateway image bakes them in and
# the runtime resolves `<cwd>/packs`: a commit predating that change builds an
# image with NO packs, and the only symptom is a gateway that serves an empty
# catalogue. Better to refuse the commit than to ship that.
keel_required_commit_paths:
  - infra/lab/compose.lab.yml
  - packages/gateway/Dockerfile
  - apps/web/Dockerfile
  - packs
  - profiles

# Data subdirectories, each a bind target in compose.lab.yml.
keel_data_dirs:
  - "{{ keel_data_root }}/postgres"
  - "{{ keel_data_root }}/nats"
  - "{{ keel_data_root }}/minio"

# ── NON-SECRET CONFIGURATION ────────────────────────────────────────────────
keel_blob_bucket: keel-lab
keel_hostname: keel.dc1.lan
keel_jwt_issuer: "https://{{ keel_hostname }}/"
keel_jwt_audience: keel-api
keel_cors_origins: "https://{{ keel_hostname }}"
keel_oidc_issuer: "https://{{ keel_hostname }}/oidc/"
keel_oidc_client_id: keel-lab

# Loopback publishes the stack makes; Caddy is the only LAN ingress.
keel_gateway_loopback_port: 3000
keel_web_loopback_port: 8080

# ── CADDY ───────────────────────────────────────────────────────────────────
#
# Caddy is separately managed shared infrastructure. This role writes ONE file
# into its drop-in directory and reloads it; it never installs or reconfigures
# Caddy itself.
keel_caddy_enabled: true
keel_caddy_sites_dir: /etc/caddy/conf.d
keel_caddy_site_file: "{{ keel_caddy_sites_dir }}/keel.caddy"

# ── BEHAVIOUR ───────────────────────────────────────────────────────────────
#
# Rebuild even when the expected tag already resolves to an image. Off by
# default: a tag derived from an immutable commit cannot legitimately mean two
# different images, so a present tag is a finished build.
keel_force_rebuild: false

# Bounded waits. A deployment that hangs is a deployment nobody can diagnose.
keel_build_timeout_seconds: 3600
keel_health_retries: 30
keel_health_delay_seconds: 10
