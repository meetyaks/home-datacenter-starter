---
# ─────────────────────────────────────────────────────────────────────────────
# Secret material, rendered from Ansible Vault and never echoed.
#
# `no_log: true` on every task that touches a credential. Without it Ansible
# prints the rendered content on a diff or a failure, which would put the
# database password and the JWT private key into the deployment log — the exact
# outcome the whole "no secrets in git" rule exists to prevent.
#
# ═══ TWO FILE POLICIES, NOT ONE ══════════════════════════════════════════════
#
# Everything here used to be 0600 root:root. That is correct for the environment
# file and WRONG for the PEMs, and the difference is who opens them:
#
#   env file   read HOST-SIDE by `docker compose`, running as root, before any
#              container exists.                     -> 0600 root:root
#
#   JWT PEMs   bind-mounted into the gateway and read by the process inside it,
#              which runs as uid/gid 10001 because the image says `USER keel`.
#              A bind mount matches NUMERIC ids, so a root-only file is
#              unreadable there.                     -> 0440 root:<gid 10001>
#
# Provisioning both the same way produced the first native startup failure:
#
#     cat: /secrets/jwt_private.pem: Permission denied
#     production.insecure_config: KEEL_JWT_PRIVATE_KEY missing or empty
#
# The `cat` failed, the shell exported an EMPTY string, and
# `assertProductionSafe` refused to boot on it. The validator was right; the
# provisioning was wrong. The fix is here — not in the validator, and not by
# running the container as root.
# ─────────────────────────────────────────────────────────────────────────────

# ── JWT signing keypair ─────────────────────────────────────────────────────

- name: Install the JWT signing keypair
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ keel_secrets_dir }}/{{ item.name }}"
    owner: "{{ keel_owner }}"
    # Group-owned by the container's runtime GID — the point of this task.
    group: "{{ keel_runtime_group }}"
    # 0440: readable by root and by the container's group, writable by NOBODY.
    # Not even root rewrites these in place; this task supplies the content.
    mode: "{{ keel_jwt_file_mode }}"
  loop:
    - { name: jwt_private.pem, content: "{{ keel_vault_jwt_private_key }}" }
    - { name: jwt_public.pem, content: "{{ keel_vault_jwt_public_key }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart Keel gateway

# ── Environment file ────────────────────────────────────────────────────────

- name: Render the environment file
  ansible.builtin.template:
    src: keel.env.j2
    dest: "{{ keel_env_file }}"
    owner: "{{ keel_owner }}"
    group: "{{ keel_group }}"
    mode: "{{ keel_env_file_mode }}"
  no_log: true
  notify: Restart Keel stack

# ── PostgreSQL TLS material ─────────────────────────────────────────────────
#
# Generated ON THE HOST, per host, and never committed: a private key in git is
# not a private key. Idempotent by construction — `creates:` means the key is
# only made when absent, so re-running the role never rotates the certificate
# out from under a running cluster.
#
# `sslmode=require` in the compose file encrypts without verifying the server's
# identity, so a self-signed certificate is the honest match: there is no CA
# here to verify against, and claiming `verify-full` would simply fail.

- name: Generate the PostgreSQL server key and self-signed certificate
  ansible.builtin.command:
    cmd: >-
      openssl req -new -x509 -nodes
      -days {{ keel_pg_cert_days }}
      -subj "/CN={{ keel_pg_cert_cn }}"
      -keyout {{ keel_pg_key_file }}
      -out {{ keel_pg_cert_file }}
    creates: "{{ keel_pg_key_file }}"
  when: not ansible_check_mode
  notify: Restart Keel stack

- name: Set the ownership and mode PostgreSQL requires for its server key
  # ⚠️ POSTGRES ENFORCES THIS ITSELF — it refuses to start on a key that is
  # group- or world-accessible. So this is not defence in depth; it is the
  # difference between a database that starts and one that does not. uid/gid 999
  # is `postgres` inside pgvector/pgvector:pg16, and a bind mount carries the
  # NUMBER, so the numeric id is what has to be right.
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ keel_pg_uid }}"
    group: "{{ keel_pg_gid }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ keel_pg_key_file }}", mode: "0600" }
    # The certificate is public material; it is presented to every client.
    - { path: "{{ keel_pg_cert_file }}", mode: "0644" }
  loop_control:
    label: "{{ item.path }}"
  when: not ansible_check_mode

# ── Verification ────────────────────────────────────────────────────────────
#
# Verification lives in its own file so the regression test can exercise the
# SAME tasks against fixtures. A test that re-implemented this logic would pass
# while the role stayed broken.
#
# Called TWICE, once per policy, because one expectation cannot describe both
# files. The previous single "everything is 0600 root:root" assertion is what
# agreed with the broken provisioning and let it reach the host.

- name: Verify the environment file is owner-only
  ansible.builtin.include_tasks: verify-secret-files.yml
  vars:
    keel_verify_paths:
      - "{{ keel_env_file }}"
    keel_verify_mode: "{{ keel_env_file_mode }}"
    keel_verify_owner: "{{ keel_owner }}"
    keel_verify_group: "{{ keel_group }}"
    keel_verify_label: environment file, read host-side by compose as root

- name: Verify the JWT PEMs are readable by the container's group and no wider
  ansible.builtin.include_tasks: verify-secret-files.yml
  vars:
    keel_verify_paths:
      - "{{ keel_secrets_dir }}/jwt_private.pem"
      - "{{ keel_secrets_dir }}/jwt_public.pem"
    keel_verify_mode: "{{ keel_jwt_file_mode }}"
    keel_verify_owner: "{{ keel_owner }}"
    keel_verify_group: "{{ keel_runtime_group }}"
    keel_verify_label: JWT PEM, read inside the gateway as uid {{ keel_runtime_gid }}
