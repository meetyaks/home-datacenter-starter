---
# ─────────────────────────────────────────────────────────────────────────────
# Secret material. Everything here is 0600 root:root, rendered from Ansible Vault,
# and never echoed.
#
# `no_log: true` on every task that touches a credential. Without it Ansible
# prints the rendered content on a diff or a failure, which would put the
# database password and the JWT private key into the deployment log — the exact
# outcome the whole "no secrets in git" rule exists to prevent.
# ─────────────────────────────────────────────────────────────────────────────

- name: Install the JWT signing keypair
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ keel_secrets_dir }}/{{ item.name }}"
    owner: "{{ keel_owner }}"
    group: "{{ keel_group }}"
    mode: "0600"
  loop:
    - { name: jwt_private.pem, content: "{{ keel_vault_jwt_private_key }}" }
    - { name: jwt_public.pem, content: "{{ keel_vault_jwt_public_key }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart Keel gateway

- name: Render the environment file
  ansible.builtin.template:
    src: keel.env.j2
    dest: "{{ keel_env_file }}"
    owner: "{{ keel_owner }}"
    group: "{{ keel_group }}"
    mode: "0600"
  no_log: true
  notify: Restart Keel stack

- name: Confirm the secret files are not world- or group-readable
  ansible.builtin.stat:
    path: "{{ item }}"
  register: keel_secret_stat
  loop:
    - "{{ keel_env_file }}"
    - "{{ keel_secrets_dir }}/jwt_private.pem"
    - "{{ keel_secrets_dir }}/jwt_public.pem"

- name: Fail if any secret file is readable beyond its owner
  ansible.builtin.assert:
    that:
      - item.stat.mode == '0600'
      - item.stat.pw_name == keel_owner
    fail_msg: >-
      {{ item.item }} is {{ item.stat.mode }} owned by {{ item.stat.pw_name }};
      expected 0600 owned by {{ keel_owner }}. A credential readable by another
      account on this host is a credential that has already leaked.
    quiet: true
  loop: "{{ keel_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
