---
# ─────────────────────────────────────────────────────────────────────────────
# Compose deployment. The stack definition comes from the COMMIT, not from this
# repository — two hand-maintained copies of one stack drift, and the drift is
# silent until a deploy behaves unlike the tree it claims to be.
# ─────────────────────────────────────────────────────────────────────────────

- name: Install the stack definition from the built commit
  ansible.builtin.copy:
    src: "{{ keel_build_dir }}/infra/lab/compose.lab.yml"
    dest: "{{ keel_compose_file }}"
    remote_src: true
    owner: "{{ keel_owner }}"
    group: "{{ keel_group }}"
    mode: "0644"
  notify: Restart Keel stack
  # In check mode on a fresh host the source was never unpacked, so there is
  # nothing to copy and `remote_src` would fail on a missing file.
  when: not ansible_check_mode

- name: Look for an already-installed stack definition
  # Read-only, and it runs in EVERY mode — because the ingress assertion below
  # must still fire against a stack that is already on disk. An existing file
  # publishing a LAN port is a live exposure whether or not this run changes it.
  ansible.builtin.stat:
    path: "{{ keel_compose_file }}"
  register: keel_compose_installed
  check_mode: false

- name: Refuse to continue if the stack would publish a LAN port
  # The whole ingress rule in one check, made from the RENDERED config rather
  # than the template: only 127.0.0.1 publishes are allowed, because Caddy is the
  # single way in. A `3000:3000` slipping in here would put the gateway on every
  # interface, which is the most likely way this stack becomes reachable by
  # accident.
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      docker compose --env-file {{ keel_env_file }} -f {{ keel_compose_file }} config
      | grep -E '^\s+host_ip:' | grep -v '127\.0\.0\.1' | wc -l
    executable: /bin/bash
    chdir: "{{ keel_root }}"
  register: keel_lan_publishes
  changed_when: false
  failed_when: false
  # Runs in check mode too — see the stat above. Guarded on the file existing so
  # a fresh host does not try to render a stack that is not there yet.
  check_mode: false
  when: keel_compose_installed.stat.exists | default(false)

- name: Fail when any publish is not loopback
  ansible.builtin.assert:
    that:
      - (keel_lan_publishes.stdout | default('0') | trim | int) == 0
    fail_msg: >-
      The rendered stack publishes
      {{ keel_lan_publishes.stdout | default('?') | trim }} port(s) on a
      non-loopback address. Caddy is the only permitted LAN ingress. This fails
      in check mode too: an installed stack that exposes a dependency is exposing
      it right now, whatever this run was going to change.
    success_msg: Every published port is bound to 127.0.0.1.
  when: keel_compose_installed.stat.exists | default(false)

- name: Note that ingress cannot be checked before the stack is installed
  ansible.builtin.debug:
    msg: >-
      CHECK MODE: {{ keel_compose_file }} does not exist yet, so the
      loopback-only ingress rule cannot be evaluated. It is enforced before the
      stack starts on the next ordinary run, and again on every run thereafter.
  when:
    - ansible_check_mode
    - not (keel_compose_installed.stat.exists | default(false))

- name: Pull the pinned dependency images
  # Only the upstream dependencies; the two Keel images are local builds and have
  # no registry to pull from, so `--ignore-pull-failures` would hide a real
  # problem. Naming the services instead is explicit about which are external.
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ keel_env_file }} -f {{ keel_compose_file }}
      pull postgres nats temporal minio minio-bucket
    chdir: "{{ keel_root }}"
  register: keel_pull
  changed_when: "'Pulled' in (keel_pull.stderr | default('')) or 'Downloaded' in (keel_pull.stderr | default(''))"
  when: not ansible_check_mode

- name: Start the stack
  # `up -d` runs `migrate` to completion first: the gateway declares
  # `service_completed_successfully` on it, so a failed migration stops the
  # deploy here rather than leaving a gateway serving a half-migrated schema.
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ keel_env_file }} -f {{ keel_compose_file }}
      up -d --remove-orphans --wait --wait-timeout {{ keel_health_retries * keel_health_delay_seconds }}
    chdir: "{{ keel_root }}"
  register: keel_up
  changed_when: true
  # Nothing to start in check mode, and the images do not exist there either.
  when: not ansible_check_mode

- name: Report the migration result
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ keel_env_file }} -f {{ keel_compose_file }}
      logs --no-color --tail 40 migrate
    chdir: "{{ keel_root }}"
  register: keel_migrate_logs
  changed_when: false
  # Post-deployment verification. In check mode nothing was started, so there is
  # no migrate container to read — and a `docker compose logs` against an absent
  # project would fail on its own predicted state.
  when: not ansible_check_mode

- name: Show the migration output
  ansible.builtin.debug:
    var: keel_migrate_logs.stdout_lines
  when: not ansible_check_mode

- name: Confirm the migration exited cleanly
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      docker inspect --format '{{ '{{' }}.State.ExitCode{{ '}}' }}' keel-lab-migrate
    executable: /bin/bash
  register: keel_migrate_exit
  changed_when: false
  when: not ansible_check_mode

- name: Fail on a non-zero migration exit
  # STRICT IN NORMAL MODE, unchanged: the deployment is not complete unless the
  # one-shot migration exited 0. `| default('')` protects only the check-mode
  # path where this task is skipped entirely.
  ansible.builtin.assert:
    that:
      - (keel_migrate_exit.stdout | default('') | trim | int) == 0
    fail_msg: >-
      The one-shot migration exited
      {{ keel_migrate_exit.stdout | default('(unknown)') | trim }}. The stack is
      up but the schema is not what this commit expects; do not treat this
      deployment as complete.
    success_msg: Migration completed successfully.
  when: not ansible_check_mode

- name: Note that the stack was not started
  ansible.builtin.debug:
    msg: >-
      CHECK MODE: no image was built and no container was started, so the
      migration result and container health are not verified here. Both are
      enforced strictly on the next ordinary run, and the run fails there if the
      migration exits non-zero.
  when: ansible_check_mode
