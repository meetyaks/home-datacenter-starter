---
# ─────────────────────────────────────────────────────────────────────────────
# RELEASE MODE — deploy an immutable, attested artifact instead of building one.
#
# ═══ WHAT THIS CHANGES, AND WHAT IT DELIBERATELY DOES NOT ════════════════════
#
# Ordinarily this role deploys `keel_commit` by transferring that commit's tree
# and BUILDING the images on the host. That is right for a lab a person drives
# by hand, and wrong for an environment that must be able to say exactly which
# artifact it is running: a host build leaves no digest, no provenance and no
# record of what was validated.
#
# In release mode a `keel.release/v1` manifest decides the commit and the image
# digests, and `build.yml` is skipped. EVERYTHING ELSE IS UNCHANGED — the same
# preflight, the same source transfer, the same deploy, the same verify. This
# is the existing deployer accepting a prebuilt artifact, not a second deployer.
#
# ⚠️ THE SOURCE TRANSFER STILL HAPPENS, AND THAT IS NOT REDUNDANT. The compose
# bundle and pg_hba.conf are part of the stack definition and are NOT inside the
# image; the role reads them from the commit's tree. Release mode pins that tree
# to the release's own `gitSha`, so the bundle and the images come from one
# commit rather than from whatever the control node had checked out.
#
# ═══ THE SITE READS THE CONTRACT WITH ITS OWN READER ═════════════════════════
#
# These assertions restate `scripts/release/manifest.mjs` from the Keel
# repository in Ansible. That duplication is deliberate and is the reason the
# producing side keeps that module dependency-free: a contract only one side can
# check is not a contract. If the two readers ever disagree the release is
# refused here, which is the safe direction.
# ─────────────────────────────────────────────────────────────────────────────

- name: Read the release manifest from the controller
  # ⚠️ ON THE CONTROLLER, NOT THE HOST. The manifest is the instruction; it is
  # fetched, verified and decided on the administration side, and the managed
  # host is never asked what it should be running. A host that could answer that
  # question could also answer it wrongly.
  ansible.builtin.slurp:
    src: "{{ keel_release_manifest_file }}"
  delegate_to: localhost
  become: false
  register: keel_release_raw

- name: Parse it
  ansible.builtin.set_fact:
    keel_release: "{{ keel_release_raw.content | b64decode | from_json }}"

# ── SCHEMA ──────────────────────────────────────────────────────────────────

- name: The manifest declares a schema version this controller understands
  ansible.builtin.assert:
    that:
      - keel_release.schemaVersion is defined
      - keel_release.schemaVersion == keel_release_schema_version
    fail_msg: >-
      Release manifest declares schemaVersion
      "{{ keel_release.schemaVersion | default('(absent)') }}", and this
      controller implements {{ keel_release_schema_version }}. REFUSING rather
      than best-effort parsing it: a field this reader does not know about is
      exactly where a security-relevant instruction would be.
    success_msg: "Release manifest schema {{ keel_release_schema_version }}."

- name: Every field this deployment depends on is present and well formed
  ansible.builtin.assert:
    that:
      - keel_release.releaseId is defined
      - keel_release.releaseId | length > 0
      - keel_release.gitSha is defined
      - keel_release.gitSha is match('^[0-9a-f]{40}$')
      - keel_release.createdAt is defined
      - keel_release.images is defined
      - keel_release.images | length > 0
      - keel_release.bundle is defined
      - keel_release.bundle.composePath is defined
      - keel_release.bundle.sha256 is match('^[0-9a-f]{64}$')
      - keel_release.migrations is defined
      - keel_release.migrations.headId is defined
      - keel_release.migrations.requiresManualRecoveryOnFailure is defined
      - keel_release.minimumControllerVersion is defined
      - keel_release.platformVersion is match('^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$')
      - keel_release.provenance is defined
      - keel_release.provenance.repository is defined
    fail_msg: >-
      Release {{ keel_release.releaseId | default('(unnamed)') }} is missing or
      malforming a required field. This reader implements the same shape as
      scripts/release/manifest.mjs in the Keel repository.
    success_msg: "Release {{ keel_release.releaseId }} is well formed."

- name: The release id names its own commit
  # The id is what appears in logs, records and operator conversation. If it
  # could name a different commit than `gitSha`, every one of those would be
  # quietly wrong — and the id is the part a human reads.
  ansible.builtin.assert:
    that:
      - keel_release.gitSha.startswith(keel_release.releaseId[-12:])
    fail_msg: >-
      Release id {{ keel_release.releaseId }} ends in
      "{{ keel_release.releaseId[-12:] }}" but the commit is
      {{ keel_release.gitSha }}. The id must embed the commit it deploys.
    success_msg: "{{ keel_release.releaseId }} names commit {{ keel_release.gitSha }}."

- name: This controller is new enough for the release
  # A site older than the release must REFUSE, not guess. A field added by a
  # newer producer is one this reader would silently ignore.
  ansible.builtin.assert:
    that:
      - keel_controller_version is version(keel_release.minimumControllerVersion, '>=')
    fail_msg: >-
      Release {{ keel_release.releaseId }} requires controller
      >= {{ keel_release.minimumControllerVersion }} and this one is
      {{ keel_controller_version }}. Upgrade the deployment repository on the
      administration console before deploying this release.
    success_msg: >-
      Controller {{ keel_controller_version }} satisfies
      >= {{ keel_release.minimumControllerVersion }}.

# ── DIGEST-ONLY IMAGES ──────────────────────────────────────────────────────

- name: Every image is identified by an immutable digest and nothing else
  # ⚠️ THE WHOLE POINT OF THE MECHANISM. A tag is a mutable pointer: the same
  # `:sha-abc123` can be repushed to mean a different image, and a site that
  # deployed the tag would never know. A digest cannot be repointed.
  #
  # A registry PORT is not a tag — `registry.dc1.lan:5000/keel` is a bare
  # repository — so the check is "a colon after the last slash, whose suffix is
  # not all digits", exactly as the producing reader has it.
  ansible.builtin.assert:
    that:
      - item.role is defined
      - item.repository is defined
      - '"@" not in item.repository'
      - (item.repository | regex_search(':[^/]*$')) == None
        or (item.repository | regex_search(':[0-9]+$')) != None
      - item.digest is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      Image "{{ item.role | default('(no role)') }}" is not digest-pinned:
      repository={{ item.repository | default('(absent)') }}
      digest={{ item.digest | default('(absent)') }}. Images are identified by
      digest only — a tag, or a digest smuggled into the repository field, is
      refused.
    success_msg: "{{ item.role }} → {{ item.repository }}@{{ item.digest }}"
  loop: "{{ keel_release.images }}"
  loop_control:
    label: "{{ item.role | default('(no role)') }}"

- name: No two images claim the same role
  ansible.builtin.assert:
    that:
      - (keel_release.images | map(attribute='role') | list | unique | length)
        == (keel_release.images | length)
    fail_msg: >-
      The release names the same role twice:
      {{ keel_release.images | map(attribute='role') | list }}. Which digest
      wins would then depend on iteration order.
    success_msg: "Each image role appears once."

- name: The release names every image this deployment's bundle resolves
  # ⚠️ THE SITE KNOWS ITS OWN BUNDLE, SO THE SITE IS WHERE THIS IS CHECKED.
  # compose.lab.yml resolves exactly `${KEEL_IMAGE}` and `${KEEL_WEB_IMAGE}`. A
  # release naming only one of them would leave the other to be built here —
  # the unrecorded host artifact release mode exists to remove — and compose
  # would fail late, after the stack had already been stopped.
  ansible.builtin.assert:
    that:
      - keel_release_required_roles | difference(keel_release.images | map(attribute='role') | list) | length == 0
    fail_msg: >-
      Release {{ keel_release.releaseId }} names
      {{ keel_release.images | map(attribute='role') | list }}, but this
      deployment's compose bundle resolves {{ keel_release_required_roles }}.
      Missing:
      {{ keel_release_required_roles | difference(keel_release.images | map(attribute='role') | list) }}.
    success_msg: "The release covers every image the bundle resolves."

# ── PROVENANCE: WHAT THE RELEASE CLAIMS, AND WHAT THIS SITE ACCEPTS ─────────
#
# Two separate questions, deliberately kept separate:
#
#   1. does the release make a COHERENT, COMPLETE provenance statement?
#      (asked of every release, under every policy)
#   2. is that statement one THIS ENVIRONMENT is willing to deploy?
#      (asked of the policy)
#
# Conflating them is how "we could not attest it" quietly became "we did not
# check". Below, a malformed statement is refused for everybody, and a
# well-formed `unavailable` is refused by everybody except an environment that
# has explicitly opted in.

- name: The provenance policy is one this role understands
  # ⚠️ FAIL CLOSED ON ANYTHING ELSE, INCLUDING EMPTY. A typo
  # (`allow-unavailable`, `Allow_Unavailable`, `yes`) must not fall through to
  # the permissive branch, and an unset value must not fall through to
  # anything at all.
  ansible.builtin.assert:
    that:
      - keel_release_provenance_policy is defined
      - keel_release_provenance_policy in keel_release_provenance_policies
    fail_msg: >-
      keel_release_provenance_policy is
      "{{ keel_release_provenance_policy | default('(unset)') }}", which this
      controller does not understand. It must be exactly one of
      {{ keel_release_provenance_policies | join(' | ') }}. It is not
      defaulted at the point of use: accepting a release without persisted
      provenance is a decision an environment makes on purpose.
    success_msg: "Provenance policy: {{ keel_release_provenance_policy }}."

- name: The retired boolean cannot bypass the policy
  # ⚠️ IT IS GONE, NOT DEPRECATED. If an old inventory, group_vars file or
  # `-e` still carries `keel_release_require_provenance`, that operator
  # believes they are controlling verification and they are not. Refusing is
  # the only honest response — silently ignoring it would leave somebody
  # convinced they had disabled or enabled something.
  ansible.builtin.assert:
    that:
      - keel_release_require_provenance is not defined
    fail_msg: >-
      keel_release_require_provenance is set, and it no longer does anything.
      It was replaced by keel_release_provenance_policy
      ({{ keel_release_provenance_policies | join(' | ') }}) because a boolean
      could not distinguish "this release cannot be attested" from "do not
      check". Remove it and state the policy instead — leaving it would mean
      believing you had configured something you had not.
    success_msg: "The retired boolean is absent; the policy is the only authority."

- name: The release makes a complete provenance statement
  # Required of EVERY release regardless of policy. A document that omits any
  # of these is not "probably fine" — it is one a site cannot reason about.
  ansible.builtin.assert:
    that:
      - keel_release.provenance.repository is defined
      - keel_release.provenance.repository | length > 0
      - keel_release.provenance.workflowRef is defined
      - keel_release.provenance.workflowRef | length > 0
      - keel_release.provenance.runId is defined
      - (keel_release.provenance.runId | string) | length > 0
      - keel_release.provenance.mechanism is defined
      - keel_release.provenance.attestation is defined
      - keel_release.provenance.attestation.status is defined
      - keel_release.provenance.sbom is defined
      - keel_release.provenance.sbom.format is defined
      - keel_release.provenance.sbom.format | length > 0
      - keel_release.provenance.sbom.sha256 is defined
      - keel_release.provenance.sbom.sha256 is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Release {{ keel_release.releaseId }} does not make a complete provenance
      statement. Required: provenance.repository, .workflowRef, .runId,
      .mechanism, .attestation.status, .sbom.format and a 64-hex
      .sbom.sha256. Got attestation=
      {{ keel_release.provenance.attestation | default('(absent)') }}, sbom=
      {{ keel_release.provenance.sbom | default('(absent)') }}.
    # ⚠️ NO DEREFERENCING HERE EITHER. Ansible templates success_msg even when
    # the assertion fails, so naming `.sbom.format` would turn "the SBOM is
    # missing" into "object has no attribute 'sbom'" and hide the real reason.
    # The SBOM identity is printed by the summary task at the end instead.
    success_msg: "Provenance statement complete."

- name: The attestation status is one the contract defines
  ansible.builtin.assert:
    that:
      - keel_release.provenance.attestation.status in ['persisted', 'unavailable']
    fail_msg: >-
      provenance.attestation.status is
      "{{ keel_release.provenance.attestation.status }}", which keel.release/v1
      does not define. REFUSING rather than guessing which way an unknown
      status should be read.
    success_msg: "Attestation status: {{ keel_release.provenance.attestation.status }}."

- name: The mechanism agrees with the status
  # ⚠️ THE FORGERY THIS STOPS. Without it, `status: unavailable` beside
  # `mechanism: github-artifact-attestation` is a document that looks signed
  # to whichever field a reader happens to trust. The producer enforces the
  # same pairing; the site does not take that on faith.
  ansible.builtin.assert:
    that:
      - keel_release.provenance.mechanism ==
        ('github-artifact-attestation' if keel_release.provenance.attestation.status == 'persisted' else 'none')
    fail_msg: >-
      provenance.mechanism is "{{ keel_release.provenance.mechanism }}" but
      the status is "{{ keel_release.provenance.attestation.status }}", which
      requires
      "{{ 'github-artifact-attestation' if keel_release.provenance.attestation.status == 'persisted' else 'none' }}".
      A release whose two provenance fields contradict each other is refused.
    success_msg: "Mechanism agrees with the status."

- name: An unattestable release says why
  ansible.builtin.assert:
    that:
      - keel_release.provenance.attestation.reason is defined
      - (keel_release.provenance.attestation.reason | trim) | length > 0
    fail_msg: >-
      {{ keel_release.releaseId }} declares attestation status "unavailable"
      with no reason. An operator accepting reduced assurance must be told
      what was unavailable and why; "not attested, no explanation" is not a
      statement a site will act on.
    # ⚠️ THE SUCCESS MESSAGE MUST NOT DEREFERENCE `.reason`. Ansible templates
    # success_msg even when the assertion FAILS, so reading a field that is
    # missing — which is exactly the case being tested — raises a template
    # error that replaces the real explanation with "object has no attribute".
    success_msg: "Reason recorded for the unavailable attestation."
  when: keel_release.provenance.attestation.status == 'unavailable'

- name: THIS ENVIRONMENT REFUSES A RELEASE WITHOUT PERSISTED PROVENANCE
  # ⚠️ BEFORE ANY MUTATION. Nothing has been pulled, written or stopped at
  # this point — the images are not fetched until release-bundle.yml and the
  # stack is not touched until deploy.yml. Refusing here costs nothing and
  # leaves the running site exactly as it was.
  ansible.builtin.fail:
    msg: >-
      REFUSING {{ keel_release.releaseId }}: its provenance is
      "unavailable" ({{ keel_release.provenance.attestation.reason }}) and this
      environment's policy is `require_persisted`. An environment that may
      deploy an unattested release must say so explicitly with
      `keel_release_provenance_policy: allow_unavailable` — which the DEV
      inventory does and no other inventory may.
  when:
    - keel_release.provenance.attestation.status == 'unavailable'
    - keel_release_provenance_policy != 'allow_unavailable'

# ── PERSISTED: VERIFY IT, AND A FAILURE IS A REFUSAL ────────────────────────

- name: Verify each image was built by the expected workflow
  # ⚠️ SHAPE CANNOT DETECT SUBSTITUTION. Every assertion above passes just as
  # happily on a manifest someone edited to point at their own image: it is
  # still schema-valid, still digest-pinned, still internally consistent. Only
  # an attestation ties these bytes to a build that actually happened in the
  # expected repository and workflow.
  #
  # Run for a `persisted` release under EITHER policy — `allow_unavailable`
  # widens what is accepted, it does not weaken what is checked.
  ansible.builtin.command:
    argv:
      - gh
      - attestation
      - verify
      - "oci://{{ item.repository }}@{{ item.digest }}"
      - --repo
      - "{{ keel_release.provenance.repository }}"
  delegate_to: localhost
  become: false
  changed_when: false
  loop: "{{ keel_release.images }}"
  loop_control:
    label: "{{ item.role }}"
  when: keel_release.provenance.attestation.status == 'persisted'

- name: Verify the manifest bytes themselves
  # The manifest is a signed subject in its own right. Verifying only the
  # images would leave the document that CHOOSES them unverified — and that
  # document also carries the bundle hash and the migration recovery flag.
  ansible.builtin.command:
    argv:
      - gh
      - attestation
      - verify
      - "{{ keel_release_manifest_file }}"
      - --repo
      - "{{ keel_release.provenance.repository }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when: keel_release.provenance.attestation.status == 'persisted'

# ── UNAVAILABLE: ACCEPTED, AND SAID OUT LOUD ────────────────────────────────

- name: Announce that DEV is deploying a release without persisted provenance
  # ⚠️ LOUD, AND NEVER THE WORD "VERIFIED". This is the one place the operator
  # learns that the thing about to run carries no signature. It is permitted,
  # it is recorded, and it is not dressed up.
  ansible.builtin.debug:
    msg:
      - "⚠️ NOT ATTESTED — explicitly permitted by DEV policy"
      - "release   {{ keel_release.releaseId }}"
      - "reason    {{ keel_release.provenance.attestation.reason }}"
      - "assurance immutable digests + SBOM identity only; nothing signed ties
         these bytes to {{ keel_release.provenance.repository }}"
      - "sbom      {{ keel_release.provenance.sbom.format }}
         sha256:{{ keel_release.provenance.sbom.sha256 }}"
      - "policy    keel_release_provenance_policy=allow_unavailable
         (inventory/group_vars/keel_dev/)"
  when: keel_release.provenance.attestation.status == 'unavailable'

- name: Carry the provenance state forward for the records
  # Read by keel_reconcile when it writes the attempt record, current.json and
  # failure evidence, so "what assurance did this deployment have" is answerable
  # from the host afterwards rather than only from a workflow log that expires.
  ansible.builtin.set_fact:
    keel_release_attestation_status: "{{ keel_release.provenance.attestation.status }}"
    keel_release_attestation_mechanism: "{{ keel_release.provenance.mechanism }}"
    keel_release_attestation_reason: "{{ keel_release.provenance.attestation.reason | default('') }}"
    keel_release_sbom: "{{ keel_release.provenance.sbom }}"
    keel_release_assurance: >-
      {{ 'attested (' ~ keel_release.provenance.mechanism ~ ')'
         if keel_release.provenance.attestation.status == 'persisted'
         else 'NOT ATTESTED — explicitly permitted by DEV policy' }}

# ── ADOPT THE RELEASE'S IDENTITY ────────────────────────────────────────────

- name: Deploy the release's commit and its exact images
  # `keel_commit_short`, `keel_image_tag` and `keel_build_dir` are Jinja
  # expressions over `keel_commit` in defaults, so they re-derive from this.
  # `keel_gateway_image`/`keel_web_image` are overridden outright: in release
  # mode they are digest references, not locally built tags.
  ansible.builtin.set_fact:
    keel_commit: "{{ keel_release.gitSha }}"
    keel_gateway_image: >-
      {{ (keel_release.images | selectattr('role', 'eq', 'gateway') | first).repository }}@{{
         (keel_release.images | selectattr('role', 'eq', 'gateway') | first).digest }}
    keel_web_image: >-
      {{ (keel_release.images | selectattr('role', 'eq', 'web') | first).repository }}@{{
         (keel_release.images | selectattr('role', 'eq', 'web') | first).digest }}

- name: Say what is being deployed, and from where
  ansible.builtin.debug:
    msg:
      - "release       {{ keel_release.releaseId }}"
      - "commit        {{ keel_commit }}"
      - "platform      {{ keel_release.platformVersion }}"
      - "gateway       {{ keel_gateway_image }}"
      - "web           {{ keel_web_image }}"
      - "bundle        {{ keel_release.bundle.composePath }} sha256:{{ keel_release.bundle.sha256 }}"
      - "migrations    head {{ keel_release.migrations.headId }}, manual recovery on failure:
         {{ keel_release.migrations.requiresManualRecoveryOnFailure }}"
      - "provenance    {{ ('verified against ' ~ keel_release.provenance.repository)
                          if keel_release_attestation_status == 'persisted'
                          else '⚠️ NOT ATTESTED — explicitly permitted by DEV policy' }}"
      - "sbom          {{ keel_release_sbom.format }} sha256:{{ keel_release_sbom.sha256 }}"
      - "policy        {{ keel_release_provenance_policy }}"
