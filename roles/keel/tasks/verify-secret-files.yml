---
# ─────────────────────────────────────────────────────────────────────────────
# VERIFY SECRET FILE PERMISSIONS — the single implementation.
#
# Included by `secrets.yml` after it writes, and by `tests/secret-verification.yml`
# against fixtures. One copy, two callers: a regression test that re-implemented
# this logic would pass while the role stayed broken, which is the failure mode
# this file exists to prevent a second time.
#
# Caller supplies `keel_verify_paths` (a list of absolute paths).
#
# ═══ WHY THE EXISTENCE CHECK AND THE PERMISSION CHECK ARE SEPARATE TASKS ══════
#
# They answer different questions and have different check-mode semantics, and
# fusing them is what broke:
#
#   PERMISSIONS  asked of a file that EXISTS, in every mode. An existing file
#                with unsafe permissions is a live exposure — check mode must
#                fail on it, because "I was only looking" does not make a
#                world-readable private key safe.
#   EXISTENCE    asked in NORMAL mode only. In check mode the template tasks
#                above deliberately wrote nothing, so an absent file is the
#                CORRECT predicted state, not a fault.
#
# The original single assertion dereferenced `item.stat.mode` unconditionally.
# On a clean host in check mode the file does not exist, that attribute is
# absent, and Ansible crashed rendering `fail_msg` during argument
# finalization — before the assertion could even be evaluated. Every reference
# below therefore passes through `| default(...)`, so a missing attribute can
# produce a message but can never produce a crash.
# ─────────────────────────────────────────────────────────────────────────────

- name: Inspect the secret files
  ansible.builtin.stat:
    path: "{{ item }}"
  register: keel_secret_stat
  loop: "{{ keel_verify_paths }}"
  # `check_mode: false` so the INSPECTION itself always runs. Without it check
  # mode would skip the stat, `keel_secret_stat.results` would carry no usable
  # facts, and an existing unsafe file would go unexamined — which is the one
  # case check mode most needs to catch.
  check_mode: false

- name: Refuse an existing secret file that is readable beyond its owner
  ansible.builtin.assert:
    that:
      - (item.stat.mode | default('')) == '0600'
      - (item.stat.pw_name | default('')) == keel_owner
    fail_msg: >-
      {{ item.item }} is mode {{ item.stat.mode | default('(unreadable)') }}
      owned by {{ item.stat.pw_name | default('(unknown)') }}; expected 0600
      owned by {{ keel_owner }}. A credential readable by another account on this
      host is a credential that has already leaked — this fails in check mode
      too, because the exposure is real whether or not anything is being changed.
    quiet: true
  loop: "{{ keel_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists | default(false)

- name: Require the secret file to exist
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
    fail_msg: >-
      {{ item.item }} does not exist after the render tasks ran. The stack would
      start on a missing credential, so this run stops here.
    quiet: true
  loop: "{{ keel_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  # NORMAL MODE ONLY. In check mode nothing was written, so absence is the
  # predicted state and failing on it would make `--check` unusable on a clean
  # host. Normal mode keeps the requirement in full.
  when:
    - not ansible_check_mode
    - not (item.stat.exists | default(false))

- name: Note that permission verification is deferred for files not yet created
  ansible.builtin.debug:
    msg: >-
      CHECK MODE: {{ item.item }} does not exist yet. It would be created 0600
      {{ keel_owner }}:{{ keel_group }} by this play, and its mode and ownership
      are verified for real on the next ordinary (non-check) run. Nothing is
      asserted about it now because there is nothing on disk to assert about.
  loop: "{{ keel_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - ansible_check_mode
    - not (item.stat.exists | default(false))
