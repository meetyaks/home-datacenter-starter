---
# ─────────────────────────────────────────────────────────────────────────────
# VERIFY SECRET FILE PERMISSIONS — the single implementation.
#
# Included by `secrets.yml` after it writes, and by `tests/secret-verification.yml`
# against fixtures. One copy, two callers: a regression test that re-implemented
# this logic would pass while the role stayed broken, which is the failure mode
# this file exists to prevent a second time.
#
# Caller supplies:
#   keel_verify_paths   list of absolute paths
#   keel_verify_mode    the exact octal mode required, e.g. "0600" or "0440"
#   keel_verify_owner   required owning user
#   keel_verify_group   required owning group
#   keel_verify_label   short description, used in messages
#
# ═══ WHY THE EXPECTATION IS A PARAMETER ══════════════════════════════════════
#
# It used to be hard-coded to 0600 root:root for every path. That was not merely
# inflexible — it actively endorsed the defect that broke the first native
# startup. The JWT PEMs must be group-readable by the container's runtime GID,
# because uid 10001 cannot read a root-only file through a bind mount, while the
# environment file must stay root-only because compose reads it host-side. One
# expectation cannot describe both, and the single hard-coded one agreed with
# the broken provisioning instead of catching it.
#
# ═══ WHY EXISTENCE AND PERMISSIONS ARE SEPARATE TASKS ════════════════════════
#
# They answer different questions and have different check-mode semantics:
#
#   PERMISSIONS  asked of a file that EXISTS, in every mode. An existing file
#                with unsafe permissions is a live exposure — check mode must
#                fail on it, because "I was only looking" does not make a
#                world-readable private key safe.
#   EXISTENCE    asked in NORMAL mode only. In check mode the write tasks
#                deliberately wrote nothing, so an absent file is the CORRECT
#                predicted state, not a fault.
#
# An earlier single assertion dereferenced `item.stat.mode` unconditionally. On
# a clean host in check mode the file does not exist, that attribute is absent,
# and Ansible crashed rendering `fail_msg` during argument finalization — before
# the assertion could even be evaluated. Every reference below therefore passes
# through `| default(...)`, so a missing attribute can produce a message but
# never a crash.
# ─────────────────────────────────────────────────────────────────────────────

- name: Inspect the secret files
  ansible.builtin.stat:
    path: "{{ item }}"
  register: keel_secret_stat
  loop: "{{ keel_verify_paths }}"
  # `check_mode: false` so the INSPECTION itself always runs. Without it check
  # mode would skip the stat, `keel_secret_stat.results` would carry no usable
  # facts, and an existing unsafe file would go unexamined — which is the one
  # case check mode most needs to catch.
  check_mode: false

- name: Refuse any secret reachable beyond its intended owner and group
  # ⚠️ EVERY MODE, INCLUDING --check. This is the EXPOSURE check, and an exposure
  # is real whether or not this run is changing anything — "I was only looking"
  # does not make a world-readable private key safe.
  #
  # Two conditions, and neither can be satisfied by loosening `keel_verify_mode`:
  #
  #   other bits   must be zero, full stop. Whatever mode was asked for, a secret
  #                every account on the host can read is a leak.
  #   group bits   may be non-zero ONLY for the group this file is meant to be
  #                readable by. `0640 root:somebody-else` is a real exposure to
  #                that group, and an exact-mode check alone would not tell it
  #                apart from the intended `0440`.
  ansible.builtin.assert:
    that:
      - ((item.stat.mode | default('0000'))[-1] | int) == 0
      - >-
        ((item.stat.mode | default('0000'))[-2] | int) == 0
        or (item.stat.gr_name | default('')) == keel_verify_group
    fail_msg: >-
      {{ item.item }} is mode {{ item.stat.mode | default('(unreadable)') }}
      {{ item.stat.pw_name | default('?') }}:{{ item.stat.gr_name | default('?') }}
      — it is reachable beyond {{ keel_verify_owner }} and
      {{ keel_verify_group }}. Treat this credential as disclosed and rotate it:
      re-running this play corrects the mode but cannot un-read it.
    quiet: true
  loop: "{{ keel_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists | default(false)

- name: Require an existing secret file to have exactly the intended ownership
  # NORMAL MODE ONLY — a deliberate split from the exposure check above, not a
  # softening of it.
  #
  # This assertion also fires on a file that is too NARROW, or merely not yet
  # converged: `0600 root:root` PEMs, say, on a host that has not had this fix
  # applied. That is not an exposure — it is precisely the state this play
  # EXISTS to correct, and a `--check` run that collapses on it cannot go on to
  # tell the operator what else is wrong. In check mode the divergence is
  # reported below instead; the next ordinary run both fixes it and asserts it.
  ansible.builtin.assert:
    that:
      - (item.stat.mode | default('')) == keel_verify_mode
      - (item.stat.pw_name | default('')) == keel_verify_owner
      - (item.stat.gr_name | default('')) == keel_verify_group
    fail_msg: >-
      {{ item.item }} ({{ keel_verify_label }}) is mode
      {{ item.stat.mode | default('(unreadable)') }}
      {{ item.stat.pw_name | default('?') }}:{{ item.stat.gr_name | default('?') }};
      expected {{ keel_verify_mode }} {{ keel_verify_owner }}:{{ keel_verify_group }}.
      Too narrow and the container cannot read it — that is the crash loop this
      provisioning exists to prevent. Too wide and the credential has leaked.
    quiet: true
  loop: "{{ keel_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.stat.exists | default(false)

- name: Report an existing secret file this run would correct
  ansible.builtin.debug:
    msg: >-
      CHECK MODE: {{ item.item }} ({{ keel_verify_label }}) is
      {{ item.stat.mode | default('?') }}
      {{ item.stat.pw_name | default('?') }}:{{ item.stat.gr_name | default('?') }}
      and would be corrected to {{ keel_verify_mode }}
      {{ keel_verify_owner }}:{{ keel_verify_group }} by an ordinary run. It is
      not reachable beyond its owner and group as it stands, so this is a
      pending change rather than an exposure.
  loop: "{{ keel_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - ansible_check_mode
    - item.stat.exists | default(false)
    - (item.stat.mode | default('')) != keel_verify_mode
      or (item.stat.pw_name | default('')) != keel_verify_owner
      or (item.stat.gr_name | default('')) != keel_verify_group

- name: Require the secret file to exist
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
    fail_msg: >-
      {{ item.item }} does not exist after the render tasks ran. The stack would
      start on a missing credential, so this run stops here.
    quiet: true
  loop: "{{ keel_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  # NORMAL MODE ONLY. In check mode nothing was written, so absence is the
  # predicted state and failing on it would make `--check` unusable on a clean
  # host. Normal mode keeps the requirement in full.
  when:
    - not ansible_check_mode
    - not (item.stat.exists | default(false))

- name: Note that permission verification is deferred for files not yet created
  ansible.builtin.debug:
    msg: >-
      CHECK MODE: {{ item.item }} does not exist yet. It would be created
      {{ keel_verify_mode }} {{ keel_verify_owner }}:{{ keel_verify_group }}
      ({{ keel_verify_label }}) by this play, and its mode and ownership are
      verified for real on the next ordinary run. Nothing is asserted about it
      now because there is nothing on disk to assert about.
  loop: "{{ keel_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - ansible_check_mode
    - not (item.stat.exists | default(false))
