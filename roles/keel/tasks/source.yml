---
# ─────────────────────────────────────────────────────────────────────────────
# Source transfer — reproducible by construction.
#
# `git archive <sha>` on the control node emits the COMMIT'S TREE and nothing
# else: no .git, no node_modules, no working-tree edits, no build output, no
# untracked secrets. That is stronger than an rsync with exclude patterns, where
# a forgotten pattern silently ships whatever happens to be lying around — and it
# is what makes "the thing built on the host" equal "the thing in the commit".
#
# The manifest then closes the loop at the far end: the host verifies the SHA it
# was told to deploy against the SHA the archive actually carries.
#
# ═══ CONTROLLER TASKS CARRY THEIR OWN IDENTITY, EVERY ONE OF THEM ═════════════
#
# `delegate_to` changes WHERE a task runs. It does not reset the connection
# variables the play resolved for the TARGET — so a play running as
# `ansible_user: labadmin` with `become: true` handed that identity to the
# controller, which tried `/Users/labadmin/.ansible/tmp`, found no such account,
# and declared the controller UNREACHABLE.
#
# So every delegated task below carries the same four lines: `become: false` and
# the three `ansible_*` overrides from defaults/main.yml. They are repeated
# rather than factored into a block, because a block would hide from the reader
# the one fact that matters here — that each of these runs somewhere else, as
# someone else. (enforced: tests/controller-delegation.yml)
# ─────────────────────────────────────────────────────────────────────────────

- name: Confirm the control node has the source repository
  ansible.builtin.stat:
    path: "{{ keel_source_repo }}/.git"
  register: keel_repo_stat
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_user: "{{ keel_controller_user }}"
    ansible_python_interpreter: "{{ keel_controller_python }}"
  # A read-only validation: it runs in check mode too, because "is the source
  # even here" is answerable without changing anything and is the first thing a
  # dry run should tell you.
  check_mode: false

- name: Fail when the source repository is absent
  ansible.builtin.assert:
    that:
      - keel_repo_stat.stat.exists | default(false)
    fail_msg: >-
      No git repository at {{ keel_source_repo }} on the control node
      (checked as {{ keel_controller_user }}). Set keel_source_repo to the Keel
      checkout, or clone it there first.

- name: Confirm the commit exists in that repository
  ansible.builtin.command:
    cmd: git cat-file -e {{ keel_commit }}^{commit}
    chdir: "{{ keel_source_repo }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_user: "{{ keel_controller_user }}"
    ansible_python_interpreter: "{{ keel_controller_python }}"
  changed_when: false
  check_mode: false
  register: keel_commit_check
  failed_when: keel_commit_check.rc != 0

- name: Check whether this build directory is already present and verified
  ansible.builtin.slurp:
    src: "{{ keel_build_dir }}/DEPLOYMENT_MANIFEST"
  register: keel_existing_manifest
  failed_when: false
  check_mode: false

- name: Record whether the source is already in place
  ansible.builtin.set_fact:
    keel_source_present: >-
      {{ (keel_existing_manifest.content is defined)
         and (keel_commit in (keel_existing_manifest.content | b64decode)) }}

- name: Create the archive from the exact commit
  ansible.builtin.command:
    cmd: >-
      git archive --format=tar.gz
      --prefix=keel-{{ keel_commit_short }}/
      -o {{ keel_controller_tmp_archive }}
      {{ keel_commit }}
    chdir: "{{ keel_source_repo }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_user: "{{ keel_controller_user }}"
    ansible_python_interpreter: "{{ keel_controller_python }}"
  changed_when: true
  when: not keel_source_present

- name: Create the build directory
  ansible.builtin.file:
    path: "{{ keel_build_dir }}"
    state: directory
    owner: "{{ keel_owner }}"
    group: "{{ keel_group }}"
    mode: "0755"
  when: not keel_source_present

- name: Transfer and unpack the archive
  ansible.builtin.unarchive:
    src: "{{ keel_controller_tmp_archive }}"
    dest: "{{ keel_build_dir }}"
    owner: "{{ keel_owner }}"
    group: "{{ keel_group }}"
    extra_opts: ['--strip-components=1']
  when: not keel_source_present

- name: Remove the local archive
  ansible.builtin.file:
    path: "{{ keel_controller_tmp_archive }}"
    state: absent
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_user: "{{ keel_controller_user }}"
    ansible_python_interpreter: "{{ keel_controller_python }}"
  when: not keel_source_present

# ── Verification of what actually landed ────────────────────────────────────
#
# In CHECK MODE on a fresh host the archive was never unpacked, so there is
# nothing to verify and the two checks below would fail on their own predicted
# state. They are skipped, with a note — and they stay fully strict in a real
# run, which is the only run where a wrong tree can be built.

- name: Verify the unpacked tree matches the requested commit
  ansible.builtin.slurp:
    src: "{{ keel_build_dir }}/DEPLOYMENT_MANIFEST"
  register: keel_manifest
  failed_when: false
  check_mode: false

- name: Fail when the manifest names a different commit
  ansible.builtin.assert:
    that:
      - keel_manifest.content is defined
      - keel_commit in (keel_manifest.content | default('') | b64decode)
    fail_msg: >-
      {{ keel_build_dir }}/DEPLOYMENT_MANIFEST does not name {{ keel_commit }}.
      Refusing to build: a build directory whose provenance cannot be proven is
      exactly the thing an immutable image tag is supposed to rule out.
    success_msg: "Build source verified at commit {{ keel_commit }}."
  when: not ansible_check_mode

- name: Confirm the stack definition arrived with the source
  ansible.builtin.stat:
    path: "{{ keel_build_dir }}/infra/lab/compose.lab.yml"
  register: keel_compose_stat
  check_mode: false

- name: Fail when the commit carries no lab stack
  ansible.builtin.assert:
    that:
      - keel_compose_stat.stat.exists | default(false)
    fail_msg: >-
      infra/lab/compose.lab.yml is missing from commit {{ keel_commit }}. This
      role deploys the stack the COMMIT defines; it does not carry its own copy,
      because two hand-maintained copies of one stack drift silently.
  when: not ansible_check_mode

- name: Note what check mode could not verify
  ansible.builtin.debug:
    msg: >-
      CHECK MODE: the archive for {{ keel_commit }} was not unpacked, so the
      deployment manifest and the presence of infra/lab/compose.lab.yml are not
      verified here. Both are checked strictly on the next ordinary run, before
      anything is built. The controller-side checks above DID run: the source
      repository exists and carries this commit.
  when:
    - ansible_check_mode
    - not keel_source_present
