---
# ─────────────────────────────────────────────────────────────────────────────
# Keel lab deployment — one host, one commit, images built natively on that host.
#
# ═══ TWO MODES, AND THEY ARE NOT THE SAME SHAPE ══════════════════════════════
#
#   --check   PREFLIGHT. Everything that can be established without changing
#             anything: the target's architecture, filesystem, Docker access and
#             secrets; and — from the controller's git objects — that the named
#             commit exists and actually carries every path this deployment
#             needs. Then it prints what a real run would do, and exits.
#
#             It creates no archive, transfers nothing, builds nothing, starts
#             nothing and touches no Caddy config. It also never REQUIRES any of
#             those to exist, because on a fresh host none of them can.
#
#   normal    The full deployment, with every postcondition strict: manifest
#             provenance, image identity, migration exit code, container health
#             and the baked pack catalogue in the running image.
#
# ⚠️ CHECK MODE IS A PREFLIGHT, NOT A SIMULATED DEPLOYMENT. An earlier version
# blurred that: the archive task reported `changed` under --check without
# executing, and the unpack that followed failed on a file that had never been
# created. A dry run must not invent work it has not done, and must not fail on
# the absence of work it correctly declined to do.
#
# Every mutating phase below is therefore guarded explicitly rather than relying
# on each module's own check-mode behaviour, which differs by module and is what
# made the earlier failure so easy to miss.
# ─────────────────────────────────────────────────────────────────────────────

- name: Verify the deployment candidate is a full commit SHA
  ansible.builtin.assert:
    that:
      - keel_commit is match('^[0-9a-f]{40}$')
    fail_msg: >-
      keel_commit must be the full 40-character SHA, not a branch, tag or
      abbreviation. The image tag, build directory and manifest all derive from
      it, and an abbreviation can become ambiguous as the repository grows.
    success_msg: "Deploying Keel commit {{ keel_commit }}"

- name: Prove the group_vars directory for this host is actually loaded
  # ⚠️ ASKED FIRST, AND ASKED SEPARATELY FROM THE SECRETS, because the two
  # failures look identical from the outside and have completely different fixes.
  #
  # An undefined `keel_vault_*` can mean "you forgot to write the vault file" or
  # it can mean "Ansible never loaded the file you did write" — and the second
  # is what happened when the vault lived at `group_vars/vault.yml`, which binds
  # to a group named `vault` that does not exist. `--ask-vault-pass` decrypted it
  # happily and the variables were still undefined.
  #
  # This canary is a committed, non-secret file sitting in the same directory as
  # the encrypted vault. If it is visible, that directory is being loaded for
  # this host, so a missing secret below is genuinely a missing secret.
  ansible.builtin.assert:
    that:
      - keel_group_vars_source is defined
      - keel_group_vars_source == 'inventory/group_vars/linux_servers'
    fail_msg: >-
      inventory/group_vars/linux_servers/ is not being loaded for
      {{ inventory_hostname }}. Variables placed there — including the encrypted
      vault file — are invisible to this play, so nothing below can work.
      Confirm {{ inventory_hostname }} is in the `linux_servers` group in
      inventory/hosts.yml, and that the directory name matches that group
      exactly. `--ask-vault-pass` succeeding proves only that a file DECRYPTED,
      never that it was LOADED.
    success_msg: >-
      group_vars/linux_servers is loaded for {{ inventory_hostname }}.
    quiet: true

- name: Require every secret to be present before anything is written
  ansible.builtin.assert:
    that:
      - keel_vault_admin_db_password is defined and keel_vault_admin_db_password | length > 0
      - keel_vault_app_db_password is defined and keel_vault_app_db_password | length > 0
      - keel_vault_blob_access_key is defined and keel_vault_blob_access_key | length > 0
      - keel_vault_blob_secret_key is defined and keel_vault_blob_secret_key | length > 0
      - keel_vault_oidc_client_secret is defined and keel_vault_oidc_client_secret | length > 0
      - keel_vault_master_key is defined and keel_vault_master_key | length > 0
      - keel_vault_mfa_master_key is defined and keel_vault_mfa_master_key | length > 0
      - keel_vault_jwt_private_key is defined and keel_vault_jwt_private_key | length > 0
      - keel_vault_jwt_public_key is defined and keel_vault_jwt_public_key | length > 0
      # Not a credential, but required in exactly the same way and for a harder
      # reason: it is PERMANENT installation identity. There is no default for it
      # anywhere, so an absent value must stop the run here rather than let the
      # stack start having invented its own.
      - keel_vault_default_tenant_id is defined and keel_vault_default_tenant_id | length > 0
    fail_msg: >-
      One or more keel_vault_* variables are missing. The canary above passed, so
      inventory/group_vars/linux_servers/ IS being loaded — this is a genuinely
      absent or misnamed variable, not a loading problem. Create
      inventory/group_vars/linux_servers/vault.yml with ansible-vault and define
      every name listed in roles/keel/README.md. Nothing is written until all are
      present — a half-rendered environment file would start a stack on a blank
      credential.
    success_msg: All required secrets are present.
    quiet: true

# ── PREFLIGHT. Identical in both modes, and in check mode it is the run. ─────
- name: Preflight — target, paths and the commit's own tree
  ansible.builtin.include_tasks: preflight.yml

# ── Directories and secrets. Both PREDICT cleanly under --check: the `file` and
#    `template` modules report what they would do and write nothing, which is
#    the behaviour a preflight wants. Secret CONTENT is never shown, because
#    every task touching one is `no_log`.
# ── The container's runtime GID, as a host group ────────────────────────────
#
# Created BEFORE the secrets, because the PEM files are chowned to it. A
# dedicated system group with NO MEMBERS: nothing on this host is meant to be in
# it, and adding anyone would hand them the JWT signing key. It exists only so
# that a numeric GID the gateway container already runs as has a name here.
- name: Create the dedicated runtime group for the container's GID
  ansible.builtin.group:
    name: "{{ keel_runtime_group }}"
    gid: "{{ keel_runtime_gid }}"
    system: true
    state: present

- name: Note that the runtime group would be created
  # ⚠️ IN CHECK MODE THE GROUP ABOVE IS NOT CREATED, and that is correct — a dry
  # run must not add an account database entry. But it means the NAME does not
  # resolve for the rest of this play, so every later task must address the
  # group by its NUMBER. See the directory and PEM tasks: they pass
  # `keel_runtime_gid`, not `keel_runtime_group`.
  #
  # Getting this wrong failed a real `--check` against dc1-x86:
  #
  #     [WARNING]: failed to look up group keel-runtime.
  #     chgrp failed: failed to look up group keel-runtime
  #
  # — the dry run collapsing on a group it had itself correctly declined to
  # create. The number is also the more honest identifier: a bind mount matches
  # the GID, and the name exists only so a human reading `ls -l` sees something
  # meaningful.
  ansible.builtin.debug:
    msg: >-
      CHECK MODE: group {{ keel_runtime_group }} (GID {{ keel_runtime_gid }})
      would be created. Nothing below depends on that name resolving — the
      secrets directory and the PEMs are chgrp'd by GID.
  when: ansible_check_mode

- name: Read back the runtime group
  # `group:` will happily reuse an EXISTING group of that name on a DIFFERENT
  # GID. That would leave the PEMs group-owned by a GID nothing in the container
  # belongs to — the gateway would crash-loop exactly as before, and nothing
  # would say why. So the GID is read back and asserted rather than assumed.
  ansible.builtin.getent:
    database: group
    key: "{{ keel_runtime_group }}"
  register: keel_runtime_group_ent
  check_mode: false
  failed_when: false

- name: Require the runtime group's GID to match the container's
  ansible.builtin.assert:
    that:
      - (getent_group[keel_runtime_group][1] | default('')) | string == (keel_runtime_gid | string)
    fail_msg: >-
      Host group {{ keel_runtime_group }} has GID
      {{ getent_group[keel_runtime_group][1] | default('(absent)') }}, but the
      gateway container runs as GID {{ keel_runtime_gid }}. The JWT PEMs would be
      unreadable inside the container, which is the defect this provisioning
      exists to prevent.
    success_msg: >-
      {{ keel_runtime_group }} is GID {{ keel_runtime_gid }}, matching the
      gateway container's runtime group.
  when: not ansible_check_mode

- name: Create the persistent directory tree
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ keel_owner }}"
    group: "{{ item.group | default(keel_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ keel_root }}", mode: "0755" }
    - { path: "{{ keel_build_root }}", mode: "0755" }
    - { path: "{{ keel_data_root }}", mode: "0755" }
    # ⚠️ 0750 root:<runtime group>, NOT 0700. The container's group must be able
    # to TRAVERSE this directory to reach the PEMs: a 0700 directory denies uid
    # 10001 before the files' own 0440 mode is ever consulted. `other` still
    # gets nothing.
    # Group by NUMBER, not name: in check mode the group above was deliberately
    # not created, so the name does not resolve and `chgrp` would fail on a dry
    # run. The GID is also what the container actually matches through the bind
    # mount. (enforced: tests/check-mode-runtime-group.yml)
    - path: "{{ keel_secrets_dir }}"
      mode: "{{ keel_secrets_dir_mode }}"
      group: "{{ keel_runtime_gid }}"
    # Stays 0700 root:root. Compose reads the env file HOST-SIDE as root; no
    # container ever opens it, so there is nothing to grant.
    - { path: "{{ keel_env_dir }}", mode: "0700" }
    # Postgres server config and TLS material. 0755 is fine: the certificate is
    # public, and the private key beside it is protected by its own 0600
    # uid-999 ownership rather than by the directory.
    - { path: "{{ keel_pg_conf_dir }}", mode: "0755" }
  loop_control:
    label: "{{ item.path }}"

- name: Create the data subdirectories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ keel_owner }}"
    group: "{{ keel_group }}"
    mode: "0755"
  loop: "{{ keel_data_dirs }}"

- name: Install the secret material and rendered environment
  ansible.builtin.include_tasks: secrets.yml

# ── MUTATING PHASES. Guarded explicitly, not left to each module's own
#    check-mode behaviour — which differs by module and is exactly what let a
#    `command` report `changed` without running while the `unarchive` after it
#    failed on the file it never produced.
- name: Transfer and verify the source for this exact commit
  ansible.builtin.include_tasks: source.yml
  when: not ansible_check_mode

- name: Build the images natively on this host
  ansible.builtin.include_tasks: build.yml
  when: not ansible_check_mode

- name: Deploy the Compose stack
  ansible.builtin.include_tasks: deploy.yml
  when: not ansible_check_mode

- name: Configure the Caddy route
  ansible.builtin.include_tasks: caddy.yml
  when:
    - keel_caddy_enabled | bool
    - not ansible_check_mode

- name: Verify the deployment is healthy
  ansible.builtin.include_tasks: verify.yml
  when: not ansible_check_mode

# ── The plan, printed only under --check. ───────────────────────────────────
- name: What a real run would do
  ansible.builtin.debug:
    msg:
      - "PREFLIGHT PASSED — nothing was changed."
      - ""
      - "commit        {{ keel_commit }}"
      - "images        {{ keel_gateway_image }}, {{ keel_web_image }}"
      - "build source  {{ keel_build_dir }}   (from git archive on the controller)"
      - "data root     {{ keel_data_root }}"
      - "secrets       {{ keel_secrets_dir }}, {{ keel_env_file }}   (0600 root:root)"
      - "ingress       https://{{ keel_hostname }} via Caddy; 127.0.0.1 only otherwise"
      - ""
      - "An ordinary run would then:"
      - "  1. git archive {{ keel_commit_short }} on the controller and unpack it to the build dir"
      - "  2. verify the deployment manifest names this exact commit"
      - "  3. build {{ keel_gateway_image }} and {{ keel_web_image }} natively here"
      - "  4. install the stack from the built commit and refuse any non-loopback publish"
      - "  5. run migrations once, and stop if they exit non-zero"
      - "  6. start the stack and wait for health"
      - "  7. write the Caddy drop-in, validate it, and reload Caddy"
      - "  8. verify /healthz, /readyz, the console, container state and the baked packs"
      - ""
      - "None of the above was performed, predicted-as-done, or required to exist."
  when: ansible_check_mode
