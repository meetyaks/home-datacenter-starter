---
# ─────────────────────────────────────────────────────────────────────────────
# THE DEPLOYMENT MODE AND THE SIGN-IN METHODS HAVE TO AGREE.
#
# ⚠️ THIS EXISTS BECAUSE ONE COMBINATION CANNOT BOOT, AND USED TO FIND THAT
# OUT TOO LATE. Keel's `assertProductionSafe`:
#
#     requireOidc: process.env['KEEL_ALLOW_DEV_LOGIN'] !== 'true'
#
# and KEEL_ALLOW_DEV_LOGIN is itself in DEV_ONLY_KEYS, refused in production.
# So production mode demands OIDC, and the only way out is a toggle
# production forbids. A deployment with no identity provider has NO valid
# production configuration.
#
# On 2026-10-01 a DEV deployment walked straight into it: images pulled,
# migrations applied, and THEN the gateway crash-looped with "OIDC
# configuration is required in production but is incomplete" — leaving a
# migrated database and no gateway. The information needed to predict that
# was available before anything was touched.
#
# So it is checked here, in preflight, where a refusal costs nothing.
#
# Included by preflight.yml, and directly by tests/deployment-mode.yml — one
# owner, exercised by both.
# ─────────────────────────────────────────────────────────────────────────────

- name: The declared deployment mode must be one this role understands
  # ⚠️ A CLOSED VOCABULARY, FAILING CLOSED. Keel's own `deploymentMode` is
  # closed for the same reason: it returns `null` for anything it does not
  # recognise, and `null` is neither production nor development — so `prod`
  # or `dev` buys none of the production checks AND none of the development
  # affordances. A typo must be refused here, not deployed.
  #
  # ⚠️ STRICTER THAN KEEL ON PURPOSE, IN TWO WAYS.
  #
  #   · Keel normalises (`(KEEL_ENV ?? '').trim().toLowerCase()`), so
  #     `Production ` would in fact read as production. This role still
  #     refuses it: an environment file should say exactly one of two values
  #     rather than depend on the gateway tidying it up.
  #   · Keel also knows `test`. A deployed site is not a test run, and
  #     `KEEL_ENV=test` additionally permits source-visible key fallbacks
  #     (`isExplicitDevelopmentOrTest`), so it is deliberately NOT in this
  #     role's vocabulary.
  ansible.builtin.assert:
    that:
      - keel_deployment_mode is defined
      - keel_deployment_mode in keel_deployment_modes
    fail_msg: >-
      keel_deployment_mode is
      "{{ keel_deployment_mode | default('(unset)') }}", which this role does
      not understand. It must be exactly one of
      {{ keel_deployment_modes | join(' | ') }}. Note that Keel ALSO refuses
      an unrecognised KEEL_ENV — it is read as "no mode declared", which
      satisfies neither the production checks nor the development
      affordances.
    success_msg: "Deployment mode: {{ keel_deployment_mode }}."

- name: PRODUCTION MODE REQUIRES AN IDENTITY PROVIDER
  # ⚠️ REFUSED HERE, NOT DISCOVERED AFTER MIGRATIONS. This is the whole point
  # of the file. The alternative is what happened on 2026-10-01: a successful
  # deployment through pull, bundle check and migrations, and then a gateway
  # that will not start — forward-only migrations already applied, and manual
  # recovery to think about.
  #
  # ⚠️ AND IT NAMES BOTH WAYS OUT, because "refused" without a route is just
  # a wall. Either give the deployment a real provider, or declare the mode
  # it can actually run in.
  ansible.builtin.fail:
    msg: >-
      REFUSING: keel_deployment_mode is `production` but this deployment
      declares sign-in methods "{{ keel_auth_methods | default('password') }}",
      which does not include `oidc`.
      That combination CANNOT START. Keel's assertProductionSafe requires
      OIDC configuration whenever dev login is off, and dev login is itself
      forbidden in production — so the gateway would pull the images, run the
      migrations, and then crash-loop with "OIDC configuration is required in
      production but is incomplete", leaving a migrated database behind a
      gateway that never serves.
      Either:
        · add `oidc` to keel_auth_methods and point keel_oidc_issuer at a REAL
          provider (a self-referential issuer is refused at boot — this
          deployment cannot be its own IdP), or
        · declare `keel_deployment_mode: development` in this environment's
          inventory, which skips the production validator. That is a real
          reduction in checking — no TLS check on database URLs, no
          demo-credential check, no CORS allowlist check — so it belongs in
          inventory where an operator reads it, not in a default.
  when:
    - (keel_deployment_mode | default('production')) == 'production'
    - not (keel_oidc_selected | bool)

- name: Say which mode the stack will run in, and what that means
  ansible.builtin.debug:
    msg: >-
      {{ 'KEEL_ENV=production — assertProductionSafe will run: OIDC
         configured, database URLs over TLS, no demo credentials, CORS an
         explicit allowlist.'
         if not (keel_dev_mode_selected | bool)
         else '⚠️ KEEL_ENV=' ~ keel_deployment_mode ~ ' — the production
         validator is SKIPPED for this deployment. Declared in inventory
         because password-only authentication cannot satisfy production
         mode. Nothing checks database TLS, demo credentials or the CORS
         allowlist; the keys themselves are still the real ones from the
         vault.' }}
