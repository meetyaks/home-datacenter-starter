---
# ─────────────────────────────────────────────────────────────────────────────
# Reconcile this site towards the release its channel names.
#
#   1. read the channel, and check it says what it claims to say
#   2. decide — converged? moving backwards? already failed?
#   3. take the lock
#   4. deploy, through roles/keel in release mode
#   5. record what happened, keep the evidence, release the lock
#
# Every refusal below is a deliberate stop with a reason, not an error. A site
# controller that cannot say WHY it did nothing is indistinguishable from one
# that is broken.
# ─────────────────────────────────────────────────────────────────────────────

# ── 0. WHERE THE DEPLOYER KEEPS THINGS ──────────────────────────────────────
#
# ⚠️ READ FROM ITS ONE AUTHORITY, NOT COPIED. This role's state lives beside
# roles/keel's own builds/, data/, secrets/ and env/ directories, so it needs
# `keel_root` — which is a roles/keel default and is therefore UNDEFINED until
# that role is included, several tasks after the state is first read. (This
# failed exactly that way: "'keel_root' is undefined".)
#
# Loaded into a NAMESPACE and then set explicitly, rather than splatted. An
# un-namespaced `include_vars` of another role's defaults outranks inventory
# and would silently overwrite this environment's own `keel_hostname` with the
# role default — turning keel-dev.dc1.lan back into keel.dc1.lan, changing the
# Caddy route and the JWT issuer, and passing every test that did not look.

- name: Read the deployer's filesystem layout
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../keel/defaults/main.yml"
    name: keel_layout

- name: Anchor this role's paths to it, without overriding an operator
  # ⚠️ `default()` AND NOT A BARE ASSIGNMENT. Reading `keel_layout.keel_root`
  # directly would make this role ignore an inventory or command-line override
  # that roles/keel itself honours — so the two would disagree about where the
  # source and the state live, which is worse than either answer. The layout
  # file is the FALLBACK, which is exactly what a role default is.
  #
  # ⚠️ OWNERSHIP BELONGS HERE TOO, AND LEAVING IT OUT COST A DEPLOYMENT. This
  # role creates its own state directories under `keel_root` BEFORE it
  # includes roles/keel — so `keel_owner` and `keel_group` have to be anchored
  # with everything else. They were not, and the first real run failed at
  # "Make sure the state directories exist" with `'keel_group' is undefined`.
  #
  # ⚠️ AND --check COULD NOT HAVE CAUGHT IT. The dry run ends at
  # `when: ansible_check_mode` a few tasks earlier, by design — it must not
  # take the lock. Everything from the lock onwards is therefore invisible to
  # --check, which is worth remembering before trusting a green dry run as
  # evidence that a real run will work. tests/reconcile-boundaries.yml now
  # asserts that every deployer variable this role uses is anchored, which is
  # a check that does not need a host.
  ansible.builtin.set_fact:
    keel_root: "{{ keel_root | default(keel_layout.keel_root, true) }}"
    keel_source_repo: "{{ keel_source_repo | default(keel_layout.keel_source_repo, true) }}"
    keel_owner: "{{ keel_owner | default(keel_layout.keel_owner, true) }}"
    keel_group: "{{ keel_group | default(keel_layout.keel_group, true) }}"
    # ⚠️ NEEDED BY THE FAILURE PATH. tasks/evidence.yml runs in the rescue of
    # the deploy block — AFTER `include_role: keel` has returned — and an
    # included role's defaults go out of scope when it does.
    #
    # ⚠️ ONLY THE PLAIN ONE. `keel_diagnostic_log_lines` is a number and
    # anchors fine. `keel_compose_cmd` CANNOT be anchored: it is itself a
    # template over keel_env_file, keel_compose_file and
    # keel_oidc_selected, so rendering it out here fails with
    # `'keel_env_file' is undefined` — swapping one undefined-variable crash
    # for another, two layers deeper. evidence.yml guards that one instead.
    keel_diagnostic_log_lines: >-
      {{ keel_diagnostic_log_lines | default(keel_layout.keel_diagnostic_log_lines, true) }}

# ── 1. CAN THIS CONTROLLER READ THE CHANNEL AT ALL? ─────────────────────────
#
# ⚠️ BEFORE THE CLONE, NOT AS PART OF IT. meetyaks/keel is private, and a
# clone that succeeds through the operator's credential helper proves nothing
# about the scheduler — which runs as a different account with no keychain
# and no login session. This asks the question with those credentials
# deliberately excluded, and refuses if the answer is no.

- name: Confirm the unattended credential can reach the private repository
  ansible.builtin.include_tasks: credentials.yml

# ── THE CHANNEL ─────────────────────────────────────────────────────────────

- name: Fetch the channel branch on the controller
  # ⚠️ ON THE CONTROLLER, AND READ-ONLY. The managed host is never given
  # credentials to a source repository, and never decides for itself what it
  # should be running. `depth: 1` because only the tip of a pointer matters.
  ansible.builtin.git:
    repo: "{{ keel_reconcile_channel_repo }}"
    dest: "{{ keel_reconcile_workdir }}"
    version: "{{ keel_reconcile_channel_branch }}"
    depth: 1
    force: true
    # ⚠️ NOT `accept_hostkey`, EVER. That option is `StrictHostKeyChecking=no`
    # wearing a friendlier name: it writes whatever answered into known_hosts
    # and carries on. The host keys are pinned ahead of time instead, and an
    # unexpected one is a failure — which is the only safe behaviour for a
    # document that decides what this site runs.
    accept_hostkey: false
  environment:
    GIT_SSH_COMMAND: "{{ keel_reconcile_ssh_command }}"
    GIT_TERMINAL_PROMPT: "0"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  # ⚠️ RUNS UNDER --check TOO, AND MUST. The git module in check mode reports
  # what it WOULD clone and clones nothing, so every task after this one had
  # nothing to read and a dry run died on a missing channels/dev.json — making
  # `--check` useless for the one playbook an operator most wants to dry-run.
  #
  # It is safe because it is a READ: a shallow fetch of a published pointer
  # into a controller temp directory. Nothing on the managed host is touched,
  # and the dry run is worth far more with the real document in hand than with
  # a prediction that one exists.
  check_mode: false

- name: Read the channel document
  ansible.builtin.slurp:
    src: "{{ keel_reconcile_workdir }}/{{ keel_reconcile_channel_path }}"
  delegate_to: localhost
  become: false
  register: keel_reconcile_channel_raw

- name: Parse it
  ansible.builtin.set_fact:
    keel_reconcile_channel_doc: "{{ keel_reconcile_channel_raw.content | b64decode | from_json }}"

- name: The channel document is the shape this controller understands
  ansible.builtin.assert:
    that:
      - keel_reconcile_channel_doc.schemaVersion is defined
      - keel_reconcile_channel_doc.schemaVersion == keel_reconcile_channel_schema_version
      - keel_reconcile_channel_doc.channel == keel_reconcile_channel
      - keel_reconcile_channel_doc.release is defined
      - keel_reconcile_channel_doc.advanced is defined
    fail_msg: >-
      {{ keel_reconcile_channel_path }} on
      {{ keel_reconcile_channel_branch }} is not a
      {{ keel_reconcile_channel_schema_version }} document for channel
      "{{ keel_reconcile_channel }}". Refusing to interpret it.
    success_msg: >-
      Channel "{{ keel_reconcile_channel }}" names
      {{ keel_reconcile_channel_doc.release.releaseId }}.

- name: Write the release manifest out for the deployer to verify
  # The deployer re-validates and verifies these bytes itself (roles/keel
  # tasks/release.yml). Nothing here is trusted on this role's say-so — which
  # is why the manifest is handed over as a FILE rather than as a variable:
  # `gh attestation verify` needs the exact bytes that were signed.
  ansible.builtin.copy:
    content: "{{ keel_reconcile_channel_doc.release | to_nice_json(indent=2) }}\n"
    dest: "{{ keel_reconcile_workdir }}/release.json"
    mode: "0644"
  delegate_to: localhost
  become: false
  changed_when: false

# ── 2. WHAT THIS HOST IS RUNNING NOW ────────────────────────────────────────

- name: Look for a deployment record on the host
  ansible.builtin.slurp:
    src: "{{ keel_reconcile_current_file }}"
  register: keel_reconcile_current_raw
  failed_when: false

- name: Read it, or note that this host has never been reconciled
  ansible.builtin.set_fact:
    keel_reconcile_current: >-
      {{ (keel_reconcile_current_raw.content | b64decode | from_json)
         if (keel_reconcile_current_raw.content is defined) else {} }}

- name: Look for previous attempts at this exact release
  ansible.builtin.slurp:
    src: "{{ keel_reconcile_attempts_dir }}/{{ keel_reconcile_channel_doc.release.releaseId }}.json"
  register: keel_reconcile_attempt_raw
  failed_when: false

- name: Count them
  ansible.builtin.set_fact:
    keel_reconcile_attempts: >-
      {{ ((keel_reconcile_attempt_raw.content | b64decode | from_json).attempts
          if (keel_reconcile_attempt_raw.content is defined) else 0) | int }}

- name: Say where this host stands
  ansible.builtin.debug:
    msg:
      - "channel wants  {{ keel_reconcile_channel_doc.release.releaseId }}
         ({{ keel_reconcile_channel_doc.release.gitSha[:12] }})"
      - "host has       {{ keel_reconcile_current.releaseId | default('(no record — never reconciled)') }}"
      - "attempts       {{ keel_reconcile_attempts }} of {{ keel_reconcile_max_attempts }}"
      - "auto-deploy    {{ keel_reconcile_auto_deploy | bool }}"
      # ⚠️ DRIFT IS NOT ONLY "WHICH RELEASE". Moving from a persisted release
      # to an unavailable one is a change in assurance, and an operator
      # reading this line should see it before the deployment, not discover it
      # in current.json afterwards.
      - "running        {{ (keel_reconcile_current.attestation.status | default('unknown'))
                           if keel_reconcile_current.releaseId is defined else 'n/a' }} provenance"
      - "offered        {{ keel_reconcile_channel_doc.release.provenance.attestation.status
                           | default('(absent)') }} provenance"
      - "policy         {{ keel_release_provenance_policy | default('(from role default)') }}"

# ── 3. THE DECISION ─────────────────────────────────────────────────────────

- name: Decide
  ansible.builtin.include_tasks: decide.yml

- name: Refuse to move this site backwards
  # ⚠️ THE SITE'S OWN GUARD, NOT A RESTATEMENT OF CI'S. CI refuses to advance
  # the channel to a commit that is not a descendant of the current one, using
  # git ancestry it can see. A site has no repository and cannot ask that
  # question — but it does know what it deployed and when that release was
  # built. A channel that now names an OLDER release without declaring a
  # rollback means something went wrong upstream, or the document is not the
  # one CI wrote. Either way this host should stop, not deploy it.
  #
  # An explicit rollback (`advanced.rollback`) is allowed through: it is an
  # operator act, and the channel says so in the artifact rather than leaving
  # it to be inferred.
  ansible.builtin.fail:
    msg: "REFUSING TO MOVE BACKWARDS: {{ keel_reconcile_reason }}. Investigate before deploying."
  when: keel_reconcile_decision == 'refuse-backwards'

- name: Stop retrying a release that has already failed its allowance
  # ⚠️ A TIMER PLUS AN UNCONDITIONAL RETRY IS AN INFINITE RETRY. Without this
  # the site would restart the stack on every tick, forever, and bury the one
  # informative failure under a thousand identical ones.
  ansible.builtin.fail:
    msg: >-
      REFUSING: {{ keel_reconcile_reason }}. Not retrying automatically. The
      evidence is under {{ keel_reconcile_evidence_dir }}. When the cause is
      understood, clear the attempt record to allow another try:
        rm {{ keel_reconcile_attempts_dir }}/{{ keel_reconcile_channel_doc.release.releaseId }}.json
  when: keel_reconcile_decision == 'refuse-attempts'

- name: Already converged — nothing to do
  # The ordinary outcome. A timer that fires every few minutes finds this
  # almost every time, and it must be cheap about it rather than redeploying
  # an identical release.
  ansible.builtin.meta: end_host
  when: keel_reconcile_decision == 'converged'

- name: Make sure the controller's Keel checkout actually has this commit
  # ⚠️ AN UNATTENDED TIMER WOULD OTHERWISE FAIL ON EVERY NEW RELEASE. Release
  # mode still transfers the commit's tree, because the compose bundle and
  # pg_hba.conf are part of the stack definition and are not inside the image —
  # and roles/keel builds that tree with `git archive` from the CONTROLLER's
  # checkout. A console whose checkout predates the release has no such object,
  # so preflight would refuse, every fifteen minutes, until a human remembered
  # to fetch. Automatic reconciliation that depends on a manual `git pull` is
  # not automatic.
  #
  # `fetch` only, never `pull` or `checkout`: this writes to the object store
  # and leaves the working tree, branch and any local edits exactly as they
  # were. The console is somebody's working copy.
  #
  # ⚠️ THE URL, NOT `origin`. The SAME repository and the SAME deploy key as
  # the channel — one credential covers both reads, because release/dev and
  # the release's source commit are both in meetyaks/keel. Naming the URL
  # instead of the symbolic remote removes a dependency on how somebody
  # happened to configure their working copy: `origin` here is an HTTPS URL
  # that resolves through a personal credential helper, so fetching it would
  # work for a person and fail for the scheduler — the same false signal the
  # credential preflight exists to remove.
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ keel_source_repo }}"
      - fetch
      - --quiet
      - "{{ keel_reconcile_channel_repo if keel_channel_is_remote | bool else 'origin' }}"
  environment:
    GIT_SSH_COMMAND: "{{ keel_reconcile_ssh_command }}"
    GIT_TERMINAL_PROMPT: "0"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  check_mode: false

- name: Confirm the release's commit is now present
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ keel_source_repo }}"
      - cat-file
      - -e
      - "{{ keel_reconcile_channel_doc.release.gitSha }}^{commit}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false
  register: keel_reconcile_commit_present
  check_mode: false

- name: Stop if it is not, and say what to do
  ansible.builtin.fail:
    msg: >-
      REFUSING: commit {{ keel_reconcile_channel_doc.release.gitSha }} (release
      {{ keel_reconcile_channel_doc.release.releaseId }}) is not in
      {{ keel_source_repo }} on this controller, even after
      fetching origin. The release's compose bundle is read from that commit's
      tree, so the deployment cannot proceed. Check that the checkout's origin
      is the repository the release came from
      ({{ keel_reconcile_channel_doc.release.provenance.repository
          | default('the release repository') }}).
  when: keel_reconcile_commit_present.rc | default(1) != 0

- name: Report the drift and stop, because automatic deployment is off
  # Not a refusal — a site that has deliberately taken itself out of automatic
  # reconciliation, saying exactly what it would otherwise have done.
  ansible.builtin.meta: end_host
  when: not (keel_reconcile_auto_deploy | bool)

- name: Report the drift and stop, because this is a dry run
  # ⚠️ `--check` MUST NOT DEPLOY. roles/keel guards each mutating phase, but
  # this role takes a lock and writes an attempt record before it ever gets
  # there, and neither of those is a dry run of anything.
  ansible.builtin.meta: end_host
  when: ansible_check_mode

# ── 4. DEPLOY, UNDER A LOCK ─────────────────────────────────────────────────

- name: Make sure the state directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ keel_owner }}"
    group: "{{ keel_group }}"
    mode: "0750"
  loop:
    - "{{ keel_reconcile_state_dir }}"
    - "{{ keel_reconcile_attempts_dir }}"
    - "{{ keel_reconcile_evidence_dir }}"

- name: Take the deployment lock
  ansible.builtin.include_tasks: lock.yml

- name: Deploy the release, and always give the lock back
  block:
    - name: Note the attempt before making it
      # ⚠️ WRITTEN FIRST, ON PURPOSE. A deployment that hangs or takes the host
      # down would otherwise leave no record that it was ever tried, and the
      # next timer tick would try it again — and again. The count increments
      # before the risk is taken, not after it is survived.
      ansible.builtin.copy:
        content: |
          {{ {
               'releaseId': keel_reconcile_channel_doc.release.releaseId,
               'gitSha': keel_reconcile_channel_doc.release.gitSha,
               'attempts': (keel_reconcile_attempts | int) + 1,
               'lastAttemptAt': ansible_date_time.iso8601,
               'lastAttemptBy': lookup('env', 'USER') ~ '@' ~ lookup('env', 'HOSTNAME'),
               'provenancePolicy': keel_release_provenance_policy | default('(unset)'),
               'attestation': keel_reconcile_channel_doc.release.provenance.attestation
                              | default({'status': '(absent)'}),
               'sbom': keel_reconcile_channel_doc.release.provenance.sbom | default({})
             } | to_nice_json(indent=2) }}
        dest: "{{ keel_reconcile_attempts_dir }}/{{ keel_reconcile_channel_doc.release.releaseId }}.json"
        owner: "{{ keel_owner }}"
        group: "{{ keel_group }}"
        mode: "0640"

    - name: Provision the host's reverse proxy first
      # ⚠️ WITHOUT THIS THE DEPLOYMENT ENDS "HEALTHY AND UNREACHABLE", and
      # roles/keel refuses rather than let that happen:
      #
      #   keel_caddy_enabled is true, but the caddy role has not run in this
      #   play. Keel publishes nothing to the LAN — gateway and web bind to
      #   127.0.0.1 and every dependency binds to nothing.
      #
      # That is exactly what the first real reconcile hit. playbooks/keel.yml
      # has always provisioned Caddy before the deployer; this path was
      # written without it, so the guard stopped it — correctly, and before
      # anything was changed.
      #
      # ⚠️ HERE, NOT IN THE PLAYBOOK, AND THE DIFFERENCE IS THE TIMER. Putting
      # it beside the reconcile include in playbooks/keel-reconcile.yml would
      # mirror keel.yml, but it would also run the whole caddy role on EVERY
      # tick — ninety-six times a day on a fifteen-minute schedule — and the
      # converged path is meant to read one small JSON document and stop.
      # Inside the deploy block it runs only when a deployment is actually
      # happening.
      #
      # The cost of that choice, stated plainly: ingress drift on a CONVERGED
      # site is not corrected here. Fixing ingress is playbooks/keel.yml's
      # job, and this role's job is the release channel.
      ansible.builtin.include_role:
        name: caddy
      when: keel_caddy_enabled | default(true) | bool

    - name: Deploy through the canonical deployer, in release mode
      # ⚠️ ONE DEPLOYER. This role decides; roles/keel deploys. It verifies the
      # manifest's provenance, pins the commit and the digests, proves the
      # bundle matches what was gated, runs migrations through the compose
      # `migrate` service — the canonical migration owner, unchanged — and
      # gates on health. None of that is reimplemented here.
      ansible.builtin.include_role:
        name: keel
      vars:
        keel_release_manifest_file: "{{ keel_reconcile_workdir }}/release.json"

    - name: Record the release this host is now running
      ansible.builtin.copy:
        content: |
          {{ {
               'releaseId': keel_reconcile_channel_doc.release.releaseId,
               'gitSha': keel_reconcile_channel_doc.release.gitSha,
               'createdAt': keel_reconcile_channel_doc.release.createdAt,
               'platformVersion': keel_reconcile_channel_doc.release.platformVersion,
               'images': keel_reconcile_channel_doc.release.images,
               'outcome': 'deployed',
               'deployedAt': ansible_date_time.iso8601,
               'deployedBy': lookup('env', 'USER') ~ '@' ~ lookup('env', 'HOSTNAME'),
               'channel': keel_reconcile_channel,
               'channelAdvanced': keel_reconcile_channel_doc.advanced,
               'provenancePolicy': keel_release_provenance_policy | default('(unset)'),
               'attestation': keel_reconcile_channel_doc.release.provenance.attestation,
               'sbom': keel_reconcile_channel_doc.release.provenance.sbom,
               'assurance': keel_release_assurance | default('(unrecorded)')
             } | to_nice_json(indent=2) }}
        dest: "{{ keel_reconcile_current_file }}"
        owner: "{{ keel_owner }}"
        group: "{{ keel_group }}"
        mode: "0640"

    - name: Clear the attempt record now that it succeeded
      ansible.builtin.file:
        path: "{{ keel_reconcile_attempts_dir }}/{{ keel_reconcile_channel_doc.release.releaseId }}.json"
        state: absent

  rescue:
    - name: Keep the evidence
      ansible.builtin.include_tasks: evidence.yml

    - name: Say what must happen next, precisely
      # ⚠️ NO AUTOMATIC ROLLBACK, AND THE RELEASE ITSELF SAYS WHY. Keel's
      # migrations are forward-only and there is no down-migration runner, so
      # redeploying the previous image does NOT restore the previous schema. A
      # site that rolled back here would report success while leaving the
      # database ahead of the code — the one failure mode nobody checks for.
      #
      # ⚠️ BUT IT MUST ONLY SAY SO WHEN IT IS TRUE. This message used to fire
      # on the release's `requiresManualRecoveryOnFailure` flag alone, which
      # every release sets — so a preflight failure that touched nothing
      # produced the identical "MANUAL RECOVERY IS REQUIRED" as a migration
      # that died halfway. On 2026-10-01 it shouted that twice at runs that
      # had changed nothing: once for a missing variable, once for a compose
      # interpolation error.
      #
      # That is how an operator learns to discount the message, and then
      # discounts it on the day it is real. `keel_deploy_stack_started` is
      # set by roles/keel immediately before `up -d` — the point past which
      # bootstrap may have applied migrations — so the two cases can finally
      # be told apart.
      ansible.builtin.fail:
        msg: >-
          DEPLOYMENT FAILED: {{ keel_reconcile_channel_doc.release.releaseId }}
          on {{ inventory_hostname }}, attempt
          {{ (keel_reconcile_attempts | int) + 1 }} of
          {{ keel_reconcile_max_attempts }}.
          {{ 'The stack was never started: this failed before `up -d`, so no
             migration ran and nothing on this host was changed by the
             deployment. The site is still serving whatever it was serving
             before. Fix the cause and run again — no recovery is needed.'
             if not (keel_deploy_stack_started | default(false) | bool)
             else ('This release declares requiresManualRecoveryOnFailure, and
             the stack HAD been started — migrations may have run. They are
             forward-only and there is no down-migration runner, so
             redeploying the previous image would NOT restore the previous
             schema. MANUAL RECOVERY IS REQUIRED; this controller will not
             roll back.'
             if keel_reconcile_channel_doc.release.migrations.requiresManualRecoveryOnFailure | bool
             else 'The stack had been started. Automatic rollback is disabled
             by policy (keel_reconcile_auto_rollback).') }}
          Evidence: {{ keel_reconcile_evidence_run_dir | default(keel_reconcile_evidence_dir) }}.
          {{ 'No further automatic attempts will be made.'
             if ((keel_reconcile_attempts | int) + 1) >= (keel_reconcile_max_attempts | int)
             else 'One further automatic attempt remains.' }}

  always:
    - name: Give the lock back
      # In `always`, so a failed deployment does not wedge every future run.
      ansible.builtin.file:
        path: "{{ keel_reconcile_lock_dir }}"
        state: absent
