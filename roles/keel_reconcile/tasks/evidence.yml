---
# ─────────────────────────────────────────────────────────────────────────────
# Keep enough to diagnose a failed reconciliation AFTER the fact.
#
# ⚠️ WHY ON THE HOST AND NOT IN THE PLAYBOOK OUTPUT. The run that failed was
# started by a timer at 03:00 with nobody watching; its stdout went to the
# journal of whichever machine happened to be the control node, and by the time
# somebody asks, the terminal is gone. The evidence has to outlive the run that
# produced it, and it has to be where the thing it describes is.
#
# ⚠️ AND WHY NOT SECRETS. `docker compose config` would resolve the environment
# file into the output — every vault value in plain text, written to disk
# outside the secrets directory and kept for twenty releases. `compose ps` and
# per-service logs are what a diagnosis actually needs.
# ─────────────────────────────────────────────────────────────────────────────

- name: Name this evidence run
  ansible.builtin.set_fact:
    keel_reconcile_evidence_run_dir: >-
      {{ keel_reconcile_evidence_dir }}/{{ ansible_date_time.iso8601_basic_short }}-{{
         keel_reconcile_channel_doc.release.releaseId }}

- name: Create it
  ansible.builtin.file:
    path: "{{ keel_reconcile_evidence_run_dir }}"
    state: directory
    owner: "{{ keel_owner }}"
    group: "{{ keel_group }}"
    mode: "0750"

- name: Record what was being attempted and what this host held before it
  ansible.builtin.copy:
    content: |
      {{ {
           'attemptedRelease': keel_reconcile_channel_doc.release,
           'provenancePolicy': keel_release_provenance_policy | default('(unset)'),
           'attestation': keel_reconcile_channel_doc.release.provenance.attestation
                          | default({'status': '(absent)'}),
           'sbom': keel_reconcile_channel_doc.release.provenance.sbom | default({}),
           'channelAdvanced': keel_reconcile_channel_doc.advanced,
           'previousRelease': keel_reconcile_current | default({}, true),
           'attemptNumber': (keel_reconcile_attempts | int) + 1,
           'maxAttempts': keel_reconcile_max_attempts,
           'failedAt': ansible_date_time.iso8601,
           'host': inventory_hostname
         } | to_nice_json(indent=2) }}
    dest: "{{ keel_reconcile_evidence_run_dir }}/attempt.json"
    owner: "{{ keel_owner }}"
    group: "{{ keel_group }}"
    mode: "0640"

# ⚠️ `| default('')` AND A GUARD, BECAUSE THIS RUNS IN A RESCUE AND MUST NOT
# ADD A FAILURE OF ITS OWN. `keel_compose_cmd` belongs to roles/keel, whose
# defaults go out of scope the moment its include returns — so if the
# deployment failed BEFORE or DURING that include, it is simply not defined
# here.
#
# That is not hypothetical: the first real reconcile failed in roles/keel's
# preflight, and then this task died with `'keel_compose_cmd' is undefined`.
# The collector whose entire job is preserving the state of a failed run
# destroyed the record of why it failed, and replaced the real error with
# its own.
#
# It cannot be anchored the way keel_root and keel_owner are: it is itself a
# template over keel_env_file, keel_compose_file and keel_oidc_selected, so
# rendering it outside the role fails two layers deeper. Degrading is the
# honest answer — capture what we can, and SAY what we could not.
- name: Note whether the compose command is even known here
  ansible.builtin.set_fact:
    keel_reconcile_compose_known: "{{ (keel_compose_cmd | default('') | trim) | length > 0 }}"

- name: Capture container state
  ansible.builtin.shell:
    cmd: >-
      {{ keel_compose_cmd | default('') }} ps --all
      > {{ keel_reconcile_evidence_run_dir }}/compose-ps.txt 2>&1
  changed_when: true
  failed_when: false
  when: keel_reconcile_compose_known | bool

- name: Capture recent logs per service
  # `failed_when: false` throughout — this runs in a rescue, and evidence
  # collection that can itself fail would replace the real error with its own.
  ansible.builtin.shell:
    cmd: >-
      {{ keel_compose_cmd | default('') }} logs --no-color
      --tail {{ keel_diagnostic_log_lines | default(80) }}
      > {{ keel_reconcile_evidence_run_dir }}/compose-logs.txt 2>&1
  changed_when: true
  failed_when: false
  when: keel_reconcile_compose_known | bool

- name: Say so in the evidence when container state could not be captured
  # ⚠️ A FILE, NOT JUST A SKIPPED TASK. Somebody reading this directory
  # months later has to be able to tell "the containers were fine" from
  # "nobody looked" — an absent compose-ps.txt alone cannot say which.
  ansible.builtin.copy:
    content: |
      Container state and logs were NOT captured for this failure.

      The deployment failed before roles/keel had defined its compose
      command — typically in preflight, before any container was touched.
      There was therefore nothing running that this release had started,
      and no compose project to query.

      Look at the Ansible output for the originating failure; the attempt
      record beside this file names the release and the policy in force.
    dest: "{{ keel_reconcile_evidence_run_dir }}/compose-ps.txt"
    owner: "{{ keel_owner }}"
    group: "{{ keel_group }}"
    mode: "0640"
  failed_when: false
  when: not (keel_reconcile_compose_known | bool)

- name: Record the images the host actually holds for this release
  ansible.builtin.shell:
    cmd: >-
      docker image inspect
      {% for i in keel_reconcile_channel_doc.release.images %}
      {{ i.repository }}@{{ i.digest }}
      {% endfor %}
      --format '{{ "{{.ID}} {{index .RepoDigests 0}} {{index .Config.Labels \"org.opencontainers.image.version\"}}" }}'
      > {{ keel_reconcile_evidence_run_dir }}/images.txt 2>&1
  changed_when: true
  failed_when: false

- name: Prune the oldest evidence, keeping the most recent runs
  # Bounded, because this lives on the data volume. Sorted by name, which sorts
  # by time because the directory name starts with a compact UTC timestamp.
  ansible.builtin.shell:
    cmd: >-
      ls -1d {{ keel_reconcile_evidence_dir }}/*/ 2>/dev/null | sort
      | head -n -{{ keel_reconcile_evidence_keep }}
      | xargs -r rm -rf
  changed_when: true
  failed_when: false

- name: Say where it went
  ansible.builtin.debug:
    msg: "Evidence retained at {{ keel_reconcile_evidence_run_dir }}"
