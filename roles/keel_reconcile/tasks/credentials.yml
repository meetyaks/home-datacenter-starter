---
# ─────────────────────────────────────────────────────────────────────────────
# CAN THIS CONTROLLER READ THE PRIVATE REPOSITORY WITHOUT A HUMAN?
#
# ⚠️ THE QUESTION AN INTERACTIVE RUN CANNOT ANSWER. meetyaks/keel is private.
# When a developer runs this playbook, the channel clone succeeds through
# their git credential helper — their keychain, their personal token, their
# login session. None of that exists for a launchd daemon running as a
# service account, so a green manual run is NOT evidence that the scheduler
# will work. It is evidence that a person was logged in.
#
# So this asks the question directly, with the operator's own credentials
# deliberately excluded, BEFORE anything is cloned or deployed. Failing here
# costs nothing: no lock has been taken, no image pulled, no container
# stopped.
#
# ⚠️ EVERY CHECK IS ABOUT A PATH, NEVER A VALUE. Nothing in this file reads
# key material, prints it, or writes it anywhere. The private key stays on
# disk, owned by the service account, and only `ssh` ever opens it.
# ─────────────────────────────────────────────────────────────────────────────

# ── IS THERE A REMOTE TO AUTHENTICATE TO AT ALL? ────────────────────────────
#
# The regression suites serve the channel from a local git repository under
# /tmp, which needs no credential and cannot have one. Everything below is
# about reaching a REMOTE private repository, so it is gated on there being
# one — and the gate is closed from the other side by the next task, which
# refuses any remote that is not SSH. A local path skips; `https://…` does
# not get to skip, it gets refused.

- name: Is the channel served from a local path or a remote?
  ansible.builtin.stat:
    path: "{{ keel_reconcile_channel_repo }}"
  delegate_to: localhost
  become: false
  run_once: true
  failed_when: false
  register: keel_channel_local

- name: Decide which it is
  ansible.builtin.set_fact:
    keel_channel_is_remote: "{{ not (keel_channel_local.stat.exists | default(false)) }}"

- name: A remote channel is reached over SSH with a dedicated key, or not at all
  # ⚠️ THIS IS THE TASK THAT CLOSES THE LOOPHOLE ABOVE. Without it, changing
  # the repository back to `https://github.com/meetyaks/keel` would skip
  # every credential check below and "work" on a developer's Mac through
  # their credential helper — the exact false signal this file exists to
  # remove. An HTTPS remote to a private repository is refused outright.
  ansible.builtin.assert:
    that:
      - keel_reconcile_channel_repo is match('^(git@|ssh://)')
    fail_msg: >-
      keel_reconcile_channel_repo is "{{ keel_reconcile_channel_repo }}",
      which is a remote this controller would reach over HTTPS — through
      whatever git credential helper the account happens to have. That works
      for a person and fails for a scheduler, and the failure arrives
      unattended. Use the SSH form (git@github.com:meetyaks/keel.git) with
      the dedicated read-only deploy key.
    success_msg: "Channel remote is SSH: {{ keel_reconcile_channel_repo }}."
  when: keel_channel_is_remote | bool

- name: Say plainly that a local channel needs no credential
  # Loud rather than silent: a skipped security check should be visible in
  # the output of the run that skipped it.
  ansible.builtin.debug:
    msg: >-
      Channel repository {{ keel_reconcile_channel_repo }} is a local path, so
      the deploy-key contract does not apply to this run. This is the test
      fixture shape; the DEV inventory uses the SSH remote.
  when: not (keel_channel_is_remote | bool)

# ── EVERYTHING BELOW APPLIES ONLY TO A REMOTE PRIVATE REPOSITORY ────────────
#
# One block, one condition. Repeating `when:` on nine tasks is nine chances
# to forget it on the tenth.
- name: The deploy-key contract
  when: keel_channel_is_remote | bool
  block:
    - name: Look for the deploy key on the controller
      ansible.builtin.stat:
        path: "{{ keel_reconcile_deploy_key }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: keel_deploy_key_stat

    - name: The deploy key exists
      ansible.builtin.assert:
        that:
          - keel_deploy_key_stat.stat.exists
          - keel_deploy_key_stat.stat.isreg | default(false)
        fail_msg: >-
          No deploy key at {{ keel_reconcile_deploy_key }} on this controller.
          meetyaks/keel is private, and an unattended run has no credential
          helper, no keychain and no login session to fall back on. Install a
          repository-scoped READ-ONLY deploy key there, owned by the account that
          runs the reconciler, mode 0400 — see docs/keel-dev-reconcile.md. This
          repository does not create it.
        success_msg: "Deploy key present at {{ keel_reconcile_deploy_key }}."

    - name: It is readable only by its owner
      # ⚠️ A KEY A SECOND ACCOUNT CAN READ IS NOT A DEDICATED CREDENTIAL. It is a
      # shared one, and the delegation chain stops meaning anything. ssh itself
      # refuses a group- or world-readable key, but it refuses at the point of
      # USE — in the middle of a clone, with a message about permissions that
      # reads like a local problem rather than a credential that was installed
      # wrongly.
      ansible.builtin.assert:
        that:
          - (keel_deploy_key_stat.stat.mode | int(base=8)) == 0o400 or
            (keel_deploy_key_stat.stat.mode | int(base=8)) == 0o600
        fail_msg: >-
          {{ keel_reconcile_deploy_key }} is mode
          {{ keel_deploy_key_stat.stat.mode | default('(unknown)') }}. A deploy
          key must be 0400 (or 0600 while it is being installed) and readable by
          nobody else — ssh will refuse it anyway, but later, with a message that
          reads like a local permissions problem.
        success_msg: "Deploy key mode {{ keel_deploy_key_stat.stat.mode }}."

    - name: It belongs to the account running this reconciliation
      # Ownership, not just mode: a 0400 key owned by somebody else is a key this
      # account cannot read at all, and the resulting "Permission denied
      # (publickey)" names the wrong cause.
      ansible.builtin.assert:
        that:
          - keel_deploy_key_stat.stat.pw_name == keel_reconcile_controller_user
        fail_msg: >-
          {{ keel_reconcile_deploy_key }} is owned by
          "{{ keel_deploy_key_stat.stat.pw_name | default('(unknown)') }}" but
          this reconciliation runs as
          "{{ keel_reconcile_controller_user }}". The scheduler's service account
          must own its own credential; borrowing another account's key is how a
          deployment ends up attributable to the wrong principal.
        success_msg: >-
          Deploy key owned by {{ keel_deploy_key_stat.stat.pw_name }}, which is
          who is running.

    - name: Look for the pinned known_hosts
      ansible.builtin.stat:
        path: "{{ keel_reconcile_known_hosts }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: keel_known_hosts_stat

    - name: Host keys are pinned, so an unknown one is a failure and not a question
      # ⚠️ THE ALTERNATIVE TO PINNING IS NOT "ASK" — IT IS "ACCEPT". With
      # BatchMode=yes there is nobody to answer the authenticity prompt, so an
      # unpinned run either errors out here or, if somebody "fixes" it with
      # StrictHostKeyChecking=no, silently trusts whatever answered on port 22.
      # That is the one failure mode a release channel cannot tolerate: it is the
      # path by which a site deploys a manifest it was handed by the wrong server.
      ansible.builtin.assert:
        that:
          - keel_known_hosts_stat.stat.exists
          - (keel_known_hosts_stat.stat.size | default(0)) > 0
        fail_msg: >-
          No pinned host keys at {{ keel_reconcile_known_hosts }}. Create it from
          GitHub's PUBLISHED host keys (https://api.github.com/meta, `ssh_keys`)
          rather than from `ssh-keyscan`, which pins whatever answers. Without it
          an unattended clone cannot verify what it is talking to, and the only
          way to make it "work" is to stop checking.
        success_msg: "Host keys pinned at {{ keel_reconcile_known_hosts }}."

    - name: The SSH invocation never weakens host-key checking
      # A structural check on the composed command, because this is a string an
      # operator can override from inventory or `-e`. `StrictHostKeyChecking=no`
      # and `accept-new` both turn the guarantee above into a formality.
      ansible.builtin.assert:
        that:
          - "'StrictHostKeyChecking=yes' in keel_reconcile_ssh_command"
          - "'BatchMode=yes' in keel_reconcile_ssh_command"
          - not (keel_reconcile_ssh_command is search('StrictHostKeyChecking\\s*=\\s*(no|accept-new)'))
        fail_msg: >-
          keel_reconcile_ssh_command does not enforce strict host-key checking in
          batch mode: "{{ keel_reconcile_ssh_command }}". Refusing — an
          unattended controller that accepts an unknown host key will accept a
          release document from whatever answered.
        success_msg: "SSH: strict host-key checking, batch mode, explicit key."

    # ── THE ACTUAL QUESTION ─────────────────────────────────────────────────────

    - name: Ask GitHub, as the service account and nobody else, for the channel ref
      # ⚠️ `ls-remote`, NOT A CLONE. One round trip, no working tree, no objects
      # written — it answers "can this credential read this branch" and nothing
      # else. Run BEFORE the clone so a credential problem is reported as a
      # credential problem rather than as a confusing git failure halfway through.
      #
      # ⚠️ THE ENVIRONMENT IS SCRUBBED OF THE OPERATOR'S CREDENTIALS ON PURPOSE.
      # `GIT_TERMINAL_PROMPT=0` stops git asking for a username; the empty
      # `GIT_CONFIG_*` pair neutralises a credential helper configured globally
      # on a developer's machine; `IdentityAgent=none` and `IdentitiesOnly=yes`
      # in the ssh command stop a running ssh-agent from quietly supplying a
      # personal key. Without these, THIS CHECK WOULD PASS ON A DEVELOPER'S MAC
      # AND PROVE NOTHING — which is precisely the false signal it exists to
      # remove.
      ansible.builtin.command:
        argv:
          - git
          - ls-remote
          - --exit-code
          - "{{ keel_reconcile_channel_repo }}"
          - "refs/heads/{{ keel_reconcile_channel_branch }}"
      environment:
        GIT_SSH_COMMAND: "{{ keel_reconcile_ssh_command }}"
        GIT_TERMINAL_PROMPT: "0"
        GIT_CONFIG_COUNT: "0"
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_SYSTEM: /dev/null
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      failed_when: false
      check_mode: false
      register: keel_channel_readable

    - name: The deploy key can read the release channel
      ansible.builtin.assert:
        that:
          - keel_channel_readable.rc == 0
        fail_msg: >-
          The deploy key at {{ keel_reconcile_deploy_key }} cannot read
          refs/heads/{{ keel_reconcile_channel_branch }} in
          {{ keel_reconcile_channel_repo }} (git exited
          {{ keel_channel_readable.rc }}: {{ keel_channel_readable.stderr | default('') | trim }}).
          Checked with the operator's own credential helper and ssh-agent
          DELIBERATELY EXCLUDED, because a scheduler has neither. Confirm the key
          is installed on the repository as a deploy key with read access.
        success_msg: >-
          The deploy key reads refs/heads/{{ keel_reconcile_channel_branch }},
          with no interactive credential in play.
