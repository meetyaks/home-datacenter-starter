---
# ─────────────────────────────────────────────────────────────────────────────
# roles/keel_reconcile — the DEV site controller.
#
# ═══ WHAT THIS ROLE IS, AND WHAT IT IS NOT ═══════════════════════════════════
#
# It DECIDES: read the channel, verify what it names, work out whether this host
# should move, and refuse when it should not. It does not deploy — `roles/keel`
# is the deployer and this role invokes it in release mode. There is exactly one
# thing here that knows how to put Keel on a host, and it is not this role.
#
# ⚠️ WHERE IT RUNS. On the administration console, which is already the Ansible
# control node. NOT on a CI runner — CI decides what is ELIGIBLE and publishes
# it; a site decides when to run it, and the two must not be the same authority
# or "CI is green" becomes "CI can deploy". And not as a daemon installed on the
# managed host either: a host that could decide what to run could decide wrongly
# and would need credentials to fetch releases.
# ─────────────────────────────────────────────────────────────────────────────

# ── WHICH CHANNEL, AND WHERE IT LIVES ───────────────────────────────────────
keel_reconcile_channel: dev
keel_reconcile_channel_repo: https://github.com/meetyaks/keel
keel_reconcile_channel_branch: release/dev
keel_reconcile_channel_path: channels/dev.json
keel_reconcile_channel_schema_version: keel.channel/v1

# Where the channel is fetched to on the CONTROLLER. Under the controller's own
# temp area: it is a cache of a published document, never state.
keel_reconcile_workdir: "/tmp/keel-reconcile-{{ keel_reconcile_channel }}"

# ── AUTOMATIC DEPLOYMENT ────────────────────────────────────────────────────
#
# True for DEV: the environment reconciles to eligible releases without a human
# in the loop. That is the point of this milestone. Set false to make the role
# report the drift and change nothing, which is what a PROD site would want.
keel_reconcile_auto_deploy: true

# ── STATE ON THE HOST ───────────────────────────────────────────────────────
#
# ⚠️ THE RECORD LIVES WHERE THE THING IT DESCRIBES LIVES. "What is this host
# running" is a fact about the host, so the answer is on the host — not in the
# controller's working directory, which is a laptop that may be reimaged, and
# not only in a log that rotates. It sits beside the role's existing builds/,
# data/, secrets/ and env/ directories and adds nothing to their semantics.
keel_reconcile_state_dir: "{{ keel_root }}/releases"
keel_reconcile_current_file: "{{ keel_reconcile_state_dir }}/current.json"
keel_reconcile_attempts_dir: "{{ keel_reconcile_state_dir }}/attempts"
keel_reconcile_evidence_dir: "{{ keel_reconcile_state_dir }}/evidence"

# ── THE LOCK ────────────────────────────────────────────────────────────────
#
# Two reconcilers deploying at once would interleave `docker compose up` with a
# migration, which is how a schema ends up half-applied. A systemd timer will
# not overlap ITSELF, but an operator running the playbook by hand while the
# timer fires is the ordinary case, not the exotic one.
keel_reconcile_lock_dir: "{{ keel_reconcile_state_dir }}/reconcile.lock"

# ⚠️ REPORTED, NEVER BROKEN AUTOMATICALLY. A lock older than this is probably
# stale — but "probably" is doing far too much work when being wrong means two
# deployments at once. The role refuses and prints the exact command to clear
# it, so a human decides whether the previous run is really gone.
keel_reconcile_lock_max_age_seconds: 3600

# ── RETRY POLICY ────────────────────────────────────────────────────────────
#
# ⚠️ A TIMER PLUS AN UNCONDITIONAL RETRY IS AN INFINITE RETRY. Without this, a
# release that cannot deploy would be attempted every time the timer fires,
# forever: restarting the stack each time, filling the evidence directory, and
# burying the first and only useful failure under a thousand identical ones.
#
# Two attempts: one for a genuinely transient failure (a registry blip, a
# temporarily unreachable host), and then it stops and waits for a person.
keel_reconcile_max_attempts: 2

# How many evidence directories to keep. Enough to see a regression and the two
# releases either side of it, bounded so it cannot fill the data volume.
keel_reconcile_evidence_keep: 20

# ── ESCALATION ──────────────────────────────────────────────────────────────
#
# When a deployment fails after migrations may have run, the release's own
# `migrations.requiresManualRecoveryOnFailure` says the site must escalate
# rather than claim a rollback fixed it. Keel's migrations are forward-only and
# there is no down-migration runner, so redeploying the previous image does NOT
# restore the previous schema.
keel_reconcile_auto_rollback: false
