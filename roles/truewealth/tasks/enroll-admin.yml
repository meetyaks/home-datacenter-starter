---
# First platform administrator, through the application's own CLI
# (dist/ops/platform-admin.mjs in the migrator image). The password travels
# ONLY on stdin: never an argument, never in output (every task that holds it
# is no_log). Registration is invite-only; this is the supported first-admin
# path.

- name: The email must look like an address
  ansible.builtin.assert:
    that:
      - truewealth_admin_email is match('^[^@\s]+@[^@\s]+\.[^@\s]+$')
    fail_msg: Pass -e truewealth_admin_email=<address>.
    quiet: true

- name: A password must have been entered
  ansible.builtin.assert:
    that:
      - truewealth_admin_password | default('') | length >= 12
    fail_msg: The administrator password must be at least 12 characters.
    quiet: true
  no_log: true

- name: The stack must be deployed (the CLI runs against its database)
  ansible.builtin.stat:
    path: "{{ truewealth_env_file }}"
  register: truewealth_enroll_env
  check_mode: false

- name: Refuse before a deployment exists
  ansible.builtin.assert:
    that:
      - truewealth_enroll_env.stat.exists
    fail_msg: Deploy TrueWealth first (playbooks/truewealth.yml).
    quiet: true

- name: Enroll the administrator
  ansible.builtin.command:
    argv: >-
      {{ (truewealth_compose_cmd | split) + ['--profile', 'ops', 'run', '--rm', '-T', 'migrate',
         'node', 'dist/ops/platform-admin.mjs', 'enroll',
         '--email', truewealth_admin_email, '--reason', truewealth_admin_reason] }}
    chdir: "{{ truewealth_root }}"
    stdin: "{{ truewealth_admin_password }}"
    stdin_add_newline: true
  register: truewealth_enroll
  changed_when: truewealth_enroll.rc == 0
  failed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Report the outcome (the CLI prints no secret)
  ansible.builtin.debug:
    msg: "{{ (truewealth_enroll.stdout | default('')) ~ ' ' ~ (truewealth_enroll.stderr | default('')) }}"
  when: not ansible_check_mode

- name: Enrollment must have succeeded
  ansible.builtin.assert:
    that:
      - truewealth_enroll.rc == 0
    fail_msg: Enrollment failed; see the message above.
    quiet: true
  when: not ansible_check_mode
