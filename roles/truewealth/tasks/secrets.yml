---
# Secrets land on the host as files, never as arguments, and never in output.
#
#   env/truewealth.env      0600 root:root   read by `docker compose` (root)
#   secrets/redis_password  0440 root:1001   mounted as a compose secret; read
#                                            by the app containers (gid 1001)
#                                            and the Redis wrapper (root)

- name: Write the Redis password file
  ansible.builtin.copy:
    dest: "{{ truewealth_redis_password_file }}"
    content: "{{ truewealth_vault_redis_password }}\n"
    owner: root
    group: "{{ truewealth_runtime_gid }}"
    mode: "0440"
  no_log: true
  register: truewealth_redis_secret

- name: Write the environment file
  ansible.builtin.template:
    src: truewealth.env.j2
    dest: "{{ truewealth_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: truewealth_env_written
  when: truewealth_images is defined

- name: Read the secret files' metadata
  ansible.builtin.stat:
    path: "{{ item }}"
  register: truewealth_secret_stat
  loop:
    - "{{ truewealth_redis_password_file }}"
    - "{{ truewealth_env_file }}"
  check_mode: false

- name: No secret file may be readable by other users
  # Checked on the real files, in every mode: a predicted write is not proof.
  ansible.builtin.assert:
    that:
      - not item.stat.exists or not (item.stat.roth | default(false))
      - not item.stat.exists or not (item.stat.woth | default(false))
      - not item.stat.exists or item.stat.pw_name == 'root'
    fail_msg: "{{ item.item }} is readable or writable by other users, or not root-owned."
    quiet: true
  loop: "{{ truewealth_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
