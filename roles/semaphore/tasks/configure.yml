---
# Directories, then the configuration file that holds three secrets.

- name: Create the state, config, log and backup directories
  # ⚠️ OWNED BY THE SERVICE ACCOUNT, NOT root. Semaphore writes its database,
  # its clones and its logs as itself. 0750 rather than 0755 so that ordinary
  # local accounts cannot list the state directory, which contains the
  # database and every cloned repository.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ semaphore_user }}"
    group: "{{ semaphore_group }}"
    mode: "0750"
  loop:
    - "{{ semaphore_state_dir }}"
    - "{{ semaphore_tmp_path }}"
    - "{{ semaphore_backup_dir }}"
    - "{{ semaphore_log_dir }}"
  become: true

- name: The configuration directory is readable but not writable by others
  ansible.builtin.file:
    path: "{{ semaphore_conf_dir }}"
    state: directory
    owner: root
    group: "{{ semaphore_group }}"
    mode: "0750"
  become: true

- name: Render the configuration
  # ⚠️ no_log BECAUSE THIS TASK HANDLES THREE SECRETS. Ansible echoes
  # template content on diff and on failure; without this, cookie_hash,
  # cookie_encryption and access_key_encryption reach the run log, the CI
  # transcript and anybody reading either.
  # (enforced: tests/semaphore-task-shape.yml "every task touching a secret
  #  sets no_log", mutation "removing no_log from the config template")
  #
  # ⚠️ 0600 AND OWNED BY THE SERVICE ACCOUNT. The daemon reads it; nothing
  # else may. A world-readable config here would publish the key that
  # decrypts every credential Semaphore stores.
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ semaphore_config_path }}"
    owner: "{{ semaphore_user }}"
    group: "{{ semaphore_group }}"
    mode: "0600"
  become: true
  no_log: true
  notify: Restart Semaphore

- name: Confirm the configuration is valid JSON before anything starts it
  # ⚠️ PARSED, NOT TRUSTED. A template that renders broken JSON produces a
  # daemon that exits immediately and a launchd job that retries forever.
  # This catches it while the old configuration is still the running one.
  # It reads the file as root and reports only the keys, never the values.
  ansible.builtin.command:
    cmd: "python3 -c \"import json,sys; d=json.load(open(sys.argv[1])); print(' '.join(sorted(d.keys())))\" {{ semaphore_config_path }}"
  register: semaphore_config_keys
  changed_when: false
  become: true

- name: The configuration must contain exactly the expected keys
  ansible.builtin.assert:
    that:
      - (semaphore_config_keys.stdout | trim | split(' ') | sort) ==
        ['access_key_encryption', 'cookie_encryption', 'cookie_hash',
         'dialect', 'git_client', 'interface', 'port', 'sqlite', 'tmp_path']
    fail_msg: >-
      The rendered configuration has keys
      "{{ semaphore_config_keys.stdout | trim }}". Either the template
      changed or it rendered something unexpected — check it before letting
      the service restart on it.
    success_msg: "Configuration parses and carries exactly the expected keys."
