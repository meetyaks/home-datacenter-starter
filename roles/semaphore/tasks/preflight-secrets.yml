---
# ─────────────────────────────────────────────────────────────────────────────
# EVERY SECRET IS PRESENT AND WELL-FORMED, BEFORE ANYTHING IS CREATED.
#
# ⚠️ THIS RUNS BEFORE THE FIRST MUTATION, DELIBERATELY. A run started without
# the vault must stop while the host is still untouched — not after it has
# created a service account, installed a binary and written a config with an
# empty encryption key. Half-installed is worse than not installed: the
# operator then has to work out what to undo.
#
# ⚠️ EMPTY COUNTS AS ABSENT. `vault_x | default('')` yields '' for an
# undefined variable, and '' is also what a vault entry left blank yields.
# Both are failures here; neither may reach a config file.
#
# ⚠️ no_log ON EVERY TASK THAT TOUCHES A VALUE. The assertions below compare
# lengths and shapes, never contents, and the failure messages name the
# variable rather than quoting it — but Ansible echoes task arguments on
# failure, which is enough on its own to leak a secret into a log or a CI
# transcript. (enforced: tests/semaphore-task-shape.yml "every task touching
# a secret sets no_log", and the mutation "removing no_log is caught")
# ─────────────────────────────────────────────────────────────────────────────

- name: Each required secret must be present and non-empty
  ansible.builtin.assert:
    that:
      - (item.value | default('') | trim | length) > 0
    fail_msg: >-
      {{ item.name }} is missing or empty. Define it in the vault; there is
      deliberately no default. Nothing has been installed or changed on this
      host.
    success_msg: "{{ item.name }} is present."
  loop:
    - { name: "vault_semaphore_cookie_hash", value: "{{ semaphore_cookie_hash }}" }
    - { name: "vault_semaphore_cookie_encryption", value: "{{ semaphore_cookie_encryption }}" }
    - { name: "vault_semaphore_access_key_encryption", value: "{{ semaphore_access_key_encryption }}" }
    - { name: "vault_semaphore_admin_password", value: "{{ semaphore_admin_password }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

# ⚠️ UPSTREAM VALIDATES THIS AND THE ERROR ARRIVES LATE. util/config.go
# refuses a key whose base64 does not decode to 16, 24 or 32 bytes:
#
#   access_key_encryption has invalid decoded length %d bytes;
#   AES requires 16, 24, or 32 bytes
#
# but it refuses at SERVER START — after the account, binary, config and
# launchd job all exist. Checking the shape here turns a half-installed
# service into a refusal.
- name: The AES keys must be base64 of a length AES actually accepts
  # ⚠️ THE BASE64 TEXT IS MEASURED, NOT THE DECODED BYTES — and the first
  # version of this check got it wrong in a way the Linux harness caught on
  # its first real run. `b64decode` in Jinja returns a STRING, decoded as
  # UTF-8; random key material is usually not valid UTF-8, so the resulting
  # string length bears no fixed relation to the byte length. One key passed
  # and an identically-generated one failed, which is the signature of a
  # check measuring the wrong thing rather than of a bad key.
  #
  # Base64 length maps to byte length exactly, so it is checked directly:
  #     16 bytes -> 24 chars    24 bytes -> 32 chars    32 bytes -> 44 chars
  # together with the character set, which rejects anything that is not
  # base64 at all.
  ansible.builtin.assert:
    that:
      - (item.value | trim) is match('^[A-Za-z0-9+/]+={0,2}$')
      - (item.value | trim | length) in [24, 32, 44]
    fail_msg: >-
      {{ item.name }} does not decode to 16, 24 or 32 bytes, so Semaphore
      will refuse it at startup. Generate one with:
      openssl rand -base64 32
    success_msg: "{{ item.name }} decodes to a valid AES key length."
  loop:
    - { name: "vault_semaphore_access_key_encryption", value: "{{ semaphore_access_key_encryption }}" }
    - { name: "vault_semaphore_cookie_encryption", value: "{{ semaphore_cookie_encryption }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: The administrator password must not be trivially weak
  # Upstream imposes no minimum. This repository does, because the account
  # this protects can run playbooks against every host in the inventory.
  ansible.builtin.assert:
    that:
      - (semaphore_admin_password | length) >= (semaphore_admin_password_min_length | int)
      - (semaphore_admin_password | lower) not in ['changeme', 'password', 'admin', 'semaphore']
    fail_msg: >-
      vault_semaphore_admin_password is shorter than
      {{ semaphore_admin_password_min_length }} characters, or is one of the
      obvious defaults. This account can run playbooks against every host in
      the inventory.
    success_msg: "The administrator password meets the length and content floor."
  no_log: true

- name: Say what was checked, without saying what any of it is
  ansible.builtin.debug:
    msg: >-
      All four secrets present, both AES keys a valid length, administrator
      password at least {{ semaphore_admin_password_min_length }} characters.
      Nothing above printed a value.
