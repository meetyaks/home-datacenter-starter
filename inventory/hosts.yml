---
all:
  children:
    linux_servers:
      hosts:
        dc1-x86:
          # ⚠️ AN ADDRESS, NOT A NAME, AND THAT IS THE WHOLE POINT. This said
          # `ansible_host: dc1-x86` — a name that resolved from nothing. There
          # was no DNS for dc1.lan, no `dc1-x86` entry in any hosts file and no
          # mDNS answer, so the controller could not connect at all; it had
          # worked once only because some stale resolver state happened to
          # answer.
          #
          # It also created a circular dependency that could not be broken
          # from inside: DNS is deployed BY Ansible, and Ansible needed DNS to
          # reach the host it would deploy DNS to. An address breaks the cycle
          # and keeps `inventory_hostname` as the identity everything else
          # refers to — the evidence paths, the group membership and the
          # release records all stay `dc1-x86`
          # (enforced: tests/dns-inventory.yml "Ansible reaches dc1-x86 by
          # address, not by a name DNS has to resolve first").
          #
          # The address is reserved on the router (10.0.0.3, MAC
          # 38:d5:7a:26:26:f7), so it is as durable as the DHCP lease table.
          ansible_host: 10.0.0.3
          ansible_user: labadmin
          ansible_ssh_private_key_file: ~/.ssh/home_datacenter_admin

    # ─────────────────────────────────────────────────────────────────────────
    # THE DEV ENVIRONMENT.
    #
    # dc1-x86 is in BOTH groups, and that is the intent: `linux_servers` is what
    # the host IS (a managed Linux box, where the vault and the base roles
    # apply), `keel_dev` is what it PLAYS (the DEV Keel environment). Separating
    # them means a second DEV host joins by being added here, and a future PROD
    # host is a different group on different hardware rather than a fork of the
    # variables.
    #
    # ⚠️ NO HOSTS ARE MOVED. dc1-x86 keeps every variable it had; this only adds
    # the identity in inventory/group_vars/keel_dev/.
    #
    # ⚠️ NEITHER CI VM IS HERE, AND NEITHER MAY BE. dc1-ci-1 runs Keel's CI and
    # dc1-ci-tw-1 runs Truewealth's; a CI runner in this group would be a runner
    # that deploys, and would need DEV's vault passphrase, its SSH key and a
    # route to its database. CI decides what is eligible; a site decides when to
    # run it. tests/dev-environment-identity.yml asserts this membership.
    # ─────────────────────────────────────────────────────────────────────────
    keel_dev:
      hosts:
        dc1-x86: {}

    # ─────────────────────────────────────────────────────────────────────────
    # THE LAN'S RESOLVERS.
    #
    # ⚠️ dc1-arm-1 IS IN THIS GROUP AND IN NO OTHER, DELIBERATELY. It is the
    # management node — a Mac — and it is NOT a `linux_server`: that group
    # carries the vault and the base Linux roles, and applying those to a Mac
    # would at best fail and at worst half-apply. It is not in `keel_dev`
    # either; it DRIVES the DEV deployment, it does not host it.
    #
    # ⚠️ TWO NODES BECAUSE THE ROUTER WILL POINT EVERY DHCP CLIENT HERE. One
    # resolver would make LAN name resolution a single point of failure,
    # including for the machine you would use to fix it. Both are authoritative
    # from the same Git content — there is no transfer between them
    # (enforced: tests/dns-zone.yml "both nodes render byte-identical zones").
    #
    # ⚠️ NEITHER CI RUNNER IS HERE EITHER, for the same reason they are kept
    # out of keel_dev: a runner that serves LAN DNS is a runner the whole house
    # depends on being up.
    # ─────────────────────────────────────────────────────────────────────────
    dns_servers:
      hosts:
        dc1-arm-1:
          # The management node, and the primary resolver.
          #
          # ⚠️ `local`, BECAUSE THE PLAYBOOK IS RUN ON THIS MACHINE — and the
          # address is recorded beside it so the node's identity is written
          # down rather than implied. There is deliberately no SSH-to-self.
          #
          # ⚠️ AND BECAUSE `local` IS A FOOTGUN, playbooks/dns.yml REFUSES TO
          # RUN UNLESS THIS MACHINE REALLY IS dc1-arm-1. Run on a workstation,
          # a local connection would happily install a LAN DNS server and a
          # launchd daemon THERE — permanent services on a laptop that leaves
          # the house, which is exactly what must not happen
          # (enforced: tests/dns-controller-identity.yml).
          ansible_host: 10.0.0.22
          ansible_connection: local
          coredns_bind_addresses:
            - 10.0.0.22
            - 127.0.0.1
        dc1-x86:
          # The secondary, on the runtime host. Its connection variables come
          # from `linux_servers` above; only the bind addresses are new.
          coredns_bind_addresses:
            - 10.0.0.3
            - 127.0.0.1
