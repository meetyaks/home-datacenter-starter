---
# ─────────────────────────────────────────────────────────────────────────────
# THE DEV ENVIRONMENT, NAMED.
#
# ═══ WHAT THIS FILE CHANGES ══════════════════════════════════════════════════
#
# Nothing about how the host runs. The Keel runtime on dc1-x86 has been the only
# one there is; it was never called anything, and "the lab" was doing the work
# of an environment name. That is fine until there is a second environment, at
# which point every sentence about "the Keel host" becomes ambiguous — including
# the ones in runbooks, alerts and incident notes written before the ambiguity
# existed.
#
# So this classifies the EXISTING runtime as DEV. It is a naming and an
# identity, not a migration: no data moves, no volume is recreated, and the
# stack is not rebuilt because of anything here.
#
# ⚠️ THE ONE OPERATIONAL CHANGE IS THE HOSTNAME, AND IT IS NOT AUTOMATIC.
# `keel_hostname` moves from `keel.dc1.lan` to `keel-dev.dc1.lan`, which changes
# the Caddy route, the JWT issuer, the OIDC issuer and the CORS origin — the
# issuer in particular appears in already-issued tokens, so applying it
# invalidates live sessions. It takes a DNS record that does not exist yet.
# Nothing here creates DNS; see docs/keel-dev-reconcile.md for the sequence.
#
# ⚠️ `keel.dc1.lan` IS RESERVED, NOT RECYCLED. It is the future PROD name, on
# separate hardware. Leaving DEV on it would mean the eventual PROD cutover has
# to take a name away from a running environment — the kind of change that gets
# done at 2am under pressure. Reserving it now costs one DNS record.
# ─────────────────────────────────────────────────────────────────────────────

# ── IDENTITY ────────────────────────────────────────────────────────────────
keel_environment: dev
keel_site: dc1
keel_hostname: keel-dev.dc1.lan

# ── RELEASE CONSUMPTION ─────────────────────────────────────────────────────
#
# DEV follows the `dev` channel and deploys eligible releases without a human in
# the loop. That is the point of this environment: main lands, CI proves the
# commit is safe to stand up, DEV runs it. A person who wants to stop that sets
# `keel_reconcile_auto_deploy: false` here.
keel_reconcile_channel: dev
keel_reconcile_auto_deploy: true

# ⚠️ STATED HERE RATHER THAN INHERITED. This is the file an operator reads to
# answer "what does DEV know about where its images came from", and that answer
# must not require knowing a role default — least of all when the answer is
# "less than you would assume".
#
# ⚠️ DEV ACCEPTS A RELEASE THAT HONESTLY SAYS IT COULD NOT BE ATTESTED, AND
# THIS LINE IS THE ONLY REASON IT MAY.
#
# GitHub cannot persist artifact attestations for a user-owned private
# repository, so the producer publishes `provenance.attestation.status:
# unavailable` with a reason rather than a release that merely looks signed
# (meetyaks/keel run 36689645463). The current channel release,
# keel-20261001T010103Z-5bb120c97b56, is exactly that.
#
# What DEV still gets, and what it gives up:
#
#   KEPT  immutable image digests, an SBOM identity, the migration head, the
#         bundle hash — it knows exactly what will run
#   LOST  any signature tying those bytes to a build in meetyaks/keel. A
#         manifest edited to name someone else's image would satisfy every
#         structural check.
#
# ⚠️ THIS IS A DEV-ONLY EXCEPTION AND MUST NOT BE COPIED. The role's default
# is `require_persisted`; a future PROD group inherits it by saying nothing.
# `tests/dev-environment-identity.yml` fails if any other inventory sets
# `allow_unavailable`, so spreading it is a test failure rather than a habit.
keel_release_provenance_policy: allow_unavailable

# ── DEPLOYMENT MODE ─────────────────────────────────────────────────────────
#
# ⚠️ DEV RUNS WITH KEEL'S PRODUCTION VALIDATOR OFF, AND THIS LINE IS THE ONLY
# REASON IT MAY.
#
# `assertProductionSafe` requires OIDC whenever dev login is off, and dev
# login is itself forbidden in production. This deployment offers PASSWORD
# sign-in and has no identity provider — and it cannot be its own, because a
# self-referential issuer is refused at boot. So `production` here has no
# valid configuration at all: the gateway pulls, migrates, and then
# crash-loops with "OIDC configuration is required in production but is
# incomplete".
#
# That is exactly what happened on 2026-10-01: migrations applied, gateway
# dead, site down. roles/keel now refuses the combination in preflight, and
# this line is how DEV says which mode it can actually run.
#
# What that costs, and what it does not:
#
#   KEPT  the real keys from the vault — this mode PERMITS source-visible
#         fallbacks, it does not introduce them. KEEL_ALLOW_DEV_LOGIN stays
#         off, so no dev login appears. Digest-pinned images, the provenance
#         policy and the bundle hash are all unaffected.
#   LOST  the production validator's other checks: database URLs over TLS,
#         no demo-marker credentials, CORS an explicit allowlist. None of
#         those is wrong on dc1-x86 today, and nothing will say so if one
#         becomes wrong.
#
# ⚠️ SET THIS BACK TO `production` — or simply delete the line, since that is
# the default — the moment either is true: a real OIDC provider is
# configured, or Keel supports production mode with password-only
# authentication. A future PROD environment inherits `production` by saying
# nothing, and will be REFUSED in preflight until it has a provider, which
# is the right way round.
keel_deployment_mode: development
