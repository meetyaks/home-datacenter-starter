# ─────────────────────────────────────────────────────────────────────────────
# The DEV delivery suites, run on every change to what they cover.
#
# ⚠️ WHY THIS EXISTS. Until now nothing in CI ran this repository's tests at all
# — `tests/run-all.sh` is invoked by hand, and the only workflow here publishes
# MinIO images. A guard that depends on somebody remembering to run it is a
# convention, not an enforcement, and the DEV delivery path's whole value is in
# its guards: digest-only images, provenance verification, the backwards
# refusal, the retry bound, the deployment lock.
#
# ⚠️ WHY NOT ALL OF `run-all.sh`. The rest of that script needs Docker
# containers with systemd, and one step reaches a real registry to ask "can
# this be fetched anonymously right now". Both belong on a machine someone
# owns, not on an ephemeral hosted runner — and a lane that is red for reasons
# unrelated to the change stops being read. The suites below are
# controller-only: they create nothing outside /tmp and contact nothing.
#
# ⚠️ NOT `self-hosted`. That label is dc1-ci-1, which is Keel's CI runner. A
# deployment repository's tests running on a CI VM is the first step towards a
# CI VM that deploys, which is the boundary this whole design keeps.
# ─────────────────────────────────────────────────────────────────────────────
name: DEV delivery tests

on:
  push:
    branches: [main, 'deploy/**']
    paths: &covered
      - 'roles/keel/**'
      - 'roles/keel_reconcile/**'
      # ⚠️ roles/coredns AND playbooks/ ARE COVERED TOO. Without these, a
      # change to the LAN resolvers or to playbooks/dns.yml would land with
      # the suites below never running — and the DNS guards are exactly the
      # kind that pass by agreeing with whatever is in front of them.
      - 'roles/coredns/**'
      - 'playbooks/**'
      - 'docs/dc1-lan-dns.md'
      - 'playbooks/keel-reconcile.yml'
      - 'inventory/**'
      - 'tests/**'
      - 'scripts/**'
      - 'bin/**'
      - '.github/workflows/dev-delivery-tests.yml'
  pull_request:
    paths: *covered

concurrency:
  group: dev-delivery-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: Controller-only suites
    runs-on: ubuntu-latest
    # Two mutation suites, each re-running several playbooks once per
    # mutation, so this lane is tens of minutes rather than seconds. 15 → 30
    # when the provenance mutations landed, 30 → 45 with the credential ones.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet ansible-core
          ansible --version

      # ── Every play below runs the ROLE'S OWN tasks against fixtures. None of
      #    them restates an assertion, so a guard that is deleted from a role
      #    fails here rather than passing against a copy.

      - name: DEV environment identity
        run: ansible-playbook tests/dev-environment-identity.yml

      # ⚠️ THE 2026-10-01 OUTAGE, AS A TEST. `production` + password-only has
      #    no valid configuration in Keel, and the deployment did not notice:
      #    it pulled, verified the bundle and APPLIED MIGRATIONS before the
      #    gateway crash-looped on the OIDC requirement. The refusal cases here
      #    are themselves the proof the guard fires, so this needs no mutation
      #    runner — if the guard stopped refusing, they go red.
      - name: Deployment mode vs sign-in methods
        run: ansible-playbook tests/deployment-mode.yml

      - name: Release contract — the site's own reader
        run: ansible-playbook tests/release-contract.yml

      - name: Reconcile decisions
        run: ansible-playbook tests/reconcile-decisions.yml

      - name: Deployment lock
        run: ansible-playbook tests/reconcile-lock.yml

      - name: Reconcile boundaries
        run: ansible-playbook tests/reconcile-boundaries.yml

      # ⚠️ TWO ASSERTIONS IN THIS SUITE DO NOT RUN HERE, AND IT IS WORTH BEING
      #    PRECISE ABOUT WHICH. The suite asks the machine which operating
      #    system it is; this runner is ubuntu-latest and the DEV console is a
      #    Mac, so `plutil -lint` and "a Mac controller must have a launchd
      #    plist" are skipped. EVERYTHING ELSE RUNS — including the KeepAlive,
      #    RunAtLoad, StartInterval and credential-scan checks, which read the
      #    plist as text and need no Mac. The two skipped assertions are proved
      #    on the console itself by tests/run-all.sh.
      - name: Controller scheduler — one entrypoint, no restart loop, no secrets
        run: ansible-playbook tests/controller-scheduler.yml

      - name: The wrapper, executed — exit status and concurrency
        run: tests/run-wrapper-behaviour.sh

      # ⚠️ NEITHER CREDENTIAL EXISTS YET, AND THIS LANE CANNOT CREATE ONE. What
      #    it proves is that the code refuses without a credential, keeps the
      #    token off the command line and out of the logs, and gives it back on
      #    every path. Those have to be right BEFORE a real credential is
      #    created — afterwards a mistake is a disclosed secret, not a red test.
      - name: Credential contract — deploy key and registry token
        run: ansible-playbook tests/credential-contract.yml

      # ⚠️ OFFLINE AND PORTABLE. Every case is a locally generated fixture, so
      #    this proves the host-key verifier rejects a tampered document
      #    without needing GitHub to be reachable or a particular OS.
      # Guards the narrowing of the anonymous-pull gate: cached-but-refused
      # must not block, genuinely-absent must.
      - name: Unpullable vs unobtainable
        run: ansible-playbook tests/anon-pull-classify.yml

      - name: GitHub host-key pin — verified, not merely fetched
        run: tests/run-known-hosts-pin.sh

      - name: Reconcile check mode — a real --check run
        run: tests/run-reconcile-check-mode.sh

      # ⚠️ THE ONE SUITE WHOSE INPUT THIS REPOSITORY DID NOT WRITE. Every
      #    fixture above agrees with the reader because the same hand wrote
      #    both. This runs the reader against a byte-for-byte copy of the
      #    document meetyaks/keel actually published to release/dev.
      #
      #    Its check-mode companion needs a Keel checkout containing the
      #    published commit, which a hosted runner does not have, so it is
      #    deliberately NOT run here — it would SKIP, and a step that always
      #    skips is a step nobody reads. It runs from tests/run-all.sh on a
      #    console that has the checkout.
      - name: The published release, read by this reader
        run: ansible-playbook tests/published-release-proof.yml

      # ⚠️ A GUARD THAT HAS NEVER FAILED IS NOT A GUARD. Breaks the provenance
      #    policy eleven ways in turn and proves the suites above go red FOR
      #    THAT REASON. This is what makes the three suites above load-bearing
      #    rather than decorative; without it, a deleted assertion is a silent
      #    green.
      - name: Provenance mutations — every guard is proved to fail
        run: tests/run-provenance-mutations.sh

      # The same discipline, applied to the guards that protect secrets. One
      # of its seventeen mutations breaks the plist's XML, and the guard that
      # catches it is `plutil -lint` — a Mac tool. It SKIPS here, loudly, and
      # is proved on the console itself, which is the machine that has to
      # load the file.
      - name: Scheduler and credential mutations
        run: tests/run-auth-mutations.sh

      # ── LAN DNS ──────────────────────────────────────────────────────────
      #
      # ⚠️ dc1.lan WAS NEVER DNS. `keel.dc1.lan` resolved from one line in one
      #    workstation's /etc/hosts; the router served no dc1.lan record and
      #    no host ran a resolver. These suites hold the replacement honest,
      #    and they are controller-only — they render the role's own
      #    templates, bind no port and install nothing.
      #
      # ⚠️ LAST, AND THAT ORDERING IS A LESSON RATHER THAN A PREFERENCE. These
      #    steps were first placed immediately after "DEV environment
      #    identity". The mutation runner then failed on this runner — it used
      #    `sed -i ''`, which is BSD syntax that GNU sed does not accept — and
      #    because a failed step aborts the job, ALL THIRTEEN established
      #    suites below were skipped. One new suite with a portability bug took
      #    out the entire lane's signal, including the Keel release guards that
      #    had nothing to do with it. New suites go after the proven ones.
      - name: LAN DNS — zone, pins, forwarding and ACL
        run: ansible-playbook tests/dns-zone.yml

      # ⚠️ ONE ASSERTION HERE IS MAC-ONLY AND SKIPS LOUDLY: `plutil -lint` on
      #    the rendered CoreDNS plist. Everything else in this suite reads the
      #    plist as text and needs no Mac. The parse is proved on dc1-arm-1 by
      #    tests/run-all.sh, which is the machine that loads the file.
      - name: LAN DNS — launchd and systemd definitions
        run: ansible-playbook tests/dns-services.yml

      # ⚠️ THE FAILURE THAT STOPPED THE FIRST WATCHED DEPLOYMENT, as a test.
      #    Running playbooks/dns.yml from dc1-arm-1 died on the primary with
      #    "Command /usr/bin/tar detected as tar type bsd. GNU tar required."
      #    — after the pinned checksum had matched. It reads the task file as
      #    YAML, so it asserts on executable structure, not on comments, and
      #    runs happily on a Linux runner because it parses rather than
      #    executes.
      - name: LAN DNS — the macOS/Linux extraction split
        run: ansible-playbook tests/dns-install-platform.yml

      - name: LAN DNS — inventory reaches dc1-x86 by address
        run: ansible-playbook tests/dns-inventory.yml

      # ⚠️ RUNS THE GUARD AND REQUIRES THE REFUSAL. This runner is not
      #    dc1-arm-1, so the guard must refuse here — which is exactly the case
      #    worth testing — and it confirms the attempt installed nothing.
      - name: LAN DNS — the management-node guard refuses a non-controller
        run: tests/run-dns-controller-guard.sh

      # ⚠️ tests/run-dns-corefile-parse.sh IS DELIBERATELY NOT HERE. It starts
      #    the real CoreDNS binary, which means fetching the pinned release —
      #    network, like run-remote-image-check.sh, which lives in run-all.sh
      #    for the same reason. It runs on the console, which is also where the
      #    Corefile will actually be loaded.
      - name: LAN DNS mutations — every guard is proved to fail
        run: tests/run-dns-mutations.sh

      # ── The static guard check from the existing preflight suite. Its runtime
      #    half needs a source tree this runner does not have, so only the
      #    static half runs here; the full script stays in run-all.sh.
      - name: Every mutating phase is still guarded under --check
        run: |
          set -euo pipefail
          missing=0
          guards=$(awk -f tests/lib/guard-check.awk roles/keel/tasks/main.yml)
          for phase in source build release-bundle deploy caddy verify; do
            if echo "$guards" | grep -qx "$phase guarded"; then
              echo "  ok         $phase.yml is guarded"
            else
              echo "  UNGUARDED  $phase.yml would run under --check"
              missing=$((missing + 1))
            fi
          done
          for phase in preflight secrets release; do
            if echo "$guards" | grep -qx "$phase UNGUARDED"; then
              echo "  ok         $phase.yml runs in both modes, as it must"
            else
              echo "  WRONG      $phase.yml is guarded; check mode would validate nothing"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ] || { echo "FAILED: ${missing} phase(s) wrong."; exit 1; }
